<title>澜绣云裳 · 智能工作站</title>
<nav class="sitenav"><!--NAV--></nav>
<style>
:root{
  --bg:#F5F7FA; --surface:#FFFFFF; --surface2:#F0F3F8;
  --ink:#20242B; --muted:#5E6673; --faint:#8B93A1;
  --line:#E4E8EF; --line2:#CDD4DF;
  --accent:#8C4356; --accent-ink:#6E2F40; --accent-soft:#FBEEF1; --accent-line:#EBCBD4;
  --warn:#D97A00; --warn-soft:#FFF1E0; --crit:#E5484D; --crit-soft:#FDEAEA;
  --info:#0E9384; --info-soft:#E0F3F0;
  --shadow:0 1px 2px rgba(31,41,55,.05),0 4px 16px rgba(31,41,55,.06);
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#11141A; --surface:#191E27; --surface2:#202734;
  --ink:#E6E9EF; --muted:#9AA4B2; --faint:#6E7787;
  --line:#272E3A; --line2:#343D4C;
  --accent:#D98BA0; --accent-ink:#E9AEBE; --accent-soft:#2E1B22; --accent-line:#4A2C36;
  --warn:#F0A34E; --warn-soft:#33260F; --crit:#F4766C; --crit-soft:#3A1D1A;
  --info:#4CC3B4; --info-soft:#12332E;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 16px rgba(0,0,0,.25);
}}
:root[data-theme="dark"]{
  --bg:#11141A; --surface:#191E27; --surface2:#202734;
  --ink:#E6E9EF; --muted:#9AA4B2; --faint:#6E7787;
  --line:#272E3A; --line2:#343D4C;
  --accent:#D98BA0; --accent-ink:#E9AEBE; --accent-soft:#2E1B22; --accent-line:#4A2C36;
  --warn:#F0A34E; --warn-soft:#33260F; --crit:#F4766C; --crit-soft:#3A1D1A;
  --info:#4CC3B4; --info-soft:#12332E;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 16px rgba(0,0,0,.25);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--ink);
 font:14px/1.65 -apple-system,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
 -webkit-font-smoothing:antialiased}
.serif{font-family:"Songti SC","STSong","Noto Serif CJK SC",serif}
.num{font-variant-numeric:tabular-nums}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer;padding:0}
button:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
code{font:12px ui-monospace,Menlo,monospace;background:var(--surface2);padding:1px 5px;border-radius:4px}

/* 顶栏 */
.topbar{position:sticky;top:0;z-index:40;height:52px;display:flex;align-items:center;gap:16px;
 padding:0 18px;background:var(--surface);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px;flex:none}
.seal{width:30px;height:30px;border-radius:7px;background:var(--accent);color:#fff;display:grid;
 place-items:center;font-family:"Songti SC","STSong",serif;font-size:19px;font-weight:700;line-height:1}
.brand b{font-family:"Songti SC","STSong",serif;font-size:17px;letter-spacing:.5px}
.scopechip{display:flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;
 background:var(--accent-soft);color:var(--accent-ink);border:1px solid var(--accent-line);
 font-size:12px;font-weight:600;flex:none}
.nav{display:flex;gap:2px;margin:0 auto}
.nav button{padding:6px 15px;border-radius:8px;font-size:14px;color:var(--muted);font-weight:500}
.nav button:hover{background:var(--surface2);color:var(--ink)}
.nav button.on{background:var(--accent-soft);color:var(--accent-ink);font-weight:600}
.topbtns{display:flex;gap:8px;flex:none;align-items:center}
.ghostbtn{padding:5px 11px;border-radius:8px;border:1px solid var(--line2);font-size:13px;color:var(--muted)}
.ghostbtn:hover{background:var(--surface2);color:var(--ink)}
.qbtn{width:28px;height:28px;border-radius:999px;border:1px solid var(--line2);color:var(--muted);
 display:grid;place-items:center;font-weight:700;font-size:14px}
.qbtn:hover{background:var(--accent-soft);color:var(--accent-ink);border-color:var(--accent-line)}

/* 骨架 */
.shell{display:flex;min-height:calc(100vh - 52px)}
main{flex:1;min-width:0}
.wrap{max-width:1080px;margin:0 auto;padding:20px 22px 64px}
.screen{display:none}.screen.on{display:block}
.pagehead{display:flex;align-items:baseline;gap:12px;margin:0 0 14px}
.pagehead h1{font-size:20px;margin:0;font-weight:650}
.pagehead .why{font-size:12.5px;color:var(--faint)}

/* 卡片 */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.cardpad{padding:16px 18px}
.grid{display:grid;gap:12px}
.k4{grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.kpi .k{font:11px ui-monospace,Menlo,monospace;letter-spacing:.09em;text-transform:uppercase;color:var(--faint)}
.kpi .v{font-size:27px;font-weight:650;line-height:1.25;font-variant-numeric:tabular-nums;margin-top:2px}
.kpi .n{font-size:12px;color:var(--muted);line-height:1.5}
.kpi.bad .v{color:var(--crit)} .kpi.warn .v{color:var(--warn)} .kpi.good .v{color:var(--info)}

/* 表 */
table{width:100%;border-collapse:collapse;font-size:13.2px}
th,td{padding:9px 12px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{font-size:11.5px;letter-spacing:.06em;color:var(--faint);text-transform:uppercase;font-weight:600}
tbody tr:hover{background:var(--surface2)}
.scroll{overflow-x:auto}
.pill{display:inline-flex;align-items:center;padding:2px 9px;border-radius:999px;font-size:11.5px;font-weight:600;
 background:var(--surface2);color:var(--muted);border:1px solid var(--line)}
.pill.ok{background:var(--info-soft);color:var(--info);border-color:transparent}
.pill.warn{background:var(--warn-soft);color:var(--warn);border-color:transparent}
.pill.crit{background:var(--crit-soft);color:var(--crit);border-color:transparent}
.pill.acc{background:var(--accent-soft);color:var(--accent-ink);border-color:var(--accent-line)}

/* 面料 */
.fabgrid{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(232px,1fr))}
.fab{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:13px 15px;
 box-shadow:var(--shadow);cursor:pointer;text-align:left;display:flex;flex-direction:column;gap:7px;transition:.12s}
.fab:hover{border-color:var(--accent-line);transform:translateY(-1px)}
.fab .sw{height:44px;border-radius:7px;border:1px solid var(--line)}
.fab .nm{font-size:15px;font-weight:650;display:flex;align-items:center;gap:7px}
.fab .bf{font-size:12.3px;color:var(--muted);line-height:1.55;
 display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.fab .sp{display:flex;gap:10px;font:11.5px ui-monospace,Menlo,monospace;color:var(--faint);flex-wrap:wrap}
.filters{display:flex;gap:7px;flex-wrap:wrap;margin:0 0 13px;align-items:center}
.filters button{font-size:12.5px;padding:4px 12px;border-radius:999px;border:1px solid var(--line2);color:var(--muted)}
.filters button.on{background:var(--accent-soft);color:var(--accent-ink);border-color:var(--accent-line);font-weight:600}
.filters input{font:inherit;font-size:13px;padding:5px 11px;border:1px solid var(--line2);border-radius:8px;
 background:var(--surface);color:inherit;min-width:150px}

/* ── 学堂(并自 demo,框架同为 10-高保真原型 的学习应用)──────────
   「?」弹层已经占了 .teach,所以教学卡叫 .lcard —— 同名互相覆盖这个项目栽过两次。 */
.ltabs{display:flex;gap:18px;margin-bottom:14px}
.ltabs button{font-weight:600;font-size:13.5px;color:var(--faint);padding-bottom:6px;border-bottom:2px solid transparent}
.ltabs button.on{color:var(--accent-ink);border-color:var(--accent)}
.ltab{display:none}.ltab.on{display:block}
.subject{margin:22px 0 10px;display:flex;align-items:baseline;gap:10px}
.subject h2{font-family:"Songti SC","STSong",serif;font-size:17px;margin:0}
.subject small{color:var(--faint);font-size:12px}
.modgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(225px,1fr));gap:12px}
.modcard{display:flex;flex-direction:column;gap:8px;text-align:left;padding:15px;background:var(--surface);
 border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);transition:transform .15s,border-color .15s}
.modcard:hover{transform:translateY(-2px);border-color:var(--accent-line)}
.modcard .t{font-size:15px;font-weight:700;display:flex;align-items:center;gap:7px}
.modcard .d{font-size:12.4px;color:var(--muted);line-height:1.6}
.barrow{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--faint)}
.track{flex:1;height:8px;border-radius:4px;background:var(--surface2);overflow:hidden}
.fill{height:100%;border-radius:4px;background:var(--accent)}
.fill.w{background:var(--warn)} .fill.c{background:var(--crit)}

/* 左树 + 右教学卡 */
.learn{display:grid;grid-template-columns:230px minmax(0,1fr);gap:16px}
@media(max-width:900px){.learn{grid-template-columns:1fr}}
.tree{font-size:13.4px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);
 padding:8px;max-height:74vh;overflow-y:auto;box-shadow:var(--shadow)}
.tree .grp{padding:8px 10px 4px;color:var(--faint);font-size:10.5px;letter-spacing:.12em;font-weight:600}
.tree button{width:100%;display:flex;align-items:center;gap:8px;text-align:left;padding:6px 10px;
 border-radius:7px;color:var(--muted)}
.tree button:hover{background:var(--surface2);color:var(--ink)}
.tree button.on{background:var(--accent-soft);color:var(--accent-ink);font-weight:600}
.tree .sw{width:14px;height:14px;border-radius:4px;border:1px solid var(--line);flex:none}
.tree .lv{margin-left:auto;font-size:10px}

.lcard{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.lhead{display:flex;align-items:flex-start;gap:12px;padding:16px 20px;border-bottom:1px solid var(--line)}
.lhead .kpid{font:11.5px ui-monospace,Menlo,monospace;color:var(--faint)}
.lhead h2{margin:2px 0 0;font-size:19px;font-family:"Songti SC","STSong",serif}
.lbody{padding:4px 20px 18px}
.sect{margin-top:16px}
.sect h3{font-size:12px;margin:0 0 6px;color:var(--accent-ink);letter-spacing:.06em;text-transform:uppercase}
.sect p{margin:6px 0;max-width:62ch;color:var(--muted);font-size:13.4px;line-height:1.75}
.sect b{color:var(--ink)}
.kv{display:grid;grid-template-columns:repeat(auto-fit,minmax(104px,1fr));gap:9px;margin-top:8px}
.kv div{background:var(--surface2);border-radius:8px;padding:9px 11px}
.kv .k{font-size:10.5px;letter-spacing:.08em;color:var(--faint);text-transform:uppercase}
.kv .v{font-size:16px;font-weight:700;font-variant-numeric:tabular-nums;margin-top:1px}
.steps{counter-reset:st;list-style:none;margin:8px 0 0;padding:0}
.steps li{counter-increment:st;position:relative;padding:9px 13px 9px 38px;margin-bottom:7px;
 background:var(--surface2);border-radius:8px;max-width:66ch;font-size:13.2px}
.steps li::before{content:counter(st);position:absolute;left:12px;top:9px;width:18px;height:18px;
 border-radius:50%;background:var(--accent);color:#fff;font-size:11px;font-weight:700;
 display:grid;place-items:center}
.pitfall{border-left:3px solid var(--crit);background:var(--crit-soft);border-radius:0 8px 8px 0;
 padding:10px 14px;max-width:66ch;font-size:13.2px;margin-top:8px}
.lfoot{display:flex;flex-wrap:wrap;gap:10px;padding:13px 20px;border-top:1px solid var(--line);align-items:center}

/* 翻卡 */
.flipgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px}
.flip{perspective:800px;cursor:pointer}
.flipinner{position:relative;transition:transform .45s;transform-style:preserve-3d;min-height:118px}
.flip.f .flipinner{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;border-radius:var(--r);padding:13px 15px;
 display:flex;flex-direction:column;gap:6px;background:var(--surface);border:1px solid var(--line);
 box-shadow:var(--shadow)}
.face.b{transform:rotateY(180deg);background:var(--accent-soft);border-color:var(--accent-line)}
.face .nm{font-size:16px;font-weight:700;font-family:"Songti SC","STSong",serif}
.face .hint{font-size:11.5px;color:var(--faint);margin-top:auto}
.face .row{display:flex;justify-content:space-between;font-size:12.4px;color:var(--muted)}
.face .row b{color:var(--ink);font-variant-numeric:tabular-nums}

/* 练习 */
.stem{font-size:15px;line-height:1.75;margin:0 0 12px}
.opt{display:block;width:100%;text-align:left;padding:11px 14px;border:1px solid var(--line2);
 border-radius:9px;margin-bottom:8px;font-size:13.6px;transition:.14s}
.opt:hover{border-color:var(--accent);transform:translateX(2px)}
.opt.right{background:var(--ok-soft);border-color:var(--ok);color:var(--ok);font-weight:600}
.opt.wrong{background:var(--crit-soft);border-color:var(--crit);color:var(--crit)}
.expl{background:var(--surface2);border-radius:9px;padding:12px 15px;font-size:13.2px;
 line-height:1.75;color:var(--muted);margin-top:10px}
.expl b{color:var(--ink)}


/* 智能体侧栏 */
aside.agent{width:372px;flex:none;background:var(--surface);border-left:1px solid var(--line);
 display:flex;flex-direction:column;position:sticky;top:52px;height:calc(100vh - 52px)}
aside.agent.off{display:none}
.aghead{flex:none;display:flex;align-items:center;gap:9px;padding:11px 14px;border-bottom:1px solid var(--line)}
.aghead .t{font-weight:700;font-size:14px}
.aghead select{font:inherit;font-size:12.5px;padding:3px 8px;border:1px solid var(--line2);border-radius:7px;
 background:var(--surface2);color:inherit;margin-left:auto}
.agbody{flex:1;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:11px}
.msg{max-width:90%;padding:9px 12px;border-radius:12px;font-size:13.2px;line-height:1.62;white-space:pre-wrap}
.msg.ai{background:var(--surface2);border-bottom-left-radius:4px;align-self:flex-start}
.msg.me{background:var(--accent);color:#fff;border-bottom-right-radius:4px;align-self:flex-end}
.msg .ctx{display:block;font-size:11px;color:var(--faint);margin-bottom:5px;
 font-family:ui-monospace,Menlo,monospace}
.agfoot{flex:none;border-top:1px solid var(--line);padding:9px 12px 12px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:9px}
.chips button{font-size:12px;padding:4px 10px;border-radius:999px;border:1px solid var(--line2);color:var(--muted)}
.chips button:hover{border-color:var(--accent-line);color:var(--accent-ink)}
.inputrow{display:flex;gap:7px}
.inputrow textarea{flex:1;font:inherit;font-size:13.2px;padding:8px 11px;border:1px solid var(--line2);
 border-radius:9px;background:var(--surface);color:inherit;resize:none;height:56px}
.send{padding:0 15px;border-radius:9px;background:var(--accent);color:#fff;font-weight:600;font-size:13px}
.send[disabled]{opacity:.5;cursor:default}

/* 教学层 */
.overlay{position:fixed;inset:0;z-index:80;background:rgba(16,20,28,.5);display:none;
 align-items:flex-start;justify-content:center;padding:44px 18px;overflow-y:auto}
.overlay.on{display:flex}
.teach{background:var(--surface);border-radius:14px;max-width:660px;width:100%;box-shadow:0 18px 60px rgba(0,0,0,.28)}
.teachhead{display:flex;align-items:flex-start;gap:12px;padding:17px 22px;border-bottom:1px solid var(--line)}
.teachhead .kpid{font:11.5px ui-monospace,Menlo,monospace;color:var(--faint)}
.teachhead h2{margin:2px 0 0;font-size:18px}
.teachhead .x{margin-left:auto;font-size:17px;color:var(--faint)}
.teachbody{padding:4px 22px 18px;max-height:64vh;overflow-y:auto}
.sect{margin-top:16px}
.sect h3{display:flex;align-items:center;gap:8px;font-size:12.5px;margin:0 0 6px;color:var(--accent-ink);
 letter-spacing:.06em;text-transform:uppercase}
.sect p{margin:0 0 8px;color:var(--muted);font-size:13.4px;line-height:1.72}
.sect b{color:var(--ink)}
.sect table{margin-top:6px}
.teachfoot{padding:12px 22px;border-top:1px solid var(--line);font-size:12.3px;color:var(--faint)}
@media(max-width:900px){aside.agent{display:none}.nav{gap:0}.nav button{padding:6px 9px;font-size:13px}}
</style>

<div class="topbar">
  <div class="brand"><span class="seal">澜</span><b>澜绣云裳</b></div>
  <span class="scopechip" id="scope">加载中</span>
  <nav class="nav" id="nav">
    <button data-s="dash" class="on">值班台</button>
    <button data-s="queue">研判队列</button>
    <button data-s="fabric">面料学堂</button>
    <button data-s="wearer">着装人</button>
    <button data-s="health">智能体健康</button>
  </nav>
  <div class="topbtns">
    <button class="qbtn" id="help" title="这一屏在讲什么">?</button>
    <button class="ghostbtn" id="theme">主题</button>
    <button class="ghostbtn" id="agtoggle">智能体</button>
  </div>
</div>

<div class="shell">
<main><div class="wrap">

  <section class="screen on" data-s="dash">
    <div class="pagehead"><h1>值班台</h1><span class="why">今天还剩多少件 · 超时几件 · 最久等了多久</span></div>
    <div class="grid k4" id="kpis"></div>
    <div class="card cardpad" style="margin-top:14px">
      <div style="display:flex;align-items:center;gap:10px;margin-bottom:10px">
        <b>队列最前面</b><span class="pill" id="qhint">超时优先</span>
        <button class="ghostbtn" id="run3" style="margin-left:auto">让智能体研判 3 条</button>
      </div>
      <div class="scroll"><table>
        <thead><tr><th>工单</th><th>类型</th><th>等待</th><th>时效</th><th>状态</th><th>智能体判的根因</th></tr></thead>
        <tbody id="dashrows"><tr><td colspan="6">加载中…</td></tr></tbody>
      </table></div>
      <div style="font-size:12.3px;color:var(--faint);margin-top:8px" id="runmsg"></div>
    </div>
  </section>

  <section class="screen" data-s="queue">
    <div class="pagehead"><h1>研判队列</h1><span class="why">智能体交草稿,你采纳 / 改判 / 升级</span></div>
    <div class="card cardpad"><div class="scroll"><table>
      <thead><tr><th>工单</th><th>类型</th><th>等待</th><th>时效</th><th>状态</th><th>根因</th><th>置信度</th></tr></thead>
      <tbody id="queuerows"><tr><td colspan="7">加载中…</td></tr></tbody>
    </table></div></div>
  </section>

  <section class="screen" data-s="fabric">
    <div class="ltabs" id="ltabs">
      <button data-l="learn" class="on">面料学习</button>
      <button data-l="card">速记卡</button>
      <button data-l="quiz">现场练习</button>
    </div>
    <div class="ltab on" data-l="learn">
      <div class="filters" id="fabfilters">
        <button data-f="all" class="on">全部</button>
        <button data-f="public">可对客户说</button>
        <button data-f="scale">行业参考</button>
        <button data-f="demo">内部演示</button>
        <button data-f="stock">有现货</button>
        <input id="fabq" placeholder="搜面料名或别名…">
        <span style="font-size:12.3px;color:var(--faint)" id="fabcount"></span>
      </div>
      <div class="learn"><div class="tree" id="tree"></div><div id="teach"></div></div>
    </div>
    <div class="ltab" data-l="card">
      <div class="subject"><h2>速记卡</h2><small>点一下翻面 —— 正面记名字,背面记那几个数</small></div>
      <div class="flipgrid" id="flips"></div>
    </div>
    <div class="ltab" data-l="quiz">
      <div class="subject"><h2>现场练习</h2><small>客户原话 → 你会怎么接</small></div>
      <div class="card cardpad" id="quiz"></div>
    </div>
  </section>

  <section class="screen" data-s="wearer">
    <div class="pagehead"><h1>着装人</h1><span class="why">谁付钱,和衣服穿在谁身上,是两回事</span></div>
    <div class="grid k4" id="wkpis"></div>
    <div class="card cardpad" style="margin-top:14px"><div class="scroll"><table>
      <thead><tr><th>账户</th><th>手机号</th><th>联系</th><th>账户状态</th><th>姓名</th><th>关系</th><th>性别</th><th>年龄</th><th>最近身高</th><th>上次量体</th><th>状态</th><th>同意</th></tr></thead>
      <tbody id="wrows"><tr><td colspan="12">加载中…</td></tr></tbody>

          相容矩阵里标「未定义」的格子<b>不许推断</b>,转工艺负责人。</div></div>

let QI=0;
function quiz(){
  const q=QUIZ[QI%QUIZ.length];

    <p class="stem">${esc(q.q)}</p>

    <div id="qexpl"></div>`;
}
$("#quiz").addEventListener("click",e=>{
  const b=e.target.closest(".opt");
  if(b){
    const q=QUIZ[QI%QUIZ.length], i=+b.dataset.i;
    document.querySelectorAll("#quiz .opt").forEach((x,j)=>{
      if(j===q.a) x.classList.add("right"); else if(j===i) x.classList.add("wrong");
    });
    $("#qexpl").innerHTML=`<div class="expl">${md(q.e)}</div>
      <button class="btn pri" data-next="1" style="margin-top:10px">下一题</button>`;
    return;
  }
  if(e.target.closest("[data-next]")){ QI++; quiz(); }
});

/* ── 智能体 ─────────────────────────────────────────────────────── */
function say(cls,text,ctx){
  const d=document.createElement("div"); d.className="msg "+cls;
  d.innerHTML=(ctx?`<span class="ctx">${esc(ctx)}</span>`:"")+md(text).replace(/\n/g,"<br>");
  $("#agbody").appendChild(d); $("#agbody").scrollTop=1e9; return d;
}
function chips(){
  // 带 data-q:一是别拿按钮文字当值(改文案就会坏),二是让控件审计看得出它是绑了的
  $("#agchips").innerHTML=CHIPS[$("#agkind").value]
    .map(c=>`<button data-q="${esc(c)}">${esc(c)}</button>`).join("");
}
$("#agchips").addEventListener("click",e=>{
  const b=e.target.closest("button"); if(!b) return;
  $("#agq").value=b.dataset.q||b.textContent; ask();
});
$("#agkind").addEventListener("change",()=>{
  chips();
  say("ai",$("#agkind").value==="kb"
    ? "切到**工艺顾问**。问形制、面料、工艺、工期、尺码都行 —— 我只说查到的。"
    : "切到**研判助手**。可以让我看队列里的工单、判责现场、客户合并。**结论都是草稿,要你签字。**");
});
async function ask(){
  const q=($("#agq").value||"").trim(); if(!q) return;
  $("#agq").value=""; say("me",q);
  const kind=$("#agkind").value, wait=say("ai","查库中……");
  $("#agsend").disabled=true;
  try{
    const r=await (await fetch("/run",{method:"POST",headers:{"content-type":"application/json"},
      body:JSON.stringify({kind,prompt:q})})).json();
    wait.remove();
    if(r.error){ say("ai","出错了:"+r.error); }
    else{
      const tools=(r.trajectory||[]).map(t=>t.tool.split("__").pop()).join(" · ")||"没调工具";
      say("ai",r.text||"(空)",`${tools} · ${r.seconds}s · $${(r.cost_usd||0).toFixed(4)}`);
      (r.guard_violations||[]).forEach(v=>say("ai","**体检打回**:"+v.msg));
    }
  }catch(e){ wait.remove(); say("ai","请求失败:"+e); }
  $("#agsend").disabled=false;
}
$("#agsend").addEventListener("click",ask);
$("#agq").addEventListener("keydown",e=>{if(e.key==="Enter"&&(e.metaKey||e.ctrlKey))ask();});

chips();
say("ai","我是工艺顾问。**只说知识库里查到的**,查不到会直说。\n上面可以切换到研判助手。");
loadDash();
</script>
