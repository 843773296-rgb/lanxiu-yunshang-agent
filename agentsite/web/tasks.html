<title>任务 · 澜绣云裳</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
:root{--bg:#fff;--side:#f7f7f8;--line:#e6e6e8;--ink:#17181c;--dim:#8b8d94;
  --accent:#2f5bff;--chip:#f1f2f4;--ok:#067647;--okbg:#ecfdf3;
  --err:#b42318;--errbg:#fef3f2;--warn:#b45309;--warnbg:#fff7ed}
*{box-sizing:border-box}
body{margin:0;background:var(--side);color:var(--ink);
  font:14px/1.6 -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}
#top{display:flex;align-items:center;gap:10px;padding:11px 20px;background:#fff;
  border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
#top b{font-size:14.5px}
.sp{flex:1}
.tbtn{font:inherit;font-size:12.5px;padding:5px 11px;border:1px solid var(--line);
  border-radius:8px;background:#fff;color:var(--ink);cursor:pointer;text-decoration:none}
.tbtn:hover{background:var(--chip)}
#who{font-size:12.5px;color:var(--dim)}
#who b{color:var(--ink)}
main{max-width:940px;margin:20px auto 60px;padding:0 20px}
.card{background:#fff;border:1px solid var(--line);border-radius:13px;padding:20px 22px;margin-bottom:18px}
h2{margin:0 0 3px;font-size:15px}
.hint{margin:0 0 16px;font-size:12.5px;color:var(--dim)}
label{display:block;font-size:12.5px;color:var(--dim);margin:0 0 5px}
input,select,textarea{width:100%;font:inherit;padding:8px 10px;border:1px solid var(--line);
  border-radius:8px;background:#fff;color:var(--ink);outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(47,91,255,.10)}
.row{display:flex;gap:12px;flex-wrap:wrap}
.row>div{flex:1;min-width:180px;margin-bottom:12px}
button.go{font:inherit;font-weight:600;padding:9px 20px;border:0;border-radius:8px;
  background:var(--accent);color:#fff;cursor:pointer}
button.go:disabled{opacity:.55;cursor:default}
.msg{display:none;margin-top:12px;padding:9px 12px;border-radius:9px;font-size:12.5px;border:1px solid}
.msg.ok{display:block;background:var(--okbg);color:var(--ok);border-color:#abefc6}
.msg.no{display:block;background:var(--errbg);color:var(--err);border-color:#fecdca}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{border-bottom:1px solid var(--line);padding:9px 8px;text-align:left;vertical-align:top}
th{font-size:12px;color:var(--dim);font-weight:600;white-space:nowrap}
td.n{white-space:nowrap;color:var(--dim);font-size:12.5px}
.tag{display:inline-block;font-size:11.5px;padding:1px 8px;border-radius:20px;background:var(--chip);color:var(--dim)}
.tag.live{background:#eef2ff;color:var(--accent)}
.tag.done{background:var(--okbg);color:var(--ok)}
.tag.late{background:var(--warnbg);color:var(--warn)}
.fin{font:inherit;font-size:12px;padding:4px 10px;border:1px solid var(--accent);
  border-radius:7px;background:#fff;color:var(--accent);cursor:pointer;white-space:nowrap}
.fin:disabled{border-color:var(--line);color:var(--dim);cursor:default}
.empty{padding:26px 0;text-align:center;color:var(--dim);font-size:13px}
.note{margin-top:14px;font-size:11.5px;color:var(--dim);border-top:1px solid var(--line);padding-top:10px}
</style>

<div id="top">
  <b>任务</b>
  <span id="who"></span>
  <span class="sp"></span>
  <a class="tbtn" href="/">← 回助手</a>
  <button class="tbtn" id="out">退出登录</button>
</div>

<main>
  <!-- 派任务:只有店长能看见这张卡。看不见不是「藏起来了」——
       后端也拦,前端少画一块只是别让人白填一遍表单 -->
  <div class="card" id="assign" hidden>
    <h2>派任务</h2>
    <p class="hint">只能派给<b id="scope">本店</b>的在职顾问。派完他登录就能在自己的「我的任务」里看到。</p>
    <div class="row">
      <div>
        <label for="to">派给谁</label>
        <select id="to"><option>载入中…</option></select>
      </div>
      <div>
        <label for="due">截止时间</label>
        <input id="due" type="datetime-local">
      </div>
    </div>
    <div style="margin-bottom:12px">
      <label for="title">任务内容</label>
      <input id="title" placeholder="例:回访 C10001,确认马面裙腰围要不要改">
    </div>
    <button class="go" id="send">派下去</button>
    <p class="msg" id="amsg"></p>
  </div>

  <div class="card">
    <h2 id="ltitle">任务</h2>
    <p class="hint" id="lhint"></p>
    <div id="list"></div>
    <p class="note" id="lnote"></p>
  </div>
</main>

<script>
const $=s=>document.querySelector(s);
let ME=null;

function esc(s){return String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}
function msg(el,text,ok){el.className="msg "+(ok?"ok":"no");el.textContent=text}

// 截止时间过了但还是「有效」= 逾期。这个判断放前端只是为了上色,
// 真正的口径在后台;前端算错了顶多颜色不对,不会影响数据。
function tag(r){
  if(r.status==="有效"){
    const late = r.end_ts && new Date(r.end_ts.replace(/-/g,"/")) < new Date();
    return `<span class="tag ${late?"late":"live"}">${late?"逾期":"进行中"}</span>`;
  }
  return `<span class="tag ${r.status==="完结"?"done":""}">${esc(r.status)}</span>`;
}

async function boot(){
  const r = await fetch("/api/me");
  if(r.status===401){ location.href="/login?back="+encodeURIComponent(location.pathname); return; }
  ME = await r.json();
  $("#who").innerHTML = `<b>${esc(ME.name)}</b> · ${esc(ME.role)}${ME.shop?" · "+esc(ME.shop):""}`;
  const boss = ME.role==="店长" || ME.role==="总部运营";
  if(boss){
    $("#assign").hidden = false;
    $("#scope").textContent = ME.shop || "你管辖";
    loadStaff();
  }
  loadTasks();
}

async function loadStaff(){
  const d = await (await fetch("/api/my-staff")).json();
  const rs = d.rows||[];
  $("#to").innerHTML = rs.length
    ? rs.map(x=>`<option value="${esc(x.no)}">${esc(x.name)}（${esc(x.no)}）</option>`).join("")
    : `<option value="">（没有可派的顾问）</option>`;
}

async function loadTasks(){
  const d = await (await fetch("/api/my-tasks")).json();
  if(d.error){ $("#list").innerHTML=`<p class="empty">${esc(d.error)}</p>`; return; }
  $("#ltitle").textContent = d.scope || "任务";
  $("#lhint").textContent  = `共 ${d.hit} 条 · 进行中的排在前面,同状态按截止时间`;
  const rs = d.rows||[];
  if(!rs.length){ $("#list").innerHTML=`<p class="empty">还没有任务</p>`; return; }

  const mine = r => r.assignee_no===ME.no;   // 只有自己的任务才有「完成」按钮
  $("#list").innerHTML = `<table><tr>
      <th>单号</th><th>内容</th><th>负责人</th><th>截止</th><th>状态</th><th>派任务的人</th><th></th>
    </tr>` + rs.map(r=>`<tr>
      <td class="n">${esc(r.id)}</td>
      <td>${esc(r.note || r.type || "—")}${r.summary?`<br><span style="color:var(--dim);font-size:12px">✔ ${esc(r.summary)}</span>`:""}</td>
      <td class="n">${esc(r.assignee_name || r.advisor || "—")}</td>
      <td class="n">${esc((r.end_ts||"—").slice(0,16))}</td>
      <td class="n">${tag(r)}</td>
      <td class="n">${esc(r["派任务的人"] || "—")}</td>
      <td>${ r.status==="有效" && mine(r)
              ? `<button class="fin" data-id="${esc(r.id)}">完成</button>`
              : "" }</td>
    </tr>`).join("") + `</table>`;

  // 「完成」按钮只画在自己的任务上。**这不是权限** —— 权限在后台的
  // finish_task 里(店长替顾问点也会被拒)。这里少画一个按钮,
  // 是为了别让人点了才知道不行。
  $("#lnote").textContent = ME.role==="顾问"
    ? "你只看得到派给自己的任务 —— 这是数据隔离,不是界面上少显示几行。"
    : "你看得到全店的任务,但「完成」只能由做事的人自己点。";
  for(const b of document.querySelectorAll(".fin")) b.onclick = ()=>finish(b);
}

async function finish(b){
  const summary = prompt("这条任务做完了,写一句结果(可留空):", "");
  if(summary===null) return;            // 点了取消就别提交
  b.disabled=true; b.textContent="…";
  const d = await (await fetch("/api/task-finish",{method:"POST",
      headers:{"content-type":"application/json"},
      body:JSON.stringify({id:b.dataset.id, summary})})).json();
  if(!d.ok){ alert(d.reason||"完成失败"); b.disabled=false; b.textContent="完成"; return; }
  loadTasks();
}

$("#send").onclick = async ()=>{
  const m=$("#amsg");
  const body = {assignee_no:$("#to").value, title:$("#title").value.trim(), due:$("#due").value};
  if(!body.assignee_no) return msg(m,"没有可派的顾问",false);
  $("#send").disabled=true;
  const d = await (await fetch("/api/task-assign",{method:"POST",
      headers:{"content-type":"application/json"}, body:JSON.stringify(body)})).json();
  $("#send").disabled=false;
  msg(m, (d.reason||"").replace(/\*\*/g,""), !!d.ok);
  if(d.ok){ $("#title").value=""; loadTasks(); }
};

$("#out").onclick = async ()=>{ await fetch("/api/logout",{method:"POST"}); location.href="/login"; };

boot();
</script>
