<title>研判质量看板</title>
<!--SHELL-->
<style>
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.kpi{background:var(--paper);border:1px solid var(--line);border-radius:5px;padding:14px 16px;border-top:2px solid var(--line)}
.kpi .k{font-family:var(--mono);font-size:10.5px;letter-spacing:.08em;color:var(--ink-3)}
.kpi .v{font-family:var(--mono);font-size:26px;font-weight:600;line-height:1.3;font-variant-numeric:tabular-nums}
.kpi .n{font-size:12px;color:var(--ink-3)}
.kpi.warn{border-top-color:var(--warn)} .kpi.bad{border-top-color:var(--fail)}
table.b{width:100%;border-collapse:collapse;font-size:13.2px}
table.b th,table.b td{border-bottom:1px solid var(--line);padding:8px 6px;text-align:left}
table.b td.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
.few{font-size:11px;color:var(--warn);border:1px solid var(--warn);border-radius:3px;padding:0 4px;margin-left:4px}
a.dd{cursor:pointer;text-decoration:underline dotted;color:inherit}
#钻{margin-top:12px;background:var(--paper-2);border-radius:5px;padding:12px 14px;display:none;font-size:13px}
#钻 a{margin-right:10px;font-family:var(--mono)}
</style>
<div class="wrap">
<header class="top">
  <div class="eyebrow"><span class="dot"></span><span class="lab">澜绣云裳 · 研判队列</span></div>
  <h1>研判质量看板</h1>
  <p class="deck">AI 这段时间判得准不准、哪类最常被改判、换了提示词之后变好没有。
  <b>每个比例都带着分子分母</b>,样本少的会标出来 —— 能跑 AI 的工单现在合计几十条,百分比一跳就是十几个点。
  点任何一个数,下面列出是哪几件。</p>
</header>
<section>
  <h2 id="范围">加载中…</h2>
  <p class="sub" id="说明"></p>
  <div class="kpis" id="总体"></div>
  <div id="钻"></div>
</section>
<section>
  <h2>按工单类型</h2>
  <table class="b"><thead><tr><th>类型</th><th>事项</th><th>AI 运行</th><th>采纳率</th><th>改判</th><th>待复核</th><th>已升级</th><th>高置信被改判</th></tr></thead>
    <tbody id="按类型"></tbody></table>
</section>
<section>
  <h2>按提示词版本</h2>
  <p class="sub">版本号是每条研判跑的时候记下的指纹(研判提示词 + 系统提示词)。10-19 之前跑的没有版本号,单独一组,不混进任何一版。</p>
  <table class="b"><thead><tr><th>版本</th><th>事项</th><th>AI 运行</th><th>采纳率</th><th>改判</th><th>待复核</th><th>已升级</th><th>高置信被改判</th></tr></thead>
    <tbody id="按版本"></tbody></table>
</section>
</div>
<script>
const $=s=>document.querySelector(s);
const esc=s=>(s??"").toString().replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
let 板=null;
function 比文(b){ return b.分母 ? `${b.比例}% <span style="color:var(--ink-3);font-size:12px">${b.分子}/${b.分母}</span>${b.样本少?'<span class="few">样本少</span>':""}` : "—"; }
function 钻链(组键, 桶, 数){ return 数 ? `<a class="dd" data-g="${esc(组键)}" data-b="${esc(桶)}">${数}</a>` : "0"; }
function 行(组, 名, 组键){
  return `<tr><td>${esc(名)}</td><td class="num">${组.事项数}</td><td class="num">${组.AI运行次数}</td>
    <td class="num">${比文(组.采纳率)}</td><td class="num">${钻链(组键,"已改判",组.改判率.分子)}</td>
    <td class="num">${钻链(组键,"待复核",组.待复核)}</td><td class="num">${钻链(组键,"已升级",组.已升级)}</td>
    <td class="num">${钻链(组键,"高置信被改判",组.高置信被改判)}</td></tr>`;
}
function 找组(组键){
  if(组键==="总体") return 板.总体;
  const [层, 名]=组键.split("::"); return (板[层]||{})[名];
}
async function 载(){
  板=await fetch("/api/triage-board").then(r=>r.json()).catch(e=>({error:e+""}));
  if(板.error){ $("#范围").textContent="看不了:"+板.error; return; }
  $("#范围").textContent="范围:"+板.范围;
  $("#说明").textContent=板.说明;
  const g=板.总体;
  $("#总体").innerHTML=`
    <div class="kpi"><div class="k">采纳率</div><div class="v">${g.采纳率.分母?g.采纳率.比例+"%":"—"}</div>
      <div class="n">${g.采纳率.分子} / ${g.采纳率.分母} 件有结论${g.采纳率.样本少?" · 样本少":""}</div></div>
    <div class="kpi ${g.改判率.分子?"warn":""}"><div class="k">被改判</div><div class="v">${钻链("总体","已改判",g.改判率.分子)}</div><div class="n">人认为 AI 判错了</div></div>
    <div class="kpi ${g.高置信被改判?"bad":""}"><div class="k">高置信却被改判</div><div class="v">${钻链("总体","高置信被改判",g.高置信被改判)}</div><div class="n">最该盯:说明置信度在骗人</div></div>
    <div class="kpi"><div class="k">待复核</div><div class="v">${钻链("总体","待复核",g.待复核)}</div><div class="n">AI 出了草稿、还没人签</div></div>
    <div class="kpi"><div class="k">已升级</div><div class="v">${钻链("总体","已升级",g.已升级)}</div><div class="n">交给上一级、不算结论</div></div>
    <div class="kpi"><div class="k">事项 / AI 运行</div><div class="v">${g.事项数} / ${g.AI运行次数}</div><div class="n">同一件跑几次算几次运行</div></div>`;
  $("#按类型").innerHTML=Object.entries(板.按类型).map(([k,v])=>行(v,k,"按类型::"+k)).join("")||`<tr><td colspan="8">这个范围里还没有研判。</td></tr>`;
  $("#按版本").innerHTML=Object.entries(板.按版本).map(([k,v])=>行(v,k,"按版本::"+k)).join("")||`<tr><td colspan="8">这个范围里还没有研判。</td></tr>`;
}
document.addEventListener("click",e=>{
  const a=e.target.closest("a.dd"); if(!a) return;
  const 组=找组(a.dataset.g); const 单=(组&&组.下钻[a.dataset.b])||[];
  const 框=$("#钻"); 框.style.display="block";
  框.innerHTML=`<b>${esc(a.dataset.g==="总体"?"全部":a.dataset.g.split("::")[1])} · ${esc(a.dataset.b)} · ${单.length} 件</b><br>`
    +单.map(x=>`<a href="/queue?task=${encodeURIComponent(x.task_id)}">${esc(x.task_id)}</a>`).join("");
});
载();
</script>
