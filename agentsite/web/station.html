<!doctype html><meta charset="utf-8"><title>澜绣云裳 · 智能助手</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
:root{
  --bg:#fff; --side:#f7f7f8; --line:#e6e6e8; --ink:#17181c; --dim:#8b8d94;
  --chip:#f1f2f4; --accent:#2f5bff; --warn:#b45309; --warnbg:#fff7ed;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;display:flex;background:var(--bg);color:var(--ink);
  font:14px/1.68 -apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  -webkit-font-smoothing:antialiased}

/* ── 左栏:会话列表 ───────────────────────────────────────── */
#side{width:264px;flex:none;background:var(--side);border-right:1px solid var(--line);
  display:flex;flex-direction:column;height:100vh}
#side header{padding:18px 16px 10px}
#side h1{margin:0 0 14px;font-size:15px;font-weight:600;letter-spacing:.02em}
#side h1 small{display:block;font-weight:400;font-size:11px;color:var(--dim);letter-spacing:0}
#newbtn{width:100%;padding:9px 12px;border:1px solid var(--line);border-radius:9px;
  background:#fff;cursor:pointer;font:inherit;font-size:13px;text-align:left;color:var(--ink)}
#newbtn:hover,#gallery:hover{border-color:#c9cace}
#gallery{width:100%;margin-top:7px;padding:8px 12px;border:1px solid transparent;border-radius:9px;
  background:none;cursor:pointer;font:inherit;font-size:13px;text-align:left;color:var(--dim)}
#convs{flex:1;overflow:auto;padding:6px 8px 18px}
.grp{font-size:11px;color:var(--dim);padding:14px 8px 5px;letter-spacing:.04em}
.conv{padding:7px 9px;border-radius:8px;cursor:pointer;position:relative}
.conv:hover{background:#ececee}
.conv.on{background:#e4e5e9}
.conv .t{font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.conv .m{font-size:11px;color:var(--dim);margin-top:1px}
.conv .dot{display:inline-block;width:6px;height:6px;border-radius:50%;margin-right:5px;
  vertical-align:1px}
.conv .x{position:absolute;right:5px;top:6px;display:none;border:0;background:none;
  color:var(--dim);cursor:pointer;font-size:14px;line-height:1;padding:2px 4px;border-radius:5px}
.conv:hover .x{display:block}
.conv .x:hover{background:#dcdde1;color:var(--ink)}

/* ── 右侧主区 ─────────────────────────────────────────────── */
#main{flex:1;display:flex;flex-direction:column;height:100vh;min-width:0}
#top{display:flex;align-items:center;gap:10px;padding:10px 20px;border-bottom:1px solid var(--line);flex:none}
#top select{font:inherit;font-size:13px;padding:5px 26px 5px 10px;border:1px solid var(--line);
  border-radius:8px;background:#fff url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='10' height='6'><path d='M0 0l5 6 5-6z' fill='%238b8d94'/></svg>") no-repeat right 9px center;
  -webkit-appearance:none;appearance:none;cursor:pointer;color:var(--ink)}
#top .sp{flex:1}
.tbtn{font:inherit;font-size:12px;padding:5px 11px;border:1px solid var(--line);border-radius:8px;
  background:#fff;cursor:pointer;color:var(--dim);text-decoration:none}
.tbtn:hover{color:var(--ink);border-color:#c9cace}
#kindhint{font-size:12px;color:var(--dim)}
#currole{font-size:13.5px;font-weight:600;padding:4px 11px;border-radius:8px;
  background:var(--chip);white-space:nowrap}

/* ── 消息流 ───────────────────────────────────────────────── */
#stream{flex:1;overflow:auto;padding:26px 0 10px}
.wrap{max-width:760px;margin:0 auto;padding:0 24px}
.msg{margin-bottom:26px}
.msg.u .wrap{display:flex;justify-content:flex-end}
.msg.u .bub{background:var(--chip);border-radius:14px;padding:9px 14px;max-width:78%;white-space:pre-wrap}
.msg.a .body{white-space:normal}
.tool{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--dim);
  background:var(--chip);border-radius:7px;padding:3px 9px;margin:0 6px 6px 0}
.tool b{font-weight:500;color:#5b5d64}
.meta{margin-top:12px;font-size:11.5px;color:var(--dim);border-top:1px solid var(--line);padding-top:8px}
.gv{background:var(--warnbg);border:1px solid #fed7aa;color:var(--warn);
  border-radius:9px;padding:8px 11px;font-size:12px;margin-top:10px}
.err{background:#fef2f2;border:1px solid #fecaca;color:#b91c1c;border-radius:9px;padding:10px 12px}
.dots:after{content:"";animation:d 1.2s steps(4,end) infinite}
@keyframes d{0%{content:""}25%{content:"·"}50%{content:"··"}75%{content:"···"}}

/* markdown */
.body h2,.body h3{font-size:14.5px;margin:18px 0 7px}
.body p{margin:0 0 11px}
.body ul,.body ol{margin:0 0 11px;padding-left:22px}
.body li{margin:3px 0}
.body code{background:var(--chip);border-radius:5px;padding:1px 5px;font-size:12.5px;
  font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
.body pre{background:#f6f7f9;border:1px solid var(--line);border-radius:9px;padding:12px 14px;
  overflow-x:auto;margin:0 0 12px}
.body pre code{background:none;padding:0}
.body table{border-collapse:collapse;margin:0 0 12px;font-size:13px;display:block;overflow-x:auto}
.body th,.body td{border:1px solid var(--line);padding:6px 10px;text-align:left}
.body th{background:var(--chip);font-weight:600}
.body hr{border:0;border-top:1px solid var(--line);margin:16px 0}

/* ── 角色选择屏:进来第一件事是选角色,不是先聊 ─────────────── */
/* 视觉参考 Accio 的智能体市场:圆形头像居中、名字居中、底部一个明显的「对话」按钮。
   但卡片上多两个它没有的数:**工具数和规矩数** ——
   这两个数说明了这个角色到底能干什么、被什么管着,是这个项目最该露出来的信息。 */
#pick{padding:46px 24px 40px;max-width:860px;margin:0 auto}
#pick h2{font-size:21px;margin:0 0 6px;font-weight:600}
#pick .sub{color:var(--dim);font-size:13px;margin-bottom:26px;line-height:1.7}
.roles{display:grid;grid-template-columns:repeat(auto-fit,minmax(228px,1fr));gap:16px}
.role{border:1px solid var(--line);border-radius:14px;padding:22px 18px 16px;background:#fff;
  display:flex;flex-direction:column;align-items:center;text-align:center;transition:.15s}
.role:hover{border-color:var(--c);box-shadow:0 3px 18px rgba(20,20,30,.09)}
/* 圆形头像 + 每个助手自己的配色。底层是同一个内核,但**呈现上它就该有身份** ——
   有头像、有介绍、有入口,人才认得出自己在跟谁说话。 */
.role .av{width:62px;height:62px;border-radius:50%;display:flex;align-items:center;
  justify-content:center;font-size:28px;margin-bottom:12px;
  box-shadow:0 0 0 3px #fff, 0 0 0 4px currentColor}
.role .nm{font-size:15.5px;font-weight:600;margin-bottom:4px}
.role .who{font-size:11.5px;color:var(--accent);margin-bottom:9px}
.role .desc{font-size:12.5px;color:#5b5e66;line-height:1.65;margin-bottom:12px;flex:1}
.role .cnt{font-size:11px;color:var(--dim);font-family:ui-monospace,Menlo,monospace;
  margin-bottom:13px}
.role .go{width:100%;border:0;border-radius:9px;padding:9px 0;font:inherit;font-size:13.5px;
  background:#eef2ff;color:var(--accent);cursor:pointer;font-weight:500}
.role:hover .go{background:var(--c)!important;color:#fff!important}
#pick .why{margin-top:30px;font-size:12px;color:var(--dim);line-height:1.85;
  border-top:1px solid var(--line);padding-top:16px}

/* ── 空状态:选完角色之后 ───────────────────────────────────
   参考 Accio 的「新任务」屏:当前角色的头像 + 名字 + 一句话描述放在**输入框正上方**,
   旁边就是「切换角色」;下面是场景标签。角色不是设置项,是你正在跟谁说话。 */
#empty{padding:96px 24px 0;max-width:760px;margin:0 auto}
.idbar{display:flex;align-items:center;gap:14px;margin-bottom:22px}
.idbar .av{width:50px;height:50px;border-radius:50%;flex:none;
  box-shadow:0 0 0 2px #fff, 0 0 0 3px currentColor;
  display:flex;align-items:center;justify-content:center;font-size:25px}
.idbar .txt{flex:1;min-width:0}
.idbar .nm{font-size:19px;font-weight:600;margin-bottom:3px}
.idbar .ds{font-size:12.5px;color:var(--dim);line-height:1.6}
.idbar .sw{flex:none;border:1px solid var(--line);border-radius:20px;padding:7px 15px;
  background:#fff;font:inherit;font-size:13px;cursor:pointer;color:var(--ink);white-space:nowrap}
.idbar .sw:hover{border-color:#c9cace}
.sug{display:flex;flex-wrap:wrap;gap:9px}
.sug button{font:inherit;font-size:13px;padding:8px 15px;border:1px solid var(--line);
  border-radius:20px;background:#fff;cursor:pointer;color:#42454d;line-height:1.5}
.sug button:hover{border-color:var(--accent);color:var(--accent)}
#disclaim{max-width:760px;margin:9px auto 0;padding:0 24px;font-size:11.5px;
  color:var(--dim);text-align:center;line-height:1.7}

/* ── 输入区 ───────────────────────────────────────────────── */
#composer{flex:none;padding:6px 0 16px;background:var(--bg)}
#cbox{display:flex;gap:9px;align-items:flex-end;border:1px solid var(--line);border-radius:15px;
  padding:9px 9px 9px 15px;background:#fff}
#cbox:focus-within{border-color:#c2c4ca}
#q{flex:1;border:0;outline:0;resize:none;font:inherit;line-height:1.6;max-height:190px;
  padding:4px 0;background:none;color:var(--ink)}
#send,#stop{border:0;border-radius:11px;padding:8px 15px;font:inherit;font-size:13px;cursor:pointer}
#send{background:var(--accent);color:#fff}
#send:disabled{background:#c8cdd8;cursor:default}
#stop{background:var(--chip);color:var(--ink)}
#thumbs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:9px}
#thumbs .th{position:relative;width:62px;height:62px;border-radius:9px;overflow:hidden;
  border:1px solid var(--line);background:#fafafb}
#thumbs .th img{width:100%;height:100%;object-fit:cover;display:block}
#thumbs .th button{position:absolute;right:2px;top:2px;width:17px;height:17px;border:0;
  border-radius:50%;background:rgba(20,20,24,.62);color:#fff;font-size:11px;line-height:17px;
  padding:0;cursor:pointer}
.msg.u .imgs{display:flex;gap:7px;flex-wrap:wrap;justify-content:flex-end;margin-bottom:6px}
.msg.u .imgs img{width:104px;height:104px;object-fit:cover;border-radius:11px;border:1px solid var(--line)}
#cbox.drag{border-color:var(--accent);background:#f7f9ff}
#novis{font-size:11.5px;color:var(--warn);margin-top:6px}
#hint{max-width:760px;margin:7px auto 0;padding:0 24px;font-size:11.5px;color:var(--dim)}

/* ── 「?」教学层 ─────────────────────────────────────────── */
#ov{position:fixed;inset:0;background:rgba(20,20,24,.34);display:none;z-index:9}
#ov.on{display:block}
#ovp{position:absolute;right:0;top:0;bottom:0;width:min(520px,92vw);background:#fff;
  border-left:1px solid var(--line);overflow:auto;padding:24px 26px 40px}
#ovp h2{font-size:16px;margin:0 0 4px}
#ovp .sub{color:var(--dim);font-size:12px;margin-bottom:18px}
#ovp h3{font-size:13.5px;margin:20px 0 5px}
#ovp p{margin:0 0 10px;font-size:13px;color:#3d3f46}
#ovx{position:absolute;right:16px;top:14px;border:0;background:none;font-size:20px;
  color:var(--dim);cursor:pointer;line-height:1}
@media(max-width:820px){#side{display:none}}
</style>

  <header>
    <h1>澜绣云裳 · 智能助手<small>汉服定制运维</small></h1>

  <div id="top">

<script>
"use strict";
const $ = s => document.querySelector(s);
const esc = s => String(s == null ? "" : s)
  .replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");

/* ── Markdown:够用就行,不引外部库 ────────────────────────────
   这个站是本机起的,联网拉 CDN 既慢又会在断网时整页哑掉。
   支持:标题 / 列表 / 表格 / 代码块 / 行内强调。*/
function md(src){
  const lines = String(src || "").replace(/\r/g,"").split("\n");
  const out = []; let i = 0;
  const inline = t => esc(t)
    .replace(/`([^`]+)`/g,"<code>$1</code>")
    .replace(/\*\*([^*]+)\*\*/g,"<b>$1</b>")
    .replace(/(?<![*\w])\*([^*\n]+)\*(?!\*)/g,"<i>$1</i>");
  while(i < lines.length){
    const L = lines[i];
    if(/^```/.test(L)){
      const buf = []; i++;
      while(i < lines.length && !/^```/.test(lines[i])) buf.push(lines[i++]);
      i++; out.push("<pre><code>" + esc(buf.join("\n")) + "</code></pre>"); continue;
    }
    if(/^\s*\|.*\|\s*$/.test(L) && /^\s*\|[\s:|-]+\|\s*$/.test(lines[i+1] || "")){
      const cells = r => r.trim().replace(/^\||\|$/g,"").split("|").map(c => c.trim());
      const head = cells(L); i += 2; const rows = [];
      while(i < lines.length && /^\s*\|.*\|\s*$/.test(lines[i])) rows.push(cells(lines[i++]));
      out.push("<table><thead><tr>" + head.map(h => "<th>" + inline(h) + "</th>").join("") +
        "</tr></thead><tbody>" + rows.map(r => "<tr>" +
        r.map(c => "<td>" + inline(c) + "</td>").join("") + "</tr>").join("") + "</tbody></table>");
      continue;
    }
    let m = L.match(/^(#{1,6})\s+(.*)$/);
    if(m){ const h = Math.min(m[1].length + 1, 4); out.push(`<h${h}>${inline(m[2])}</h${h}>`); i++; continue; }
    if(/^\s*([-*·]|\d+[.)])\s+/.test(L)){
      const ol = /^\s*\d+[.)]\s/.test(L); const items = [];
      while(i < lines.length && /^\s*([-*·]|\d+[.)])\s+/.test(lines[i]))
        items.push(inline(lines[i++].replace(/^\s*([-*·]|\d+[.)])\s+/,"")));
      out.push(`<${ol?"ol":"ul"}>` + items.map(x => "<li>" + x + "</li>").join("") + `</${ol?"ol":"ul"}>`);
      continue;
    }
    if(/^\s*(---+|___+)\s*$/.test(L)){ out.push("<hr>"); i++; continue; }
    if(!L.trim()){ i++; continue; }
    const para = [];
    while(i < lines.length && lines[i].trim() && !/^(#{1,6}\s|```|\s*([-*·]|\d+[.)])\s|\s*\|)/.test(lines[i]))
      para.push(lines[i++]);
    out.push("<p>" + inline(para.join("\n")).replace(/\n/g,"<br>") + "</p>");
  }
  return out.join("");
}

/* ── 会话:存在浏览器本地 ──────────────────────────────────
   为什么不落后端:这是**一个人的草稿本**,不是业务数据。
   业务数据的家在后台库里(研判落库、工单、着装人),
   聊天记录留在本机既不用建表,也不会让人误以为它是台账。
   真要留档的结论,走研判队列 —— 那条路径是有人签字的。 */
const KEY = "lanxiu.chat.v1";
let DB = {convs: [], cur: null};
try{ const raw = localStorage.getItem(KEY); if(raw) DB = JSON.parse(raw); }catch(e){}
if(!Array.isArray(DB.convs)) DB.convs = [];
const save = () => { try{ localStorage.setItem(KEY, JSON.stringify(DB)); }catch(e){} };
const cur = () => DB.convs.find(c => c.id === DB.cur) || null;

// 角色清单**从后端拉**(/roles)—— 工具数和规矩数只有那边算得出来,
// 页面抄一份当天就开始漂。这是这个项目撞了五次的那条:同一个事实两个来源。
let ROLES = [];
const KINDS = {};      // kind → 角色对象,拉到之后填

// **角色在新建会话时定死,之后不变。** 换角色 = 新会话。
// 理由不是产品洁癖:换角色就是换工具集,前面几轮的上下文对不上了 ——
// 顾问那条会话里模型手上有 17 个工具,工坊那条只有 6 个。
let PICKING = false;   // 正在选角色

function newConv(kind){
  const c = {id: "c" + Date.now().toString(36) + Math.random().toString(36).slice(2,6),
             title:"新会话", kind: kind || "all",
             model: $("#model").value || MODEL_DEFAULT,
             session:null, at:Date.now(), msgs:[]};
  DB.convs.unshift(c); DB.cur = c.id; save(); return c;
}

/* ── 左栏渲染 ─────────────────────────────────────────────── */
function grpOf(ts){
  const d = (Date.now() - ts) / 86400000;
  return d < 1 ? "今天" : d < 7 ? "近 7 天" : d < 30 ? "近 30 天" : "更早";
}
function drawSide(){
  const box = $("#convs"); box.innerHTML = "";
  let last = null;
  for(const c of DB.convs){
    const g = grpOf(c.at);
    if(g !== last){ last = g; const h = document.createElement("div"); h.className = "grp"; h.textContent = g; box.appendChild(h); }
    const el = document.createElement("div");
    el.className = "conv" + (c.id === DB.cur ? " on" : "");
    el.innerHTML = `<div class="t">${esc(c.title)}</div>
      <div class="m"><span class="dot" style="background:${esc((KINDS[c.kind]||{}).color || '#8b8d94')}"></span>${esc(KINDS[c.kind] ? KINDS[c.kind].name : c.kind)}
        · ${esc(String(c.model || "").split(":")[1] || "默认")} · ${c.msgs.length} 条</div>
      <button class="x" data-act="del" title="删除本会话">×</button>`;
    el.onclick = e => {
      if(e.target.dataset && e.target.dataset.act === "del"){
        e.stopPropagation();
        DB.convs = DB.convs.filter(x => x.id !== c.id);
        if(DB.cur === c.id) DB.cur = DB.convs.length ? DB.convs[0].id : null;
        save(); drawSide(); drawStream(); return;
      }
      DB.cur = c.id; save(); drawSide(); drawStream();
    };
    box.appendChild(el);
  }
}

/* ── 消息流渲染 ───────────────────────────────────────────── */
const SUG = [
  ["客人说要仙气飘飘的,我推什么料子?", "决策表类问题 —— 看它会不会先取全部决策表"],
  ["香云纱能不能做妆花?", "物理约束 —— 看它说不说得死,给不给依据"],
  ["缂丝和苏绣配真丝素罗,这一格录了吗?", "未定义 —— 看它编不编"],
  ["W10001-2 明年六月毕业礼要穿,该按多高做?", "着装人 + 成长推算 —— 看它给不给区间"]
];

function toolChip(t){
  let a = "";
  try{ a = JSON.stringify(t.args || {}); }catch(e){ a = ""; }
  if(a === "{}") a = "";
  return `<span class="tool">↳ <b>${esc(t.tool)}</b>${a ? esc(a.slice(0,60)) : ""}</span>`;
}

function metaLine(r){
  const u = r.usage || {};
  const bits = [];
  if(r.model) bits.push("模型 " + r.model);
  bits.push("工具 " + ((r.trajectory || []).length) + " 次");
  if(r.seconds != null) bits.push(r.seconds + "s");
  if(r.cost_usd != null) bits.push("$" + r.cost_usd);
  if(u.input_tokens != null) bits.push("入 " + u.input_tokens + " / 出 " + (u.output_tokens || 0));
  return bits.join(" · ");
}

function drawRoles(){
  const s = $("#stream");
  s.innerHTML = `<div id="pick">
    <h2>选一个助手开始</h2>
    <div class="sub">三个助手<b>共用同一个内核</b>,区别在**手上有哪些工具、受哪些规矩管** ——
      所以换助手要新开一条会话。<br>
      三个都是<b>只读的</b>:不下单、不改单、不改期、不改档,产出都是给人确认的草稿。</div>
    <div class="roles">${ROLES.map((r,i) => `
      <div class="role" style="--c:${esc(r.color || '#2f5bff')}">
        <div class="av" style="color:${esc(r.color)};background:${esc(r.color)}18">${esc(r.emoji)}</div>
        <div class="nm">${esc(r.name)}</div>
        <div class="who" style="color:${esc(r.color)}">${esc(r.who)}</div>
        <div class="desc">${esc(r.intro || r.desc)}</div>
        <div class="cnt">${r.tools} 个工具 · ${r.rules} 条规矩</div>
        <button class="go" data-act="go" data-i="${i}"
          style="background:${esc(r.color)}14;color:${esc(r.color)}">开始对话</button>
      </div>`).join("")}</div>
    <div class="why"><b>为什么换助手要新开会话?</b><br>
      一个助手 = 一组工具 + 一组规矩。门店顾问手上有 ${(ROLES[0]||{}).tools || "?"} 个工具,
      工坊排产只有 ${(ROLES[1]||{}).tools || "?"} 个 ——
      聊到一半切过去,前面几轮的上下文对不上,而且它会拿**已经没有的工具**去承诺事情。
      所以<b>换助手一律新开会话</b>,这是结构上的,不是提醒。<br><br>
      <b>规矩也是跟着工具走的:</b>挂了哪个工具,管它的那条规矩才会发给模型 ——
      没挂的工具,对应的规矩一个字都不发,免得它承诺做不到的事。</div>
  </div>`;
  s.querySelectorAll(".role .go").forEach(b => {
    b.onclick = () => {
      const r = ROLES[+b.dataset.i];
      const c = cur();
      // 当前会话还没说过话,就直接把它定成这个角色;否则开一条新的
      if(c && !c.msgs.length){ c.kind = r.kind; save(); }
      else newConv(r.kind);
      PICKING = false; syncHint(); drawSide(); drawStream(); $("#q").focus();
    };
  });
}

function drawStream(){
  const s = $("#stream"); const c = cur();
  if(PICKING || !c){ drawRoles(); return; }
  if(!c.msgs.length){
    const R = KINDS[c.kind] || {};
    const ex = R.examples || [];
    s.innerHTML = `<div id="empty">
      <div class="idbar">
        <div class="av" style="color:${esc(R.color || '#2f5bff')};background:${esc(R.color || '#2f5bff')}18">${esc(R.emoji || "")}</div>
        <div class="txt">
          <div class="nm">${esc(R.name || "")}</div>
          <div class="ds">${esc(R.desc || "")}<br>
            <span style="color:#9aa0ad">${R.tools || "?"} 个工具 · ${R.rules || "?"} 条规矩 · 只读</span>
          </div></div>
        <button class="sw" data-act="switch">⇄ 换个助手</button>
      </div>
      <div class="sug">${ex.map((q,i) =>
        `<button data-i="${i}">${esc(q)}</button>`).join("")}</div></div>`;
    const sw = s.querySelector(".sw");
    if(sw) sw.onclick = () => { PICKING = true; drawStream(); };
    s.querySelectorAll(".sug button").forEach(b => {
      b.onclick = () => { $("#q").value = ex[+b.dataset.i]; grow(); ask(); };
    });
    return;
  }
  s.innerHTML = c.msgs.map(m => {
    if(m.role === "user"){
      const im = (m.images || []).length
        ? `<div class="imgs">${m.images.map(u => `<img src="${esc(u)}">`).join("")}</div>` : "";
      return `<div class="msg u"><div class="wrap"><div>${im}
        <div class="bub">${esc(m.text)}</div></div></div></div>`;
    }
    if(m.error)
      return `<div class="msg a"><div class="wrap"><div class="err">${esc(m.error)}</div></div></div>`;
    const gv = (m.guard_violations || []).length
      ? `<div class="gv"><b>回答体检打回过</b> —— ` +
        m.guard_violations.map(v => esc(v.msg || v)).join("；") + `</div>` : "";
    return `<div class="msg a"><div class="wrap">
      ${(m.trajectory || []).map(toolChip).join("")}
      <div class="body">${md(m.text)}</div>${gv}
      <div class="meta">${esc(metaLine(m))}</div></div></div>`;
  }).join("");
  s.scrollTop = s.scrollHeight;
}

/* ── 图片附件 ─────────────────────────────────────────────
   限额和后端一致(四张、每张 6MB、四种格式)。**两边都要拦** ——
   前端拦是为了让人立刻知道为什么不行,后端拦是因为前端拦不住绕过去的请求。 */
const MAX_IMGS = 4, MAX_BYTES = 6 * 1024 * 1024;
const OKMIME = ["image/png","image/jpeg","image/gif","image/webp"];
let PEND = [];   // [{name, url}] —— url 是 data URL,直接发给后端

function drawThumbs(){
  $("#thumbs").innerHTML = PEND.map((p, i) =>
    `<div class="th"><img src="${esc(p.url)}" title="${esc(p.name)}">
       <button data-act="rmimg" data-i="${i}" title="移除">×</button></div>`).join("");
  $("#thumbs").querySelectorAll("button").forEach(b => {
    b.onclick = () => { PEND.splice(+b.dataset.i, 1); drawThumbs(); };
  });
  checkVision();
}

function checkVision(){
  const sel = $("#model");
  const opt = sel.selectedOptions && sel.selectedOptions[0];
  const canSee = !opt || opt.dataset.vision !== "0";
  $("#novis").textContent = (PEND.length && !canSee)
    ? `⚠ ${sel.value.split(":")[1] || "这个模型"} 看不了图 —— 换成 Claude 任一款,或 deepseek-v4-flash-vision-exp`
    : "";
  return canSee;
}

async function addFiles(files){
  for(const f of files){
    if(PEND.length >= MAX_IMGS){ alert(`一次最多 ${MAX_IMGS} 张`); break; }
    if(!OKMIME.includes(f.type)){ alert(`${f.name}:只收 png / jpeg / gif / webp`); continue; }
    if(f.size > MAX_BYTES){ alert(`${f.name}:超过 ${MAX_BYTES/1024/1024}MB`); continue; }
    const url = await new Promise(res => {
      const r = new FileReader(); r.onload = () => res(r.result); r.readAsDataURL(f);
    });
    PEND.push({name: f.name || "粘贴的图", url});
  }
  drawThumbs();
}

$("#pic").onclick = () => $("#file").click();
$("#file").onchange = e => { addFiles([...e.target.files]); e.target.value = ""; };
$("#q").addEventListener("paste", e => {
  const fs = [...(e.clipboardData ? e.clipboardData.files : [])];
  if(fs.length){ e.preventDefault(); addFiles(fs); }
});
["dragover","dragleave","drop"].forEach(ev => {
  $("#cbox").addEventListener(ev, e => {
    e.preventDefault();
    $("#cbox").classList.toggle("drag", ev === "dragover");
    if(ev === "drop") addFiles([...(e.dataTransfer ? e.dataTransfer.files : [])]);
  });
});

/* ── 提问 ─────────────────────────────────────────────────── */
let RUNNING = null;
function grow(){ const q = $("#q"); q.style.height = "auto"; q.style.height = Math.min(q.scrollHeight, 190) + "px"; }

async function ask(){
  const q = $("#q"); const text = q.value.trim();
  if((!text && !PEND.length) || RUNNING) return;
  if(PEND.length && !checkVision()) return;
  let c = cur(); if(!c) c = newConv();
  // ⚠️ 这里原来是 `c.kind = $("#kind").value` —— 那个下拉在改版时删掉了,
  // 而这句留在了 ask() 里。于是**一按回车就抛 TypeError,消息发不出去**,
  // 而页面看起来完全正常:框架在、按钮在、输入框能打字。
  //
  // 三道前端检查都没抓到它:js_check 只验语法(这句语法是对的);
  // js_smoke 的 DOM 桩对任何 #id 都返回一个假元素,所以桩里它不会 null;
  // ui_audit 查的是控件有没有绑定,不查引用的元素还在不在。
  // **删元素的时候要连引用一起删** —— 这类错只有真点一下才会露出来。
  if(!c.msgs.length){ c.title = text.slice(0, 26); }
  const imgs = PEND.map(p => p.url);
  c.msgs.push({role:"user", text, images: imgs});
  c.at = Date.now();
  PEND = []; drawThumbs();
  q.value = ""; grow(); save(); drawSide(); drawStream();

  const s = $("#stream");
  const ph = document.createElement("div");
  ph.className = "msg a";
  ph.innerHTML = `<div class="wrap"><span class="tool dots">在查</span></div>`;
  s.appendChild(ph); s.scrollTop = s.scrollHeight;

  $("#send").disabled = true; $("#stop").hidden = false;
  RUNNING = new AbortController();
  let r;
  try{
    const resp = await fetch("/run", {method:"POST", headers:{"content-type":"application/json"},
      signal: RUNNING.signal,
      body: JSON.stringify({kind: c.kind, prompt: text,
                            session: c.session || null, model: c.model || null,
                            images: imgs.length ? imgs : undefined})});
    r = await resp.json();
  }catch(e){
    r = {error: e.name === "AbortError" ? "已停止" : ("请求失败:" + e.message)};
  }
  RUNNING = null; $("#send").disabled = false; $("#stop").hidden = true;

  // **会话号要存下来** —— 多轮靠 CLI 续会话,不靠把历史拼进 prompt。
  if(r && r.session_id) c.session = r.session_id;
  c.msgs.push(r && r.error ? {role:"assistant", error: r.error} : Object.assign({role:"assistant"}, r));
  c.at = Date.now(); save(); drawSide(); drawStream();
}

$("#help").onclick = () => {
  $("#ovc").innerHTML = `<h2>这个助手怎么用、凭什么信它</h2>
    <div class="sub">按 Esc 关闭</div>` +
    TEACH.map(([h, p]) => `<h3>${h}</h3><p>${p}</p>`).join("");
  $("#ov").classList.add("on");
};
const closeOv = () => $("#ov").classList.remove("on");
$("#ovx").onclick = closeOv;
$("#ov").onclick = e => { if(e.target.id === "ov") closeOv(); };

/* ── 事件绑定 ─────────────────────────────────────────────── */
$("#newbtn").onclick = () => { PICKING = true; drawSide(); drawStream(); };
$("#switch").onclick = () => { PICKING = true; drawStream(); };
$("#gallery").onclick = () => { PICKING = true; drawStream(); };
$("#send").onclick = ask;
$("#stop").onclick = () => { if(RUNNING) RUNNING.abort(); };
$("#q").addEventListener("input", grow);
$("#q").addEventListener("keydown", e => {
  if(e.key === "Enter" && !e.shiftKey){ e.preventDefault(); ask(); }
});
document.addEventListener("keydown", e => { if(e.key === "Escape") closeOv(); });
function syncHint(){
  const c = cur(); const R = (c && KINDS[c.kind]) || {};
  // 顶栏显示**当前角色**(不可改),换角色走「切换角色」——
  // 角色在新建会话时定死,界面不该做成一个随手能拨的下拉。
  $("#currole").textContent = `${R.emoji || ""} ${R.name || "未选"}`;
  $("#currole").style.color = R.color || "";
  $("#kindhint").textContent = R.who || "";
  // 占位符带上角色名 —— 让人一眼知道自己在跟谁说话
  $("#q").placeholder = R.name ? `向 ${R.name} 提问…(↩ 发送,⇧↩ 换行,可粘贴图片)`
                              : "先选一个助手";
  $("#hint").textContent = "";
  $("#disclaim").textContent =
    "内容由 AI 生成,请核实后再对客户使用。三个角色都是只读的 —— " +
    "涉及退款、判责、赔付、改期的结论必须由人签字。会话记录存在本机浏览器。";
}

/* ── 模型清单 ─────────────────────────────────────────────
   清单**从后端拿**,不在页面里写死一份。后端那份又是从单价表长出来的 ——
   能选的模型 = 有单价的模型。另写一份清单,迟早出现一个选得中却算不出钱的。 */
let MODEL_DEFAULT = "";
async function loadModels(){
  let rows = [], def = "";
  try{
    const r = await (await fetch("/models")).json();
    rows = r.rows || []; def = r.default || "";
  }catch(e){}
  MODEL_DEFAULT = def;
  const sel = $("#model");
  sel.innerHTML = rows.length
    ? rows.map(m => `<option value="${esc(m.id)}" data-vision="${m.vision ? 1 : 0}">${esc(m.label)}`
        + `${m.note ? " · " + esc(m.note) : ""}${m.vision ? " · 可识图" : ""}</option>`).join("")
    : `<option value="">(取不到清单)</option>`;
  const c = cur();
  sel.value = (c && c.model) || def || (rows[0] && rows[0].id) || "";
  if(c && !c.model){ c.model = sel.value; save(); }
  drawSide();
}
$("#model").onchange = () => {
  const c = cur(); if(!c) return;
  c.model = $("#model").value; save(); drawSide(); checkVision();
  // 换模型**不新开会话**,也不清 session —— 续着问,让它接着上文回答。
  // 每条答案下方的元信息里写着当时用的是哪个模型,所以对照得出来。
};

/* ── 启动 ─────────────────────────────────────────────────── */
if(!DB.convs.length) newConv("all");
if(!cur()) DB.cur = DB.convs[0].id;
// 先拉角色信息(头像/介绍/例题都从那儿来),再画 —— 原来漏了这一步,
// 于是 ROLES 一直是空数组,选择屏渲染出来是空的:**「看不见选助手」就是这个 bug**。
async function loadRoles(){
  try{ ROLES = (await (await fetch("/roles")).json()).rows || []; }catch(e){ ROLES = []; }
  for(const r of ROLES) KINDS[r.kind] = r;
  syncHint(); drawSide(); drawStream();
}
syncHint(); drawSide(); drawStream(); grow(); $("#q").focus();
loadRoles(); loadModels();
