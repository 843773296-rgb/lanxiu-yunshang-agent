<title>AI 调控中心</title>
<!--SHELL-->
<style>
.hub{display:grid;grid-template-columns:184px 1fr;gap:16px;align-items:start}
@media(max-width:860px){.hub{grid-template-columns:1fr}}
.side{background:var(--paper);border:1px solid var(--line);border-radius:5px;padding:7px;position:sticky;top:64px}
.side a{display:block;padding:7px 10px;border-radius:4px;font-size:13.5px;color:var(--ink-2);text-decoration:none}
.side a:hover{background:var(--paper-2);color:var(--dye)}
.side a.on{background:var(--dye-soft);color:var(--dye);font-weight:600}
.side a.no{color:var(--ink-3)}
.side .h{font-family:var(--mono);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;
 color:var(--ink-3);padding:9px 10px 4px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:14px}
.kpi{background:var(--paper);border:1px solid var(--line);border-radius:5px;padding:13px 15px;border-top:2px solid var(--line)}
.kpi .k{font-family:var(--mono);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3)}
.kpi .v{font-family:var(--mono);font-size:24px;font-weight:600;font-variant-numeric:tabular-nums;line-height:1.35}
.kpi .n{font-size:12px;color:var(--ink-3);line-height:1.5}
table.l{width:100%;border-collapse:collapse;background:var(--paper);border:1px solid var(--line);border-radius:5px}
table.l th{text-align:left;font-family:var(--mono);font-size:10.5px;letter-spacing:.07em;text-transform:uppercase;
 color:var(--ink-3);padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
table.l td{padding:6px 10px;border-bottom:1px solid var(--line-2);font-size:12.8px;vertical-align:top}
table.l tr.r{cursor:pointer}table.l tr.r:hover{background:var(--paper-2)}
table.l tr.r.on{background:var(--dye-soft)}
td.mono,.mono{font-family:var(--mono);font-size:11.8px}
.ed{background:var(--paper);border:1px solid var(--line);border-radius:5px;padding:14px 16px;margin-bottom:14px}
.ed h3{margin:0 0 8px;font-size:15px}
.ed label{display:block;font-size:12px;color:var(--ink-3);margin:9px 0 3px;font-family:var(--mono)}
.ed input,.ed select,.ed textarea{width:100%;font:inherit;font-size:13px;padding:6px 9px;
 border:1px solid var(--line);border-radius:4px;background:var(--paper-2);color:var(--ink)}
.ed textarea{font-family:var(--mono);font-size:12px;line-height:1.7;min-height:130px;resize:vertical}
.ed .btns{display:flex;gap:8px;margin-top:11px;align-items:center;flex-wrap:wrap}
.ed button{font:inherit;font-size:13px;padding:6px 14px;border-radius:5px;border:1px solid var(--line);
 background:var(--paper-2);color:var(--ink);cursor:pointer}
.ed button.pri{background:var(--dye);border-color:var(--dye);color:#fff;font-weight:600}
.ed button:disabled{opacity:.5;cursor:default}
.ed .msg{font-size:12.5px;color:var(--ink-2);margin-left:4px}
.rulepick{max-height:210px;overflow:auto;border:1px solid var(--line-2);border-radius:4px;padding:6px}
.rulepick label{display:flex;gap:7px;align-items:flex-start;margin:0;padding:4px 5px;border-radius:4px;
 font-family:var(--sans);font-size:12.5px;color:var(--ink);cursor:pointer}
.rulepick label:hover{background:var(--paper-2)}
.rulepick input{width:auto;margin-top:3px}
.rulepick .rid{font-family:var(--mono);font-size:11.5px;color:var(--ink-3);flex:none;width:50px}
.seg{background:var(--paper);border:1px solid var(--line);border-radius:5px;margin-top:14px;padding:13px 15px}
.seg h3{margin:0 0 3px;font-size:14.5px}
.seg .why{font-size:12.5px;color:var(--ink-2);margin:0 0 9px}
.seg .kv{margin:8px 0}
.seg .kv .k{font-family:var(--mono);font-size:11px;color:var(--ink-3);margin-bottom:3px}
.seg .kv pre{margin:0;background:var(--paper-2);border:1px solid var(--line-2);border-radius:4px;
 padding:8px 10px;font-family:var(--mono);font-size:11.6px;line-height:1.66;white-space:pre-wrap;
 word-break:break-word;max-height:330px;overflow:auto}
.mods{display:grid;grid-template-columns:repeat(auto-fit,minmax(330px,1fr));gap:12px}
.mod{background:var(--paper);border:1px solid var(--line);border-radius:5px;padding:13px 15px;border-left:3px solid var(--pass)}
.mod.no{border-left-color:var(--ink-3);background:var(--paper-2)}
.mod h3{margin:0 0 3px;font-size:14.5px}
.mod p{margin:0 0 7px;font-size:12.8px;color:var(--ink-2);line-height:1.6}
.mod .row{font-size:12.4px;line-height:1.7;margin:4px 0;display:flex;gap:7px}
.mod .row b{flex:none;font-family:var(--mono);font-size:10px;padding:1px 5px;border-radius:3px;height:fit-content;margin-top:3px}
.mod .row.y b{background:var(--pass-soft);color:var(--pass);border:1px solid var(--pass)}
.mod .row.n b{background:var(--warn-soft);color:var(--warn);border:1px solid var(--warn)}
</style>
<div class="wrap">
<header class="top">
  <div class="eyebrow"><span class="dot"></span><span class="lab">AI 调控中心 · 自己调试用</span></div>
  <h1 id="h1">这个助手现在什么样</h1>
  <p class="deck" id="deck">左边挑一个模块。每个模块是一张列表，<b>点一行看那一条的全部完整信息</b>。</p>
</header>
<section>
<div class="hub">
  <nav class="side" id="nav"></nav>
  <div id="main"><div class="sub">读取中…</div></div>
</div>
</section>
</div>
<script>
const $=s=>document.querySelector(s);
const esc=s=>(s??"").toString().replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
const md=s=>esc(s).replace(/\*\*(.+?)\*\*/g,"<b>$1</b>").replace(/`(.+?)`/g,"<code class='mono'>$1</code>");
const 美=v=>{ if(v==null||v==="") return "(空)";
  if(typeof v==="object") return JSON.stringify(v,null,1);
  const t=String(v).trim(); if(t[0]==="{"||t[0]==="["){try{return JSON.stringify(JSON.parse(t),null,1)}catch(e){}}
  return String(v); };
// ⚠️ 分组**从服务端取**,页面不写第二份。
// 2026-09-25 用户截图发现:提示词版本做完了,左栏还挂在「还没有」——
// 因为这里原来是两行写死的清单,而真正的来源在 aihub.py。**一份数据两处维护,必漂。**
let MODS=[], NO=[];
const mod=(location.pathname.split("/")[2]||"");

async function 画左栏(){
  const d=await fetch("/ai/nav").then(r=>r.json()).catch(()=>({有:[],没有:[]}));
  MODS=(d.有||[]).map(x=>[x.键,x.名]); NO=(d.没有||[]).map(x=>[x.键,x.名]);
  $("#nav").innerHTML=`<div class="h">总览</div><a href="/ai" class="${mod?"":"on"}">全部模块</a>
  <div class="h">有数据</div>`+MODS.map(([k,n])=>`<a href="/ai/${k}" class="${mod===k?"on":""}">${n}</a>`).join("")
  +`<div class="h">还没有</div>`+NO.map(([k,n])=>`<a href="/ai/${k}" class="no ${mod===k?"on":""}">${n}</a>`).join("")
  +`<div class="h">别的页</div><a href="/debug">单次运行树</a><a href="/experiments">实验对比</a>`;
}


/* ── 新建候选(用户 2026-09-25:「我岂不是不能手动配置提示词」)──────────
   原来这一页是**只读**的:候选只能在命令行建、正文要手改 JSON 文件。
   而这个项目的用户不读代码也不用终端 —— **对他来说那等于没有入口**。
   ⚠️ 判定一条都不在页面里重写:新建/存正文/采纳全转给 tools/prompt_candidate.py,
   那边守着三条硬规矩(找不到候选当场抛、只在显式指定时生效、没验证记录不许采纳)。 */
async function 新建框(){
  if(document.getElementById("newc")) return;
  const R=await fetch("/ai/rules").then(r=>r.json()).catch(()=>({rows:[]}));
  const rs=R.rows||[];
  const box=document.createElement("div"); box.className="ed"; box.id="newc";
  box.innerHTML=`<h3>＋ 新建候选</h3>
    <p class="sub" style="margin:0 0 6px;font-size:12.5px">
      改提示词<b>不许直接改线上那份</b>：先建候选 → 跑验证集 → 并排比分 → <b>采纳才落回源头</b>。
      直接改的话，分数变了也说不清是哪一处改动带来的，而且改坏了没有第二份可以比。</p>
    <label>给它起个号（自己认得出就行，比如 TL53-更短）</label>
    <input id="nc-id" placeholder="候选号">
    <label>为什么改（这句话以后是你唯一能想起动机的地方）</label>
    <input id="nc-why" placeholder="比如：TL53 现在 4 行，想试试压到 2 行会不会更管用">
    <label>改哪几条规矩（共 ${rs.length} 条）</label>
    <input id="nc-q" placeholder="筛一下：输入编号或正文里的词…" style="margin-bottom:6px">
    <div class="rulepick" id="nc-rules"></div>
    <div class="btns"><button class="pri" id="nc-go">建候选</button>
      <span class="msg" id="nc-msg"></span></div>`;
  $("#main").prepend(box);
  const 画=(q="")=>{
    const t=(q||"").trim().toLowerCase();
    $("#nc-rules").innerHTML=rs.filter(r=>!t||r.id.toLowerCase().includes(t)||r.正文.toLowerCase().includes(t))
      .map(r=>`<label><input type="checkbox" value="${esc(r.id)}">
        <span class="rid">${esc(r.id)}</span>
        <span>${esc(r.正文.replace(/\s+/g," ").slice(0,80))}…
          <span style="color:var(--ink-3)">· 挂在 ${esc((r.挂在||[]).join("、"))}</span></span></label>`).join("")
      ||`<div class="sub" style="padding:6px">没有匹配的规矩</div>`;
  };
  画();
  $("#nc-q").oninput=e=>画(e.target.value);
  $("#nc-go").onclick=async()=>{
    const 号=$("#nc-id").value.trim();
    const 改=[...$("#nc-rules").querySelectorAll("input:checked")].map(x=>x.value);
    const m=$("#nc-msg");
    if(!号||!改.length){ m.textContent="要起个号，并且至少选一条规矩。"; return; }
    $("#nc-go").disabled=true; m.textContent="建中…";
    const r=await fetch("/ai/candidate",{method:"POST",headers:{"content-type":"application/json"},
      body:JSON.stringify({动作:"新建",号,改,为什么:$("#nc-why").value.trim()})}).then(r=>r.json());
    $("#nc-go").disabled=false;
    if(r.error){ m.textContent="没建成："+r.error; return; }
    m.textContent="建好了，点下面那一行改正文。";
    const box2=document.getElementById("newc"); if(box2) box2.remove();
    模块("prompts");
  };
}

/* 候选详情:正文可改、能跑验证、能采纳 —— **入口在页面上,不在命令行**。 */
async function 候选编辑(号,d){
  const 原=d.原始||{}, 改=原.改||{}, 拷=原.拷自||{}, 验=(原.验证||[]);
  $("#det").innerHTML=`
    <div class="ed"><h3>改正文 · ${esc(号)}</h3>
      <p class="sub" style="margin:0;font-size:12.5px">${esc(原.为什么||"(没写为什么)")}</p>
      ${Object.keys(改).map(rid=>`
        <label>${esc(rid)}　<span style="color:var(--ink-3)">改完点保存</span></label>
        <textarea data-rid="${esc(rid)}">${esc(改[rid])}</textarea>
        <details style="margin-top:5px"><summary class="sub" style="font-size:12px;cursor:pointer">
          看源头那一版（拷出去时长这样）</summary>
          <pre class="io">${esc(拷[rid]||"")}</pre></details>`).join("")}
      <div class="btns">
        <button class="pri" id="c-save">保存正文</button>
        <select id="c-suite" style="width:auto">
          <option value="agent/factory_eval.py|agent/factory-eval-results.jsonl">工厂回传 11 题</option>
          <option value="agent/workshop_eval.py|agent/workshop-eval-results.jsonl">自有工坊报工 6 题</option>
          <option value="agent/measure_eval.py|agent/measure-eval-results.jsonl">量体录入 8 题</option>
          <option value="agent/ops_eval.py|agent/ops-eval-results.jsonl">运维侧 68 题</option>
        </select>
        <button id="c-run">跑验证集</button>
        <button id="c-note">记一次</button>
        <button id="c-adopt">采纳（落回源头）</button>
        <span class="msg" id="c-msg"></span></div>
      <p class="sub" style="margin:10px 0 0;font-size:12px">
        <b>没跑过验证集不许采纳</b> —— 绕过这一步之后，它和「直接改源头」一模一样。
        已经跑过 <b>${验.length}</b> 次${验.length?"："+验.map(v=>`${esc(v.时间)} ${v.过}/${v.题数}`).join("、"):""}。</p>
    </div>` + (d.段||[]).map(s=>`<div class="seg">
      <h3>${esc(s.名)}</h3><p class="why">${md(s.说||"")}</p>
      ${(s.内容||[]).map(([kk,vv])=>`<div class="kv"><div class="k">${esc(kk)}</div>
        <pre>${esc(美(vv))}</pre></div>`).join("")}</div>`).join("");
  const m=$("#c-msg");
  const 发=async b=>{
    m.textContent="…";
    const r=await fetch("/ai/candidate",{method:"POST",headers:{"content-type":"application/json"},
      body:JSON.stringify(Object.assign({号},b))}).then(r=>r.json());
    // **拒绝的理由原样显示** —— 那句话就是下一步该干什么
    m.innerHTML=r.error?`<b style="color:var(--fail)">${esc(r.error)}</b>`
      :esc(r.note||"好了");
    return r;
  };
  const 套=()=>$("#c-suite").value.split("|");
  $("#c-save").onclick=async()=>{
    const 正={}; $("#det").querySelectorAll("textarea[data-rid]").forEach(t=>正[t.dataset.rid]=t.value);
    await 发({动作:"存正文",正文:正});
  };
  $("#c-run").onclick=()=>发({动作:"跑验证集",套:套()[0]});
  $("#c-note").onclick=()=>发({动作:"记一次",结果文件:套()[1]});
  $("#c-adopt").onclick=async()=>{ const r=await 发({动作:"采纳"}); if(r&&r.ok) 模块("prompts"); };
}

画左栏().then(() => {
  if(!mod) 总览(); else if(NO.some(([k])=>k===mod)) 还没有(); else 模块(mod);
});

async function 总览(){
  const d=await fetch("/ai/overview").then(r=>r.json());
  if(d.error){ $("#main").innerHTML="读不到："+esc(d.error); return; }
  const k=d.跑;
  $("#main").innerHTML=`<div class="kpis">`+[
    ["今天调了几次",k.今日次数,`累计 ${k.累计次数} 次`],
    ["今天花了","$"+k.今日花费,`累计 $${k.累计花费}`],
    ["记下的咨询",k.树,`${k.span} 个 span`],
    ["模块",`${d.做了}/9`,`${d.没做} 个还没有`]].map(([a,b,c])=>
      `<div class="kpi"><div class="k">${esc(a)}</div><div class="v">${esc(b)}</div><div class="n">${esc(c)}</div></div>`).join("")
    +`</div><p class="sub">业务今天 <b>${esc(d.今天||"—")}</b>，机器 <b>${esc(d.机器今天)}</b>。`
    +(d.今天===d.机器今天?"一致（世界每天平移到当天）。":" ⚠️ <b>对不上</b>，今天还没跑 <code class='mono'>tools/shift_world.py</code>。")
    +`</p><div class="mods">`+d.模块.map(m=>`<div class="mod ${m.状态==="还没有"?"no":""}">
      <h3>${m.号}. ${esc(m.名)}</h3><p>${esc(m.问)}</p>
      ${m.有?`<div class="row y"><b>有</b><span>${md(m.有)}</span></div>`:""}
      ${m.缺?`<div class="row n"><b>缺</b><span>${md(m.缺)}</span></div>`:""}</div>`).join("")+`</div>`;
}

function 还没有(){
  const n=(NO.find(([k])=>k===mod)||[])[1];
  fetch("/ai/overview").then(r=>r.json()).then(d=>{
    const m=(d.模块||[]).find(x=>x.名===n)||{};
    $("#h1").textContent=n; $("#deck").innerHTML="<b>还没有这个模块。</b>下面写清它要回答什么、缺了它会怎样。";
    $("#main").innerHTML=`<div class="seg"><h3>${esc(n)}</h3>
      <p class="why">${esc(m.问||"")}</p>
      <div class="kv"><div class="k">为什么还没有 / 做之前要先定什么</div>
        <pre>${md(m.缺||"—")}</pre></div></div>`;
  });
}

async function 模块(k){
  const n=(MODS.find(([x])=>x===k)||[])[1]||k;
  $("#h1").textContent=n;
  if(k==="prompts") await 新建框();
  if(k==="finetune") 导出条();
  const d=await fetch("/ai/data?mod="+encodeURIComponent(k)).then(r=>r.json());
  const rows=d.rows||[];
  if(!rows.length){ $("#main").innerHTML=`<p class="sub">这个模块还没有数据。</p>`; return; }
  const cols=Object.keys(rows[0]).filter(c=>c!=="id");
  $("#deck").innerHTML=`共 <b>${rows.length}</b> 条（最新在上）。<b>点一行看那一条的全部完整信息。</b>`;
  $("#main").innerHTML=`<table class="l"><thead><tr>${cols.map(c=>`<th>${esc(c)}</th>`).join("")}</tr></thead>
    <tbody>${rows.map(r=>`<tr class="r" data-id="${esc(r.id)}">${cols.map(c=>
      `<td class="${typeof r[c]==="number"||/^[\w:.$-]+$/.test(String(r[c]??""))?"mono":""}">${esc(String(r[c]??"").slice(0,90))}</td>`).join("")}</tr>`).join("")}</tbody></table>
    <div id="det"></div>`;
  document.querySelectorAll("tr.r").forEach(tr=>tr.onclick=()=>详情(k,tr.dataset.id,tr));
}

/* 训练数据导出 —— **导出前强制脱敏,不给不脱的选项**。
   实测这些对话里 40 条回答含订单号 29 次、押金单 20 次、工号 25 次。
   脱敏是**换成稳定的假号**不是抹掉:抹掉会毁掉句子结构,而结构正是要学的东西;
   稳定映射保住「前后指同一张单」这件事。 */
function 导出条(){
  if(document.getElementById("ftbar")) return;
  const box=document.createElement("div"); box.className="ed"; box.id="ftbar";
  box.innerHTML=`<h3>导出训练数据</h3>
    <p class="sub" style="margin:0 0 8px;font-size:12.5px">
      导成<b>通用对话 JSONL</b>（<code class="mono">messages:[{role,content}]</code>）——
      <b>不绑任何一家的私有格式</b>：开源权重自己训、别家托管服务，吃的都是这个形状。
      <br><b>导出前一律脱敏</b>，而且没有「不脱」这个选项：一份没脱干净的训练集流出去，是追不回来的。
      订单号 / 客户号 / 着装人 / 押金单 / 工号 / 快递单 / 手机号会换成
      <code class="mono">&lt;订单号001&gt;</code> 这样的稳定假号（同一个真号永远换成同一个）。</p>
    <div class="btns">
      <a class="go" href="/ai/export-finetune" download style="text-decoration:none">
        <button class="pri" id="ft-ok">导出「够格」的那些</button></a>
      <a class="go" href="/ai/export-finetune?全部=1" download style="text-decoration:none">
        <button id="ft-all">连「先别」的一起导</button></a>
      <span class="msg">「先别」那些多半是一个工具都没调的 —— 拿它们训，学到的是怎么说话不是怎么办事。</span>
    </div>`;
  $("#main").prepend(box);
}

async function 详情(k,id,tr){
  document.querySelectorAll("tr.r").forEach(x=>x.classList.toggle("on",x===tr));
  const d=await fetch(`/ai/data?mod=${encodeURIComponent(k)}&id=${encodeURIComponent(id)}`).then(r=>r.json());
  if(d.错){ $("#det").innerHTML=`<div class="seg">${esc(d.错)}</div>`; return; }
  if(k==="prompts"){ await 候选编辑(id,d); return; }
  $("#det").innerHTML=(d.段||[]).map(s=>`<div class="seg">
      <h3>${esc(s.名)}</h3><p class="why">${md(s.说||"")}</p>
      ${(s.内容||[]).map(([kk,vv])=>`<div class="kv"><div class="k">${esc(kk)}</div>
        <pre>${esc(美(vv))}</pre></div>`).join("")}</div>`).join("")
    + (k==="runs"?`<div class="seg"><a href="/debug">在调用树里看这一次 →</a></div>`:"");
  $("#det").scrollIntoView({behavior:"smooth",block:"nearest"});
}
</script>
