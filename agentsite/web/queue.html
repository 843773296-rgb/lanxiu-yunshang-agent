<style>
/* ⚠️⚠️ 2026-10-14 改成**列表整宽 + 详情弹窗**(用户拍)。
   原来是 `1.15fr 1fr` 左右分栏 —— 右边那块**不管有没有选中行都占掉 46%**,

   结果:「评价差评」「未研判」这种词**一个字一行竖着排**,行高撑成四倍,
   一屏只看得到 5~6 条 —— 而「已销账」那一档有 207 条。

   > 一个「详情面板留着位置等你点」和一个「表格被挤到没法读」,
   > **在那个 grid 定义上长得一模一样** —— 而只有打开页面才看得见是后者。

   ⚠️ 这件事**四道验证全都没看见**:js_check(语法)、js_smoke(填了 4228 字真实数据)、
   我自己那个脚本(收起 41 行 / 点开 207 行 / 三个数对得上)、门禁(queue.html 干净)——
   全绿。**数据层全对,而页面没法用。**
   > 一个「表格渲染正确」和一个「每个字单独占一行」,
   > **在「#rows 被填了真实数据」这件事上长得一模一样。** */

<section>

<script>
const $=s=>document.querySelector(s);
const esc=s=>(s??"").toString().replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
const LV={已超时:"over",临期:"near",正常:"ok",已销账:"dye"};
// ⚠️⚠️ **「已销账」原来把四件完全不同的事混成一个灰标签。** 实测库里:
//   工单已关闭、**从来没走过研判** 151 条 · 研判有结论 10 条(采纳 5 / 升级 5 / 改判 0)
// 而后端 `backend/ops.py` 的 `queue()` **早就把来源分开报了**
// (`凭什么销账` / `研判有结论` / `工单已关闭`,业务 2026-09-28 拍的),
// 它的注释写着:压平之后「研判过并采纳了」和「工单被关掉但一条研判都没走过」
// 长得一模一样,而后者**要人看一眼**。
// **而这一页之前那三个字段一个都没用**(grep 命中 0)——
// > 后端把话说清楚了,页面又把它压回去了。
// > 而这种情况比「后端没做」更难发现:两边分别看都是对的。
function 销账标(x){
  if(!x.done) return "—";
  if(x.研判有结论 && x.工单已关闭) return `<span class="tag dye">研判${esc(x.state).replace("已","")}·已关单</span>`;
  if(x.研判有结论) return `<span class="tag dye">研判${esc(x.state).replace("已","")}</span>`;
  // 这一种最该被看见:它没走过研判,可能是对的(有些事不需要研判),也可能是有人直接关单了事
  return `<span class="tag shut" title="${esc(x.凭什么销账||"")}">只是关单·没研判</span>`;
}
const CF={高:"ok",中:"near",低:"over"};
let state="待办", rows=[], sel=null;
// 「没走正门关的」那 166 条默认**收起**(用户 2026-10-14 拍)。
// ⚠️ 收起只影响**列表**,不影响计数 —— 「166 条被收起」和「166 条不见了」
// 在一个只显示 41 条的页面上长得一模一样,而后者会让人以为数据丢了。
// 所以标题上三个数同时摆:这一档总数 / 其中走过正门的 / 其中没走正门的。
let 展开没走正门=false;

// 弹窗开关。**只在这一处切**,不在 open_ / 切档 / 清空那三处各写一份 ——
// 三处写就会漂:哪天多一条路径忘了切,`sel` 和「弹窗开着没」就对不上,
// 而那时**两边分别看都正常**(sel 是对的、弹窗状态也是个合法状态)。
function 弹窗跟着选中走(){
  const p=$("#panel"), m=$("#mask");
  if(p) p.classList.toggle("on", !!sel);
  if(m) m.classList.toggle("on", !!sel);
  const k=$("#关钮"); if(k) k.classList.toggle("on", !!sel);
}
function 关弹窗(){ sel=null; render(); }
function render(){
  弹窗跟着选中走();
  // ⚠️⚠️ **收起用 `没走正门`,标签用 `研判有结论` —— 两个都要用,不能互相替代。**
  // 这一轮数据上它们恰好**完全互补**(166 / 41,没有交叉格),所以今天用哪个
  // 画出来一样。但它们问的是两件事:`研判有结论` 是「AI 出过结论吗」,
  // `没走正门` 是「关单时走没走审计」。
  // 等有人在页面上走完「AI 出结论 → 复核 → 走正门关单」,那条就是
  // **研判有结论且走了正门** —— 一个今天不存在的第四格。
  // > 一个「这两个字段说的是同一件事」和一个「它们现在恰好互补」,
  // > **在今天这张交叉表上长得一模一样。**
  // 图省事只用一个,等第四格出现时页面会把它归错,**而那时没有任何东西会报错**。
  const 显 = (state==="已销账" && !展开没走正门)
             ? rows.filter(x=>!x.没走正门) : rows;
  $("#rows").innerHTML = 显.length ? 显.map(x=>`
    <tr data-t="${esc(x.task_id)}" ${sel===x.task_id?'aria-selected="true"':""}>
      <td class="num">${esc(x.task_id)}</td><td>${esc(x.type)}</td>
      <td class="num">${x.waited_h}h</td>
      <td><span class="tag ${LV[x.level]}">${esc(x.level)}</span></td>
      <td>${esc(x.state)}</td>
      <td>${销账标(x)}</td>
      <td>${x.ai_confidence?`<span class="tag ${CF[x.ai_confidence]||""}">${x.ai_confidence}</span>`:"—"}</td>
      <td class="num">${x.cost!=null?"$"+(+x.cost).toFixed(4):"—"}</td></tr>`).join("")
    : `<tr><td colspan="8" class="empty">${
        (state==="已销账" && !展开没走正门 && rows.length)
          ? `这一档 ${rows.length} 条**全是「没走正门关的」**,已经收起 —— 点上面那个按钮看。`
          : "这一档是空的。"}</td></tr>`;
  $("#rows").querySelectorAll("tr[data-t]").forEach(tr=>tr.onclick=()=>open_(tr.dataset.t));
}
async function load(){
  const q=await fetch("/api/ops-queue"+(state?"?state="+encodeURIComponent(state):"")).then(r=>r.json());
  rows=q.rows; render();
  if(q.counts) 更新档位计数(q.counts);
  // 「已销账」这一档顶上报分组计数 —— 一行行看才看出「大多数根本没走过研判」,
  // 等于没分开。这个数直接说出来。
  if(state==="已销账") 报销账计数();
  else if(state==="待办") 报待办计数(q.counts);
  else if(state==="已超时") 报超时计数();
}

// 档位按钮上直接写条数。**数字由后端一次算完给过来**(`counts`),
// 不在页面上数 —— 页面手上只有本档的行,数不出别档的,
// 而「按钮上写 14、点进去 11 条」这种漂,两边分别看都正常。
function 更新档位计数(c){
  const g=$("#seg"); if(!g) return;
  g.querySelectorAll("button").forEach(b=>{
    const k=b.dataset.s||"全部", n=c[k];
    if(n!==undefined) b.textContent=k+" "+n;
  });
}

// ⚠️ **「待办」这一档现在不含超时的了,所以必须当场说出超时有多少条。**
// 用户 2026-10-15 拍「所有超时的归到超时而不是待办」—— 分开之后待办只剩 2 条,
// 而一个只显示 2 条的页面上,「超时的挪到隔壁了」和「数据丢了」长得一模一样。
function 报待办计数(c){
  const 超=(c&&c["已超时"])||0;
  提示("这一档 "+rows.length+" 条 —— 只剩还来得及的。"
     + (超 ? "另有 "+超+" 条已超时,挪到「已超时」那一档了(点上面那个按钮)"
           : "超时的一条都没有"),
     超?"bad":"ok");
}

function 报超时计数(){
  const 久=rows.length?Math.max(...rows.map(x=>x.waited_h||0)):0;
  提示("这一档 "+rows.length+" 条全部已超时,等最久的 "+久.toFixed(1)+" 小时 —— "
     + "它们不在「待办」里,别靠那一档的数字判断还剩多少活", rows.length?"bad":"ok");
}

// ⚠️ 提示原来只有 textContent,**成功和「有失败」长得一模一样**。
// 现在分 ok / bad 两种样式,而且**有一条失败就不出成功样式**。
// 「已销账」这一档的三个数 + 展开按钮。**抽成函数是因为按钮要再调它一次** ——
// 第一版我在按钮里写了 `load_提示()`,**那个函数根本不存在**:
// 点一下就 ReferenceError,而 `js_check.py` 过了 —— 它只验语法,不验函数在不在。
// > 一个「这个函数名写对了」和一个「它压根不存在」,
// > **在语法检查通过这件事上长得一模一样。**
function 报销账计数(){
  const 研=rows.filter(x=>x.研判有结论).length;
  const 没门=rows.filter(x=>x.没走正门).length;
  // **三个数同时摆** —— 只摆剩下的那个,用户点开会发现和总数对不上。
  提示(`这一档 ${rows.length} 条:研判有结论 ${研} 条`
       + (没门?` · 没走正门关的 ${没门} 条(${展开没走正门?"已展开":"默认收起"})`:"")
       + (没门?` <button id="展" class="lnk">${展开没走正门?"收起":"点开看"}</button>`:"")
       + (没门?` —— 那批关单时没有审计记录,多半是正门做好之前直接写库的`
               + `(造数也走不到正门);这个数往上涨就是正门又被绕过了`:""),
       没门?"bad":"ok");
  const b=$("#展");
  if(b) b.onclick=()=>{ 展开没走正门=!展开没走正门; render(); 报销账计数(); };
}

function 提示(文, 级){
  const e=$("#msg"); e.textContent=文;
  e.className="note" + (级?" "+级:"");
}

// ⚠️⚠️ **「出哪句提示」抽成纯函数,不写在 onclick 里面。**
// 原来那一句是 `研判 ${跑了} 条,失败 ${failed.length} 条` —— 两件事写在同一句里,
// 读起来像「跑完了」,而其中几条根本没跑出来。
// > **一个「全跑成了」和一个「跑了一半」,在那一句话里长得一模一样。**
//
// 抽出来的第二个理由比第一个重要:**写在 onclick 里面的判定,判据调不到它**。
// 咬合当场证明过这一点:判据原来只查「文件里有没有『全部跑出来了』这几个字」,
// 于是把失败那一支改成 `else if(false)` —— 字符串还在,**判据照样绿**。
// > 一个「写了但永远到不了」的分支,和一个真的分支,
// > **在「字符串在不在文件里」上长得一模一样。**
// 现在 `agentsite/queue_view_check.py` 拿一个「有 2 条失败」的入参**真的调它**。
function 批量提示文(r, 跑了, state){
  if(r && r.error) return {文:"失败:"+r.error, 级:"bad"};
  const 挂 = (r && r.failed) || [];
  if(挂.length){
    // 点名是哪几条 —— 光说「失败 2 条」没法查
    const 号 = 挂.map(f=>(f&&(f.task_id||f.id))||f).filter(Boolean).slice(0,4).join("、");
    // ⚠️⚠️ 2026-10-14 用户撞到:点「研判」**看起来没反应**。
    // 队列「待办」档最前面全是评价差评,而**差评的 AI 研判按业务 2026-10-10 拍板
    // 是默认关的**(由店长人工确认)。后端把这句话原样返回了:
    //   「『评价差评』没有 AI 研判分支,**不是跑挂了**。差评的 AI 辅助默认关闭
    //     —— 差评由店长人工确认(业务 2026-10-10 拍)」
    // **而这里只取了 `task_id`、把 `error` 整个丢掉了**,于是显示成
    // 「有 1 条没跑出来 —— 失败那几条还在原来那一档里,没有被处理」。
    //
    // > 一个「这条跑挂了」和一个「这条按设计不该跑」,
    // > **在「有 1 条没跑出来」这句话上长得一模一样** ——
    // > 而后端恰恰把区别写清楚了,**就在它丢掉的那个字段里**。
    //
    // 后果比「少一句话」重:它把一个**设计**说成了**故障**,
    // 而照着它去查,会去查那条工单哪里坏了 —— 查一个没有坏的东西。
    // 所以**原因原样打出来**,不替后端改写、不替它分类。
    // `ValueError:` 这类 Python 异常类名对看的人没有意义,只会让它更像故障 —— 削掉。
    const 因 = [...new Set(挂.map(f => ((f && f.error) || "")
                  .replace(/^\w+(Error|Exception):\s*/, "")).filter(Boolean))];
    // ⚠️⚠️ **「按设计不跑」和「跑挂了」要在第一句话上就分开。**
    // 第一版我只是把原因拼在「有 N 条没跑出来…没有被处理」后面 —— 而后端那句话里
    // 明写着「**不是跑挂了**」,两句话当场互相矛盾,**而人读到的是前半句**。
    //
    // 判断依据**只能来自后端那句话本身**:`backend/ops.py` 两处都用同一个写法
    // (`…没有评价 —— 判不了,不是跑挂了` / `「X」没有 AI 研判分支,不是跑挂了`)。
    // **不在页面里重新分类** —— 那就又是一份会漂的口径:哪天后端多一种「不该跑」,
    // 页面这份名单不会跟着变,而它会把那一种显示成故障。
    const 都是按设计 = 挂.length > 0 && 挂.every(f => ((f && f.error) || "").includes("不是跑挂了"));
    if(都是按设计){
      // ⚠️ 这里原来写的是 `**按设计不走 AI 研判**` —— 而 `提示()` 用的是 textContent,
      // 于是那两对星号**原样显示在页面上**。加粗要靠样式,不能靠 Markdown 记号:
      // 写 md 写惯了手就会带上,而它在源码里看着像强调、在页面上是两个星号。
      return {文:`这 ${挂.length} 条按设计不走 AI 研判${号?"("+号+")":""} —— `
                + 因.slice(0,2).join(" / "),
              级:""};   // 不是 bad:它没出错
    }
    const 因文 = 因.length ? ` · ${因.slice(0,2).join(" / ")}` : "";
    return {文:`有 ${挂.length} 条没跑出来${号?"("+号+")":""};成功 ${跑了} 条,`
              + `$${((r&&r.cost)||0).toFixed(4)} —— 失败那几条还在原来那一档里,没有被处理`
              + 因文,
            级:"bad"};
  }
  // ⚠️ **跑了 0 条要单独说。** 原来这里不管跑没跑都说「研判 N 条全部跑出来了」,
  // N=0 时就成了「研判 0 条全部跑出来了」—— 听着像成功,其实什么都没发生。
  // 后端在这种情况下会把原因放进 `note`(比如「未研判的那些没有一条有 AI 研判分支」),
  // 而这个函数原来**根本没读 note**,那句话就被吞掉了。
  // > 一个「全跑成了」和一个「一条都没跑」,在「全部跑出来了」这句话上长得一模一样。
  if(!跑了) return {文:(r&&r.note) || "这次一条都没跑 —— 队列里没有可跑的工单", 级:""};
  return {文:`研判 ${跑了} 条全部跑出来了,$${((r&&r.cost)||0).toFixed(4)}`
            + (state==="待复核"?" —— 已跳到「待复核」,在这一档里签字":""),
          级:"ok"};
}
function fld(k,v,dim){return `<div class="fld"><div class="k">${k}</div>
  <div class="v${dim?" dim":""}">${v?esc(v):"—"}</div></div>`;}

// 把筛选切到某一档(不重复写三处 aria-pressed)
function 切档(s){
  state=s;
  $("#seg").querySelectorAll("button").forEach(x=>
    x.setAttribute("aria-pressed", x.dataset.s===s ? "true" : "false"));
}

async function open_(tid){
  sel=tid; render();
  let x=rows.find(r=>r.task_id===tid);
  // ⚠️ **找不到不许静默返回。**
  // 刚研判完的那条会从「未研判」这一档里消失(它变成了「待复核」),
  // 于是原来这里 `if(!x) return;` 什么也不做 —— 而上面的提示写着「研判完成,请复核」。
  // 结果就是:**提示说完成了,页面上却没有任何可以复核的地方**,
  // 而且看起来不像出错,像是这个功能本来就到此为止。(用户 2026-09-24 当场撞到。)
  if(!x){
    const q=await fetch("/api/ops-queue").then(r=>r.json()).catch(()=>({rows:[]}));
    x=(q.rows||[]).find(r=>r.task_id===tid);
    if(x){                                  // 在别的档里 —— 把档切过去,并说一句为什么跳了
      切档(x.done?"已销账":"待复核");
      await load();
      $("#msg").textContent=`已跳到「${state}」—— ${tid} 研判完就从「未研判」挪过来了`;
      sel=tid; render();
      x=rows.find(r=>r.task_id===tid);
    }
  }
  if(!x){
    $("#panel").innerHTML=`<div class="hd"><span class="id">${esc(tid)}</span></div>
      <div class="bd"><div class="empty">这条工单在队列里找不到了。<br>
      可能已被别人销账,或者它不在任何一档里 —— 点「全部」再找一次。</div></div>`;
    return;
  }
  const hd=`<span class="id">${esc(x.task_id)}</span>
    <span class="tag ${LV[x.level]}">${esc(x.level)}</span>
    <span class="tag">${esc(x.type)}</span>
    <span class="tag">等了 ${x.waited_h}h</span>`;
  if(!x.triage_id){
    $("#panel").innerHTML=`<div class="hd">${hd}</div>
      <div class="bd"><div class="empty">这条还没研判过。<br>用上面的「研判 N 条」按钮跑,或单独跑它。</div></div>
      <div class="ft"><button class="pri" onclick="runOne('${esc(x.task_id)}')">只跑这一条</button></div>`;
    return;
  }
  const d=await fetch("/api/ops-detail?id="+x.triage_id).then(r=>r.json());
  const done=["已采纳","已改判","已升级"].includes(d.status);
  $("#panel").innerHTML=`<div class="hd">${hd}
    <span class="tag ${CF[d.ai_confidence]||""}">置信度 ${esc(d.ai_confidence)}</span>
    <span class="tag ${done?"dye":""}">${esc(d.status)}</span></div>
  <div class="bd">
    ${fld("智能体给的根因",d.ai_root_cause)}
    ${fld("建议动作",d.ai_action)}
    ${fld("证据",d.ai_evidence)}
    <div class="fld"><div class="k">查了哪些数据 · ${d.tool_calls} 次 · $${(+d.cost||0).toFixed(4)} · ${Math.round((d.latency_ms||0)/1000)}s · ${esc(d.model)}</div>
      <div class="traj">${esc((d.ai_text||"").slice(0,700))||"(没有正文)"}</div></div>
    ${done?fld("人工裁决",`${d.status} · ${d.handler||""} ${d.handled_at||""}
${d.human_root_cause||""}${d.human_note?"\n"+d.human_note:""}`):""}
    ${done?"":`<div class="edit" id="edit">
      <label>你认定的根因</label><input type="text" id="hrc" placeholder="改判必填 —— 这句会成为这条 case 的标注答案">
      <label>应该怎么处理</label><input type="text" id="hac" placeholder="例:不得重新发起退款,先向渠道核对流水">
      <label>备注 / 依据</label><textarea id="hnt" rows="2" placeholder="选填"></textarea>
      <div class="hint"><b>注意:</b>改判会写进评测集并标为「人工改判」。
        它<b>只经过你一个人</b>的判断,回归时会单独统计通过率 —— 判错了会变成假的标准答案。</div>
    </div>`}
  </div>
  ${done?"":`<div class="ft">
    <button class="pri" onclick="resolve(${d.id},'已采纳')">采纳草稿</button>
    <button onclick="toggleEdit()" id="btnEdit">改判…</button>
    <button onclick="resolve(${d.id},'已升级')">升级给店长</button>
    <span class="note" id="rmsg" style="font-size:12.5px;color:var(--ink-3)"></span></div>`}`;
}
window.toggleEdit=()=>{
  const e=$("#edit"); e.classList.toggle("on");
  const on=e.classList.contains("on");
  $("#btnEdit").textContent=on?"提交改判":"改判…";
  $("#btnEdit").onclick=on?()=>{
    const rc=$("#hrc").value.trim();
    if(!rc){$("#rmsg").textContent="改判必须写清根因 —— 它要当标注答案用。";return;}
    resolve(+$("#panel").querySelector("[onclick^='resolve']").getAttribute("onclick").match(/\d+/)[0],
            "已改判",rc,$("#hac").value.trim(),$("#hnt").value.trim());
  }:window.toggleEdit;
};
window.resolve=async(id,decision,rc,ac,nt)=>{
  const r=await fetch("/api/ops-resolve",{method:"POST",headers:{"content-type":"application/json"},
    body:JSON.stringify({triage_id:id,decision,handler:"值班同学",root_cause:rc,action:ac,note:nt})
  }).then(r=>r.json());
  if(r.error){ $("#rmsg").textContent="失败:"+r.error; return; }
  await load();
  $("#msg").textContent=`${decision}${r.回流评测集?" · 已回流评测集":""}`;
  open_(sel);
};
window.runOne=async(tid)=>{
  提示("跑这一条中…", "");
  const r=await fetch("/run-triage",{method:"POST",headers:{"content-type":"application/json"},
    body:JSON.stringify({task_id:tid})}).then(r=>r.json()).catch(e=>({error:e+""}));
  if(r&&r.error){ 提示("研判失败:"+r.error, "bad"); return; }
  提示("研判完成,请复核", "ok");
  await load();
  await open_(tid);      // ← 要 await:它可能要换一档才找得到这条
};
$("#run").onclick=async(e)=>{
  if(e.target.id==="n") return;
  const b=$("#run"); b.disabled=true; 提示("智能体在跑……", "");
  const r=await fetch("/run-batch",{method:"POST",headers:{"content-type":"application/json"},
    body:JSON.stringify({n:+$("#n").value||3})}).then(r=>r.json()).catch(e=>({error:e+""}));
  b.disabled=false;
  const 跑了=(r.done||[]).length;
  // 批量跑完也一样:在「未研判」档里跑,跑完的那几条会当场消失 ——
  // 列表只是变短,看不出它们去哪了。跑出东西来就把档切到「待复核」。
  if(!r.error && 跑了 && state==="未研判") 切档("待复核");
  await load();
  const t = 批量提示文(r, 跑了, state);
  提示(t.文, t.级);
  // 打开**刚跑完的那一条**,不是列表第一条 —— 列表第一条很可能是还没研判的,
  // 那会让人以为「跑了等于没跑」。open_ 自己会在找不到时换一档。
  const 头=(r.done||[])[0];
  if(!r.error && 头 && 头.task_id) await open_(头.task_id);
};
$("#seg").querySelectorAll("button").forEach(b=>b.onclick=()=>{
  $("#seg").querySelectorAll("button").forEach(x=>x.setAttribute("aria-pressed","false"));
  切档(b.dataset.s); sel=null; load();
  $("#panel").innerHTML=`<div class="hd"><span class="id">选一条工单</span></div>
    <div class="bd"><div class="empty">左边点一行。</div></div>`;
});
// ── 弹窗的三条关闭路径,**一条都不能少** ──────────────────────────────
//
// ⚠️ 弹窗最常见的坏法不是打不开,是**关不掉** —— 而「关不掉」在截图上
// 和「正常打开着」长得一模一样:两张图都是弹窗盖在页面上。
// 所以三条路径都接上,并且都走同一个 `关弹窗()`(不在三处各写一份状态切换)。
//
// ⚠️ 关闭按钮用**事件委托**挂在 panel 上,不在那三处写内容的地方各加一个 ——
// 那三处会漂:哪天多一处写内容的地方忘了加按钮,那种情形下弹窗就只能靠 ESC 关,
// 而**那一处和别处在代码上长得一模一样**。
document.addEventListener("keydown", e => { if(e.key === "Escape" && sel) 关弹窗(); });
$("#mask").onclick = () => 关弹窗();
$("#关钮").onclick = () => 关弹窗();
// ⚠️ 关闭按钮**写在 HTML 骨架里**(`#panel` 外面那一层),不靠 JS 往里补。
//
// 第一版我用 `MutationObserver` 监听 panel 内容变化、自动补按钮 ——
// **冒烟当场红**:那个最小 DOM 桩里没有 `MutationObserver`,脚本同步执行就挂,
// 浏览器里的表现是「框架有、数据没有」。而**截图是绿的**(真 Chrome 有这个 API)。
// > 一个「这段代码在所有环境都能跑」和一个「它依赖一个真浏览器才有的 API」,
// > **在一张真浏览器截的图上长得一模一样。**
//
// 而那本来就是绕远了:panel 的内容在三处用 `innerHTML` 重写,
// 把按钮放在**它们覆盖不到的那一层**就不用监听了 —— 少一个 API 依赖、少一条会漂的路径。

load();
</script>
