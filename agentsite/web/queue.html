<!--SHELL-->
<style>
/* ⚠️⚠️ 2026-10-14 改成**列表整宽 + 详情弹窗**(用户拍)。
   原来是 `1.15fr 1fr` 左右分栏 —— 右边那块**不管有没有选中行都占掉 46%**,
   于是左表只剩约 750px,而它有 8 列、工单号是 27 个字符的等宽字体(一列近 200px)。
   结果:「评价差评」「未研判」这种词**一个字一行竖着排**,行高撑成四倍,
   一屏只看得到 5~6 条 —— 而「已销账」那一档有 207 条。

   > 一个「详情面板留着位置等你点」和一个「表格被挤到没法读」,
   > **在那个 grid 定义上长得一模一样** —— 而只有打开页面才看得见是后者。

   ⚠️ 这件事**四道验证全都没看见**:js_check(语法)、js_smoke(填了 4228 字真实数据)、
   我自己那个脚本(收起 41 行 / 点开 207 行 / 三个数对得上)、门禁(queue.html 干净)——
   全绿。**数据层全对,而页面没法用。**
   > 一个「表格渲染正确」和一个「每个字单独占一行」,
   > **在「#rows 被填了真实数据」这件事上长得一模一样。** */
.split{display:block}
/* 弹窗:盖在页面上,点背景或 ESC 关掉 */
.mask{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;z-index:40}
.mask.on{display:block}
.split .panel{position:fixed;z-index:41;display:none;
  left:50%;top:50%;transform:translate(-50%,-50%);
  width:min(760px,calc(100vw - 32px));max-height:min(80vh,900px);
  overflow:auto;box-shadow:0 18px 48px rgba(0,0,0,.5)}
.split .panel.on{display:block}
.panel .hd{position:sticky;top:0;background:var(--paper);z-index:1}
/* 关闭按钮贴在标题右边 */
.关{display:none;position:fixed;z-index:42;font:inherit;font-size:13px;color:var(--ink);
  background:var(--paper);border:1px solid var(--line);border-radius:4px;
  cursor:pointer;padding:4px 10px;line-height:1.4}
.关.on{display:block}
.关:hover{border-color:var(--ink)}
@media(max-width:960px){.split .panel{width:calc(100vw - 20px);max-height:88vh}}
.bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:0 0 12px}
.bar .note{font-size:12.5px;color:var(--ink-3);margin-left:auto}
.seg{display:flex;border:1px solid var(--line);border-radius:4px;overflow:hidden}
.seg button{border:0;border-radius:0;padding:6px 13px;background:var(--paper);font-size:13px}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-pressed="true"]{background:var(--dye-soft);color:var(--dye);font-weight:600}
.panel{background:var(--paper);border:1px solid var(--line);border-radius:5px;position:sticky;top:66px}
.panel .hd{padding:14px 17px;border-bottom:1px solid var(--line);display:flex;gap:9px;align-items:center;flex-wrap:wrap}
.panel .hd .id{font-family:var(--mono);font-weight:600}
.panel .bd{padding:15px 17px;max-height:60vh;overflow-y:auto}
.panel .ft{padding:13px 17px;border-top:1px solid var(--line);display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.fld{margin-bottom:13px}
.fld .k{font-family:var(--mono);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);margin-bottom:3px}
.fld .v{font-size:13.8px;line-height:1.7;color:var(--ink);white-space:pre-wrap;word-break:break-word}
.fld .v.dim{color:var(--ink-3)}
.traj{font-family:var(--mono);font-size:11.5px;color:var(--ink-2);background:var(--paper-2);
 border:1px solid var(--line-2);border-radius:4px;padding:8px 11px;line-height:1.75}
textarea,input[type=text]{width:100%;font-family:var(--sans);font-size:13.5px;padding:7px 10px;
 border:1px solid var(--line);border-radius:4px;background:var(--paper-2);color:var(--ink);resize:vertical}
.edit{display:none;border-top:1px dashed var(--line);margin-top:12px;padding-top:12px}
.edit.on{display:block}
.edit label{display:block;font-family:var(--mono);font-size:10.5px;letter-spacing:.1em;
 text-transform:uppercase;color:var(--ink-3);margin:9px 0 3px}
.hint{font-size:12.3px;color:var(--ink-3);line-height:1.6;margin-top:9px}
.hint b{color:var(--warn)}
/* ⚠️ 提示原来只有 textContent、没有样式 —— 于是「成功」和「有失败」长得一模一样。
   现在成功/失败两种色,而且**有一条失败就不出成功样式**。 */
.bar .note.ok{color:var(--dye);font-weight:600}
.bar .note.bad{color:var(--warn);font-weight:600}
/* 「只是关单(没走过研判)」自己一个色 —— 它在已销账里占 151/161,
   而它可能是「有人直接关单了事」,是这一档里最该被看见的那一种 */
.tag.shut{background:var(--paper-2);color:var(--warn);border-color:var(--warn)}
.empty{padding:38px 20px;text-align:center;color:var(--ink-3);font-size:13.5px}
</style>
<div class="wrap">
<header class="top">
  <div class="eyebrow"><span class="dot"></span><span class="lab">值班主工作面</span></div>
  <h1>研判队列</h1>
  <p class="deck">智能体交草稿,<b>你签字</b>。采纳 = 认可;改判 = 它错了,你写对的
  —— <b>你写的那条会进评测集</b>,下次回归跑得到;升级 = 这条你也定不了,转给别人。</p>
  <!-- 这里只放 AI 能跑的(用户 10-15 拍)。不走 AI 的挪去了值班台 —— 这一句说清挪去哪、有几条,
       否则「差评不见了」和「差评被处理完了」在这一页上长得一模一样。 -->
  <p class="deck" id="挪走" style="font-size:13.5px" hidden></p>
</header>

<section>
  <div class="bar">
    <div class="seg" id="seg">
      <button data-s="待办" aria-pressed="true">待办</button>
      <button data-s="已超时">已超时</button>
      <button data-s="未研判">未研判</button>
      <button data-s="待复核">待复核</button>
      <button data-s="改判待审">改判待审</button>
      <button data-s="已销账">已销账</button>
      <button data-s="">全部</button>
    </div>
    <button class="pri" id="run">研判 <input id="n" type="number" value="3" min="1" max="10"
      style="width:44px;padding:2px 4px;font-family:var(--mono);border-radius:3px;border:1px solid rgba(255,255,255,.4);background:transparent;color:inherit"> 条</button>
    <span class="note" id="msg"></span>
    <span id="转人工们"></span>
  </div>
  <div class="mask" id="mask"></div>
  <div class="split" id="split">
    <div class="box scroll" style="padding:0">
      <table><thead><tr><th>工单</th><th>类型</th><th>等待</th><th>时效</th><th>状态</th><th>怎么销的</th><th>置信</th><th>成本</th></tr></thead>
      <tbody id="rows"><tr><td colspan="7" class="empty">加载中…</td></tr></tbody></table>
    </div>
    <button type="button" class="关" id="关钮">关闭 ✕</button>
    <div class="panel" id="panel">

    </div>

</section>

<footer>研判落库在 <code>triage</code> 表 · 改判先进候选、总部运营审核采用、换考卷时才写进 <code>truth</code>(标 <code>src=人工改判</code>)
—— 一个人的判断不直接变成标准答案</footer>
</div>
<script>
const $=s=>document.querySelector(s);
const esc=s=>(s??"").toString().replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
const LV={已超时:"over",临期:"near",正常:"ok",已销账:"dye"};
// ⚠️⚠️ **「已销账」原来把四件完全不同的事混成一个灰标签。** 实测库里:
//   工单已关闭、**从来没走过研判** 151 条 · 研判有结论 10 条(采纳 5 / 升级 5 / 改判 0)
// 而后端 `backend/ops.py` 的 `queue()` **早就把来源分开报了**
// (`凭什么销账` / `研判有结论` / `工单已关闭`,业务 2026-09-28 拍的),
// 它的注释写着:压平之后「研判过并采纳了」和「工单被关掉但一条研判都没走过」
// 长得一模一样,而后者**要人看一眼**。
// **而这一页之前那三个字段一个都没用**(grep 命中 0)——
// > 后端把话说清楚了,页面又把它压回去了。
// > 而这种情况比「后端没做」更难发现:两边分别看都是对的。
function 销账标(x){
  if(!x.done) return "—";
  if(x.研判有结论 && x.工单已关闭) return `<span class="tag dye">研判${esc(x.state).replace("已","")}·已关单</span>`;
  if(x.研判有结论) return `<span class="tag dye">研判${esc(x.state).replace("已","")}</span>`;
  // 这一种最该被看见:它没走过研判,可能是对的(有些事不需要研判),也可能是有人直接关单了事
  return `<span class="tag shut" title="${esc(x.凭什么销账||"")}">只是关单·没研判</span>`;
}
const CF={高:"ok",中:"near",低:"over"};
let state="待办", rows=[], sel=null;
// 「没走正门关的」那 166 条默认**收起**(用户 2026-10-14 拍)。
// ⚠️ 收起只影响**列表**,不影响计数 —— 「166 条被收起」和「166 条不见了」
// 在一个只显示 41 条的页面上长得一模一样,而后者会让人以为数据丢了。
// 所以标题上三个数同时摆:这一档总数 / 其中走过正门的 / 其中没走正门的。
let 展开没走正门=false;

// 弹窗开关。**只在这一处切**,不在 open_ / 切档 / 清空那三处各写一份 ——
// 三处写就会漂:哪天多一条路径忘了切,`sel` 和「弹窗开着没」就对不上,
// 而那时**两边分别看都正常**(sel 是对的、弹窗状态也是个合法状态)。
function 弹窗跟着选中走(){
  const p=$("#panel"), m=$("#mask");
  if(p) p.classList.toggle("on", !!sel);
  if(m) m.classList.toggle("on", !!sel);
  const k=$("#关钮"); if(k) k.classList.toggle("on", !!sel);
}
function 关弹窗(){ sel=null; render(); }
function render(){
  弹窗跟着选中走();
  // ⚠️⚠️ **收起用 `没走正门`,标签用 `研判有结论` —— 两个都要用,不能互相替代。**
  // 这一轮数据上它们恰好**完全互补**(166 / 41,没有交叉格),所以今天用哪个
  // 画出来一样。但它们问的是两件事:`研判有结论` 是「AI 出过结论吗」,
  // `没走正门` 是「关单时走没走审计」。
  // 等有人在页面上走完「AI 出结论 → 复核 → 走正门关单」,那条就是
  // **研判有结论且走了正门** —— 一个今天不存在的第四格。
  // > 一个「这两个字段说的是同一件事」和一个「它们现在恰好互补」,
  // > **在今天这张交叉表上长得一模一样。**
  // 图省事只用一个,等第四格出现时页面会把它归错,**而那时没有任何东西会报错**。
  const 显 = (state==="已销账" && !展开没走正门)
             ? rows.filter(x=>!x.没走正门) : rows;
  $("#rows").innerHTML = 显.length ? 显.map(x=>`
    <tr data-t="${esc(x.task_id)}" ${sel===x.task_id?'aria-selected="true"':""}>
      <td class="num">${esc(x.task_id)}</td><td>${esc(x.type)}</td>
      <td class="num">${x.waited_h}h</td>
      <td><span class="tag ${LV[x.level]}">${esc(x.level)}</span></td>
      <td>${esc(x.state)}</td>
      <td>${销账标(x)}</td>
      <td>${x.ai_confidence?`<span class="tag ${CF[x.ai_confidence]||""}">${x.ai_confidence}</span>`:"—"}</td>
      <td class="num">${x.cost!=null?"$"+(+x.cost).toFixed(4):"—"}</td></tr>`).join("")
    : `<tr><td colspan="8" class="empty">${
        (state==="已销账" && !展开没走正门 && rows.length)
          ? `这一档 ${rows.length} 条**全是「没走正门关的」**,已经收起 —— 点上面那个按钮看。`
          : "这一档是空的。"}</td></tr>`;
  $("#rows").querySelectorAll("tr[data-t]").forEach(tr=>tr.onclick=()=>open_(tr.dataset.t));
}
async function load(){
  const q=await fetch("/api/ops-queue"+(state?"?state="+encodeURIComponent(state):"")).then(r=>r.json());
  rows=q.rows; render();
  if(q.counts) 更新档位计数(q.counts);
  const 挪=q.挪到值班台;
  if(挪){
    $("#挪走").hidden=false;
    $("#挪走").innerHTML=`这里只放 AI 能跑的。<b>差评不走 AI</b>(由店长人工确认),挪到了 `
      +`<a href="/duty#差评">值班台 →</a>:还开着 <b>${+挪.开着}</b> 条`
      +(挪.已超时?`(其中 <b>${+挪.已超时}</b> 条已超时)`:"")
      +(挪.没走正门关的?` · 没走正门关的 ${+挪.没走正门关的} 条`:"");
  }
  // 「已销账」这一档顶上报分组计数 —— 一行行看才看出「大多数根本没走过研判」,
  // 等于没分开。这个数直接说出来。
  if(state==="已销账") 报销账计数();
  else if(state==="待办") 报待办计数(q.counts);
  else if(state==="已超时") 报超时计数();
}

// 档位按钮上直接写条数。**数字由后端一次算完给过来**(`counts`),
// 不在页面上数 —— 页面手上只有本档的行,数不出别档的,
// 而「按钮上写 14、点进去 11 条」这种漂,两边分别看都正常。
function 更新档位计数(c){
  const g=$("#seg"); if(!g) return;
  g.querySelectorAll("button").forEach(b=>{
    const k=b.dataset.s||"全部", n=c[k];
    if(n!==undefined) b.textContent=k+" "+n;
  });
}

// ⚠️ **「待办」这一档现在不含超时的了,所以必须当场说出超时有多少条。**
// 用户 2026-10-15 拍「所有超时的归到超时而不是待办」—— 分开之后待办只剩 2 条,
// 而一个只显示 2 条的页面上,「超时的挪到隔壁了」和「数据丢了」长得一模一样。
function 报待办计数(c){
  const 超=(c&&c["已超时"])||0;
  提示("这一档 "+rows.length+" 条 —— 只剩还来得及的。"
     + (超 ? "另有 "+超+" 条已超时,挪到「已超时」那一档了(点上面那个按钮)"
           : "超时的一条都没有"),
     超?"bad":"ok");
}

function 报超时计数(){
  const 久=rows.length?Math.max(...rows.map(x=>x.waited_h||0)):0;
  提示("这一档 "+rows.length+" 条全部已超时,等最久的 "+久.toFixed(1)+" 小时 —— "
     + "它们不在「待办」里,别靠那一档的数字判断还剩多少活", rows.length?"bad":"ok");
}

// ⚠️ 提示原来只有 textContent,**成功和「有失败」长得一模一样**。
// 现在分 ok / bad 两种样式,而且**有一条失败就不出成功样式**。
// 「已销账」这一档的三个数 + 展开按钮。**抽成函数是因为按钮要再调它一次** ——
// 第一版我在按钮里写了 `load_提示()`,**那个函数根本不存在**:
// 点一下就 ReferenceError,而 `js_check.py` 过了 —— 它只验语法,不验函数在不在。
// > 一个「这个函数名写对了」和一个「它压根不存在」,
// > **在语法检查通过这件事上长得一模一样。**
function 报销账计数(){
  const 研=rows.filter(x=>x.研判有结论).length;
  const 没门=rows.filter(x=>x.没走正门).length;
  // **三个数同时摆** —— 只摆剩下的那个,用户点开会发现和总数对不上。
  提示(`这一档 ${rows.length} 条:研判有结论 ${研} 条`
       + (没门?` · 没走正门关的 ${没门} 条(${展开没走正门?"已展开":"默认收起"})`:"")
       + (没门?` <button id="展" class="lnk">${展开没走正门?"收起":"点开看"}</button>`:"")
       + (没门?` —— 那批关单时没有审计记录,多半是正门做好之前直接写库的`
               + `(造数也走不到正门);这个数往上涨就是正门又被绕过了`:""),
       没门?"bad":"ok");
  const b=$("#展");
  if(b) b.onclick=()=>{ 展开没走正门=!展开没走正门; render(); 报销账计数(); };
}

// 后端那几句话是写给人读的 Markdown(带 `**强调**`),而页面用 textContent / esc ——
// 星号会**原样显示出来**。削掉记号,别削内容。
// (`ValueError:` 这类异常类名同理:对看的人没有意义,只会让它更像故障。)
function 软化(t){
  return String(t||"").replace(/^\w+(Error|Exception):\s*/, "").replace(/\*\*/g, "");
}

// ⚠️ 提示原来只写页面顶部的 #msg,而弹窗是 fixed + 遮罩 —— **顶部那行被挡住了**。
// 用户点完「只跑这一条」,反馈出现在他看不见的地方,于是「点了没反应」。
// 弹窗里有 #弹窗提示 时同时写一份,**只有一个函数**,不在两处各写一套。
function 提示(文, 级){
  const k=$("#弹窗提示");
  if(k){ k.textContent=文; k.className="note" + (级?" "+级:""); }
  const e=$("#msg"); e.textContent=文;
  e.className="note" + (级?" "+级:"");
}

// ⚠️⚠️ **「出哪句提示」抽成纯函数,不写在 onclick 里面。**
// 原来那一句是 `研判 ${跑了} 条,失败 ${failed.length} 条` —— 两件事写在同一句里,
// 读起来像「跑完了」,而其中几条根本没跑出来。
// > **一个「全跑成了」和一个「跑了一半」,在那一句话里长得一模一样。**
//
// 抽出来的第二个理由比第一个重要:**写在 onclick 里面的判定,判据调不到它**。
// 咬合当场证明过这一点:判据原来只查「文件里有没有『全部跑出来了』这几个字」,
// 于是把失败那一支改成 `else if(false)` —— 字符串还在,**判据照样绿**。
// > 一个「写了但永远到不了」的分支,和一个真的分支,
// > **在「字符串在不在文件里」上长得一模一样。**
// 现在 `agentsite/queue_view_check.py` 拿一个「有 2 条失败」的入参**真的调它**。
function 批量提示文(r, 跑了, state){
  if(r && r.error) return {文:"失败:"+r.error, 级:"bad"};
  const 挂 = (r && r.failed) || [];
  if(挂.length){
    // 点名是哪几条 —— 光说「失败 2 条」没法查
    const 号 = 挂.map(f=>(f&&(f.task_id||f.id))||f).filter(Boolean).slice(0,4).join("、");
    // ⚠️⚠️ 2026-10-14 用户撞到:点「研判」**看起来没反应**。
    // 队列「待办」档最前面全是评价差评,而**差评的 AI 研判按业务 2026-10-10 拍板
    // 是默认关的**(由店长人工确认)。后端把这句话原样返回了:
    //   「『评价差评』没有 AI 研判分支,**不是跑挂了**。差评的 AI 辅助默认关闭
    //     —— 差评由店长人工确认(业务 2026-10-10 拍)」
    // **而这里只取了 `task_id`、把 `error` 整个丢掉了**,于是显示成
    // 「有 1 条没跑出来 —— 失败那几条还在原来那一档里,没有被处理」。
    //
    // > 一个「这条跑挂了」和一个「这条按设计不该跑」,
    // > **在「有 1 条没跑出来」这句话上长得一模一样** ——
    // > 而后端恰恰把区别写清楚了,**就在它丢掉的那个字段里**。
    //
    // 后果比「少一句话」重:它把一个**设计**说成了**故障**,
    // 而照着它去查,会去查那条工单哪里坏了 —— 查一个没有坏的东西。
    // 所以**原因原样打出来**,不替后端改写、不替它分类。
    // `ValueError:` 这类 Python 异常类名对看的人没有意义,只会让它更像故障 —— 削掉。
    // ⚠️ 用 `软化()` —— 它同时削掉异常类名**和 Markdown 的 `**`**。
    // 原来这里只削了类名,于是后端那句「差评的 AI 辅助**默认关闭**」
    // 带着两对星号原样显示在页面上。
    const 因 = [...new Set(挂.map(f => 软化((f && f.error) || "")).filter(Boolean))];
    // ⚠️⚠️ **「按设计不跑」和「跑挂了」要在第一句话上就分开。**
    // 第一版我只是把原因拼在「有 N 条没跑出来…没有被处理」后面 —— 而后端那句话里
    // 明写着「**不是跑挂了**」,两句话当场互相矛盾,**而人读到的是前半句**。
    //
    // 判断依据**只能来自后端那句话本身**:`backend/ops.py` 两处都用同一个写法
    // (`…没有评价 —— 判不了,不是跑挂了` / `「X」没有 AI 研判分支,不是跑挂了`)。
    // **不在页面里重新分类** —— 那就又是一份会漂的口径:哪天后端多一种「不该跑」,
    // 页面这份名单不会跟着变,而它会把那一种显示成故障。
    const 都是按设计 = 挂.length > 0 && 挂.every(f => ((f && f.error) || "").includes("不是跑挂了"));
    if(都是按设计){
      // ⚠️ 这里原来写的是 `**按设计不走 AI 研判**` —— 而 `提示()` 用的是 textContent,
      // 于是那两对星号**原样显示在页面上**。加粗要靠样式,不能靠 Markdown 记号:
      // 写 md 写惯了手就会带上,而它在源码里看着像强调、在页面上是两个星号。
      return {文:`这 ${挂.length} 条按设计不走 AI 研判${号?"("+号+")":""} —— `
                + 因.slice(0,2).join(" / "),
              级:""};   // 不是 bad:它没出错
    }
    const 因文 = 因.length ? ` · ${因.slice(0,2).join(" / ")}` : "";
    return {文:`有 ${挂.length} 条没跑出来${号?"("+号+")":""};成功 ${跑了} 条,`
              + `$${((r&&r.cost)||0).toFixed(4)} —— 失败那几条还在原来那一档里,没有被处理`
              + 因文,
            级:"bad"};
  }
  // ⚠️ **跑了 0 条要单独说。** 原来这里不管跑没跑都说「研判 N 条全部跑出来了」,
  // N=0 时就成了「研判 0 条全部跑出来了」—— 听着像成功,其实什么都没发生。
  // 后端在这种情况下会把原因放进 `note`(比如「未研判的那些没有一条有 AI 研判分支」),
  // 而这个函数原来**根本没读 note**,那句话就被吞掉了。
  // > 一个「全跑成了」和一个「一条都没跑」,在「全部跑出来了」这句话上长得一模一样。
  if(!跑了) return {文:(r&&r.note) || "这次一条都没跑 —— 队列里没有可跑的工单", 级:""};
  return {文:`研判 ${跑了} 条全部跑出来了,$${((r&&r.cost)||0).toFixed(4)}`
            + (state==="待复核"?" —— 已跳到「待复核」,在这一档里签字":""),
          级:"ok"};
}
function fld(k,v,dim){return `<div class="fld"><div class="k">${k}</div>
  <div class="v${dim?" dim":""}">${v?esc(v):"—"}</div></div>`;}

      <div class="hint"><b>注意:</b>改判<b>不会直接进评测集</b>。它先记成候选,由总部运营审核(不能是你自己);

  </div>
  ${升着 ? `<div class="ft">

    <span class="note" id="rmsg" style="font-size:12.5px;color:var(--ink-3)"></span></div>`
  : done?"":`<div class="ft">
    <button class="pri" onclick="resolve(${d.id},'已采纳')">采纳草稿</button>
    <button onclick="toggleEdit()" id="btnEdit">改判…</button>
    ${d.升级去向 ? `<input id="升级原因" placeholder="升级原因(必填:卡在哪一步)" style="flex:1;min-width:140px">

/* ── 改判审核(用户 2026-10-19 拍:总部运营审,不能是改判人自己)────────────────────────
   改判不直接进评测集:候选 → 审核采用 / 驳回 → 换考卷时并入。谁能审由后端判,页面不猜角色 */
function 改判审核块(状态, d){
  const 头=`<div class="k">改判审核 · ${esc(状态)}</div>`;
  if(状态!=="待审核")
    return `<div class="fld">${头}<div>${状态==="已采用"?"已采用 —— 下次换考卷时并入评测集"
      :状态==="已并入"?"已并入评测集":"已驳回 —— 只作用在这张工单上,不进评测集"}${d.relabel_note?" · "+esc(d.relabel_note):""}</div></div>`;
  return `<div class="fld">${头}<div>智能体判的:${esc(d.ai_root_cause||"—")} → 改判成:<b>${esc(d.human_root_cause||"—")}</b>(${esc(d.handler||"")})</div>
    <div class="rf"><button class="pri" data-relabel="采用" data-tri="${d.id}">采用</button>
    <input id="驳回理由" placeholder="驳回的话写理由" style="flex:1;min-width:120px">
    <button data-relabel="驳回" data-tri="${d.id}">驳回</button></div>
    <div class="note" id="审提示" style="font-size:12.5px"></div></div>`;
}
$("#panel").addEventListener("click",async e=>{
  const b=e.target.closest("[data-relabel]"); if(!b) return;
  const 说=t=>{ const p=$("#审提示"); if(p) p.textContent=t; };
  const 动=b.dataset.relabel, 理由=(($("#驳回理由")||{}).value||"").trim();
  if(动==="驳回" && !理由){ 说("驳回要写理由 —— 改判的人要知道为什么不算数"); return; }
  b.disabled=true; 说("提交中…");
  const r=await fetch("/api/ops-relabel-review",{method:"POST",headers:{"content-type":"application/json"},
    body:JSON.stringify({triage_id:+b.dataset.tri, action:动, note:理由})}).then(r=>r.json()).catch(e=>({error:e+""}));
  b.disabled=false;
  if(r.error || r.ok===false){ 说("没成:"+(r.error||r.reason||"")); return; }   // 失败照实说
  await load(); await open_(sel); 提示(r.reason, "ok");
});
/* ── 售后 / 客户合并的办结(研判队列未做项第 7 项)───────────────────────────────
   后端早就认这两类的回执(维保单已完成 / 那一对已合并),页面原来只给退款接了办结 ——
   于是这两类复核完了就停在「已采纳」,办结永远进不去。认什么单、单号、够不够、谁办,
   全照 /api/ops-detail 带来的 `办结` 画(`ops.办结预检`),**页面不按类型猜**。
   回执不够时照实说差什么,不给按钮;能不能办(角色)仍由后端在点下去时判。 */
function 办结块(b, 研判号){
  let 内;
  if(b.已办结) 内=`已办结 · 回执 ${esc(b.回执||"")}`;
  else if(b.单号 && b.行不行)
    内=`<button class="pri" data-close="${esc(b.单号)}" data-tri="${研判号}">用${esc(b.回执类型||"")} ${esc(b.单号)} 当回执办结</button>`;
  else if(b.单号)
    内=`还办不了:${esc(b.为什么||"")}`;
  else if(b.回执类型)
    内=`${esc(b.回执类型)}单号 <input type="text" id="结号" style="width:150px">
      <button class="pri" data-close="" data-tri="${研判号}">办结</button>${b.为什么?`<div class="note">${esc(b.为什么)}</div>`:""}`;
  else 内=esc(b.为什么||"这一类还没有能证明办完的单据");
  return `<div class="fld"><div class="k">办结(${esc((b.谁办||[]).join(" / ")||"—")})</div>
    <div>${内}</div><div class="note" id="结提示" style="font-size:12.5px"></div></div>`;
}

/* ── 退款处理与办结(用户 2026-10-15 拍「登记退款结果」写口)─────────────────────
   闭环原来断在第五步:复核完了,「财务真的退成了」在系统里没地方写,办结的回执核验永远过不了。
   这一块只给**已有结论的财务人工任务**:看押金单现在什么状态和每一次尝试,按状态给能做的事。
   ⚠️ 「重新发起」要先勾「已向渠道核实:上次确实没退成」—— 渠道超时而钱已到账的,再发一次顾客就收两笔;
      那种情况走「登记已退」(怎么退的选「渠道核实其实已退」)。能不能做由后端判(只有财务),页面不猜角色。 */
async function 画退款(dep, 研判号, x){
  const s=await fetch("/api/refund-state?deposit="+encodeURIComponent(dep)).then(r=>r.json()).catch(e=>({error:e+""}));
  const el=$("#退款内"); if(!el) return;
  if(s.error){ el.textContent=s.error; return; }
  el.dataset.dep=dep; el.dataset.tri=研判号;
  const 轨=(s.轨迹||[]).map(t=>`第 ${t.attempt} 次 · ${t.ts} · ${t.channel} · ${t.resp_code}`
      +(t.refund_no?` · 流水 ${t.refund_no}`:"")).join("\n");
  let 做="";
  if((s.能做||[]).includes("重新发起"))
    做+=`<div class="rf"><label><input type="checkbox" id="rf核"> 已向渠道核实:上次<b>确实没退成</b></label>
      <button data-rf="重新发起">重新发起退款</button></div>`;
  if((s.能做||[]).includes("登记已退"))
    做+=`<div class="rf">渠道退款流水号 <input type="text" id="rf号" style="width:150px">
      怎么退的 <select id="rf式">${(s.方式们||[]).map(m=>`<option>${esc(m)}</option>`).join("")}</select>
      <input type="text" id="rf注" placeholder="备注(选「其他」必填)" style="width:150px">
      <button data-rf="登记已退">登记已退</button></div>`;
  if((s.能做||[]).includes("登记仍失败"))
    做+=`<div class="rf">渠道回来的原因 <input type="text" id="rf因" style="width:200px">
      <button data-rf="登记仍失败">登记仍失败</button></div>`;
  if(s.状态==="已退" && !x.已办结)
    做+=`<div class="rf"><button class="pri" data-rf="办结">用押金单 ${esc(dep)} 当回执办结</button></div>`;
  if(x.已办结) 做+=`<div class="rf">已办结 · 回执 ${esc(x.回执||"")}</div>`;
  el.innerHTML=`<div>押金单 <b>${esc(dep)}</b> · ¥${+s.金额||0} · 现在「<b>${esc(s.状态)}</b>」</div>
    <div class="traj">${esc(轨)||"(还没有退款尝试)"}</div>${做}
    <div class="note" id="rf提示" style="font-size:12.5px"></div>`;
}
$("#panel").addEventListener("click",async e=>{

  let url, body;
  if(动==="重新发起"){
    if(!$("#rf核").checked){ 说("先向渠道核实上次确实没退成,再重发 —— 渠道超时而钱已到账的别重发,直接「登记已退」"); return; }
    url="/api/refund-retry"; body={deposit:dep, 上次:"确实没退成"};
  } else if(动==="登记已退"){

  } else if(动==="登记仍失败"){

    url="/api/ops-close"; body={triage_id:+el.dataset.tri, receipt:dep};
  }
  b.disabled=true; 说("提交中…");
  const r=await fetch(url,{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify(body)})
    .then(r=>r.json()).catch(e=>({error:e+""}));
  b.disabled=false;
  // 失败照实说(后端那句话原样给),**不出成功样式** —— 跑挂了说成完成,这个页面栽过两次
  const 失败=!!(r.error || r.ok===false);
  if(失败){ 说("没成:"+(r.error||r.reason||"")); return; }
  await load(); await open_(sel);
  说(r.说明 || (动==="办结" ? "办结了 —— 回执核验通过" : "好了"));
});

/* 升级 = 一次正式转交(用户 2026-10-17 拍):要写原因;接收岗位 4 个工作小时内接单,超时自动退回原负责人。

/* ── 研判运行:提交即返回运行号,后台逐条跑,页面轮询(用户 2026-10-18 拍「自建运行记录」)──────────
   原来 /run-batch 在一个请求里同步跑完才回:N 条等几分钟、刷新就丢、两个窗口各点一次跑两遍。
   现在提交只登记;运行号存进 localStorage,刷新后接着轮询。进度文和收尾汇总都是**纯函数**,
   收尾汇总拼成原来 /run-batch 的形状({done, failed, cost}),交给 批量提示文() —— 不另写一套成功失败口径。 */
const 运行键="研判运行号";
function 运行进度文(runs, 线程在){
  const 跑=runs.filter(r=>["排队","取数","调模型","落库"].includes(r.status));
  const 完=runs.length-跑.length;
  const 当前=跑.find(r=>r.status!=="排队");
  const 前=Math.min(...跑.filter(r=>r.status==="排队").map(r=>r.前面还有几条??0), Infinity);
  let 文=`研判 ${runs.length} 条:已结束 ${完} 条`;
  if(当前) 文+=` · ${当前.task_id} 在${当前.status}`;
  if(!当前 && 跑.length && 前!==Infinity) 文+=` · 你前面还有 ${前} 条`;
  if(跑.length && 线程在===false) return {文:文+" —— 执行线程没在跑(智能运维平台可能没起),排队的等它起来接着跑", 级:"bad"};
  return {文, 级:""};
}
function 运行汇总(runs){
  const done=[], failed=[]; let cost=0;
  for(const r of runs){
    if(r.status==="完成"){ done.push({task_id:r.task_id, triage_id:r.triage_id}); cost+=+r.cost||0; }
    else if(["失败","超时","中断"].includes(r.status)) failed.push({task_id:r.task_id, error:`${r.status}:${r.error||""}`});
    else if(r.status==="转人工") failed.push({task_id:r.task_id, error:"已转人工 —— 不是跑挂了"});
  }
  return {ok:!failed.length, done, failed, cost};
}
function 存运行号(ids){ try{ ids&&ids.length ? localStorage.setItem(运行键, ids.join(",")) : localStorage.removeItem(运行键); }catch(e){} }
function 读运行号(){ try{ return (localStorage.getItem(运行键)||"").split(",").filter(Boolean); }catch(e){ return []; } }
async function 跟运行(ids, 打开哪条){
  存运行号(ids);
  const b=$("#run"); b.disabled=true;
  let runs=[], 在=null;
  for(;;){
    const d=await fetch("/api/triage-run?ids="+ids.join(",")).then(r=>r.json()).catch(e=>({error:e+""}));
    if(d.error){ 提示("查研判进度失败:"+d.error+" —— 刷新页面会接着查", "bad"); b.disabled=false; return; }
    runs=d.runs||[]; 在=d.执行线程在吗;
    if(runs.length && !runs.some(r=>["排队","取数","调模型","落库"].includes(r.status))) break;
    const t=运行进度文(runs, 在); 提示(t.文, t.级);
    await new Promise(r=>setTimeout(r, 2000));
  }
  存运行号([]); b.disabled=false;
  const r=运行汇总(runs), 跑了=r.done.length;
  if(跑了 && state==="未研判") 切档("待复核");
  await load();
  const t=批量提示文(r, 跑了, state); 提示(t.文, t.级);
  // 超时 / 失败 / 中断的给「转人工」—— 转了就不再被自动挑去跑(后端记谁转的)
  $("#转人工们").innerHTML=runs.filter(x=>["失败","超时","中断"].includes(x.status)).map(x=>
    `<button data-handoff="${x.id}" title="${esc(x.error||"")}">${esc(x.task_id)} 转人工</button>`).join(" ");
  const 头=打开哪条 || (r.done[0]||{}).task_id;
  if(头) await open_(头);
}
async function 提交研判(body){
  $("#转人工们").innerHTML="";
  const url=body.task_id?"/run-triage":"/run-batch";
  const r=await fetch(url,{method:"POST",headers:{"content-type":"application/json"},
    body:JSON.stringify(body)}).then(r=>r.json()).catch(e=>({error:e+""}));
  if(r.error || !r.runs || !r.runs.length){
    const t=批量提示文(r, 0, state); 提示(t.文, t.级); return;
  }
  const 复用=r.runs.filter(x=>x.复用).length;
  if(复用) 提示(`${复用} 条已经在跑了(别的窗口点过),没有再跑一遍,接着看它的进度`, "");
  await 跟运行(r.runs.map(x=>x.run_id).filter(Boolean), body.task_id);
}
document.addEventListener("click", async e=>{
  const b=e.target.closest("[data-handoff]"); if(!b) return;
  b.disabled=true;
  const r=await fetch("/api/triage-run-handoff",{method:"POST",headers:{"content-type":"application/json"},
    body:JSON.stringify({run_id:+b.dataset.handoff})}).then(r=>r.json()).catch(e=>({error:e+""}));
  if(r.error || r.ok===false){ b.disabled=false; 提示("没转成:"+(r.error||r.reason), "bad"); return; }
  b.remove(); 提示(r.reason, "ok");
});
window.runOne=async(tid)=>{

};

};
// 刷新 / 重开页面:上次没跟完的运行接着跟 —— 运行在后台照跑,页面只是重新接上
{ const 上次=读运行号(); if(上次.length) 跟运行(上次); }
$("#seg").querySelectorAll("button").forEach(b=>b.onclick=()=>{
  $("#seg").querySelectorAll("button").forEach(x=>x.setAttribute("aria-pressed","false"));
  切档(b.dataset.s); sel=null; load();

    <div class="bd"><div class="empty">左边点一行。</div></div>`;

// ── 弹窗的三条关闭路径,**一条都不能少** ──────────────────────────────
//
// ⚠️ 弹窗最常见的坏法不是打不开,是**关不掉** —— 而「关不掉」在截图上
// 和「正常打开着」长得一模一样:两张图都是弹窗盖在页面上。
// 所以三条路径都接上,并且都走同一个 `关弹窗()`(不在三处各写一份状态切换)。
//
// ⚠️ 关闭按钮用**事件委托**挂在 panel 上,不在那三处写内容的地方各加一个 ——
// 那三处会漂:哪天多一处写内容的地方忘了加按钮,那种情形下弹窗就只能靠 ESC 关,
// 而**那一处和别处在代码上长得一模一样**。
document.addEventListener("keydown", e => { if(e.key === "Escape" && sel) 关弹窗(); });
$("#mask").onclick = () => 关弹窗();
$("#关钮").onclick = () => 关弹窗();
// ⚠️ 关闭按钮**写在 HTML 骨架里**(`#panel` 外面那一层),不靠 JS 往里补。
//
// 第一版我用 `MutationObserver` 监听 panel 内容变化、自动补按钮 ——
// **冒烟当场红**:那个最小 DOM 桩里没有 `MutationObserver`,脚本同步执行就挂,
// 浏览器里的表现是「框架有、数据没有」。而**截图是绿的**(真 Chrome 有这个 API)。
// > 一个「这段代码在所有环境都能跑」和一个「它依赖一个真浏览器才有的 API」,
// > **在一张真浏览器截的图上长得一模一样。**
//
// 而那本来就是绕远了:panel 的内容在三处用 `innerHTML` 重写,
// 把按钮放在**它们覆盖不到的那一层**就不用监听了 —— 少一个 API 依赖、少一条会漂的路径。

load();
</script>
