<title>澜绣云裳 · 顾问学堂(demo)</title>
<style>
/* 框架照搬 ~/Desktop/易课考题宝/10-高保真原型.html 的**学习应用**那套:
   顶栏 + 模块卡(带掌握度)+ 左树右教学卡 + 翻卡速记 + 右侧智能体。
   只换主色:蓝 → 绛(#8C4356)。这是 demo,没接工作站,路由在 /demo。 */
:root{
  --bg:#F5F7FA; --surface:#FFFFFF; --surface2:#F0F3F8;
  --ink:#20242B; --muted:#5E6673; --faint:#8B93A1;
  --line:#E4E8EF; --line2:#CDD4DF;
  --accent:#8C4356; --accent-ink:#6E2F40; --accent-soft:#FBEEF1; --accent-line:#EBCBD4;
  --ok:#0E9384; --ok-soft:#E0F3F0;
  --warn:#D97A00; --warn-soft:#FFF1E0; --crit:#E5484D; --crit-soft:#FDEAEA;
  --info:#2F6FB5; --info-soft:#E8F0F9;
  --shadow:0 1px 2px rgba(31,41,55,.05),0 4px 16px rgba(31,41,55,.06); --r:10px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#11141A;--surface:#191E27;--surface2:#202734;--ink:#E6E9EF;--muted:#9AA4B2;--faint:#6E7787;
  --line:#272E3A;--line2:#343D4C;--accent:#C9788C;--accent-ink:#E2A6B6;--accent-soft:#2E1B22;
  --accent-line:#4A2C36;--ok:#4CC3B4;--ok-soft:#12332E;--warn:#F0A34E;--warn-soft:#33260F;
  --crit:#F4766C;--crit-soft:#3A1D1A;--info:#7FA8CC;--info-soft:#1C2A36;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 16px rgba(0,0,0,.25);}}
:root[data-theme="dark"]{--bg:#11141A;--surface:#191E27;--surface2:#202734;--ink:#E6E9EF;
  --muted:#9AA4B2;--faint:#6E7787;--line:#272E3A;--line2:#343D4C;--accent:#C9788C;
  --accent-ink:#E2A6B6;--accent-soft:#2E1B22;--accent-line:#4A2C36;--ok:#4CC3B4;--ok-soft:#12332E;
  --warn:#F0A34E;--warn-soft:#33260F;--crit:#F4766C;--crit-soft:#3A1D1A;--info:#7FA8CC;
  --info-soft:#1C2A36;--shadow:0 1px 2px rgba(0,0,0,.3),0 4px 16px rgba(0,0,0,.25);}
*{box-sizing:border-box} html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--ink);
 font:14px/1.65 -apple-system,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
 -webkit-font-smoothing:antialiased}
.serif{font-family:"Songti SC","STSong","Noto Serif CJK SC",serif}
.num{font-variant-numeric:tabular-nums} .mono{font:11.5px ui-monospace,Menlo,monospace}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer;padding:0}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
code{font:12px ui-monospace,Menlo,monospace;background:var(--surface2);padding:1px 5px;border-radius:4px}

.topbar{position:sticky;top:0;z-index:40;height:52px;display:flex;align-items:center;gap:16px;
 padding:0 20px;background:var(--surface);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px;flex:none}
.seal{width:30px;height:30px;border-radius:7px;background:var(--accent);color:#fff;display:grid;
 place-items:center;font-family:"Songti SC","STSong",serif;font-size:19px;font-weight:700;line-height:1}
.brand b{font-family:"Songti SC","STSong",serif;font-size:17px;letter-spacing:.5px}
.scopechip{display:flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;
 background:var(--accent-soft);color:var(--accent-ink);border:1px solid var(--accent-line);
 font-size:12px;font-weight:600;flex:none}
.scopechip small{font-weight:400;opacity:.75}
.nav{display:flex;gap:2px;margin:0 auto}
.nav button{padding:6px 16px;border-radius:8px;font-size:14px;color:var(--muted);font-weight:500}
.nav button:hover{background:var(--surface2);color:var(--ink)}
.nav button.on{background:var(--accent-soft);color:var(--accent-ink);font-weight:600}
.topbtns{display:flex;gap:8px;flex:none;align-items:center}
.ghostbtn{padding:5px 11px;border-radius:8px;border:1px solid var(--line2);font-size:13px;color:var(--muted)}
.ghostbtn:hover{background:var(--surface2);color:var(--ink)}

.shell{display:flex;min-height:calc(100vh - 52px)}
main{flex:1;min-width:0}
.wrap{max-width:1020px;margin:0 auto;padding:18px 22px 70px}
.screen{display:none}.screen.on{display:block}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.cardpad{padding:15px 17px}
.pill{display:inline-flex;align-items:center;gap:5px;padding:1px 9px;border-radius:999px;
 font-size:11.5px;font-weight:600;background:var(--surface2);color:var(--muted)}
.pill.acc{background:var(--accent-soft);color:var(--accent-ink)}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.crit{background:var(--crit-soft);color:var(--crit)}
.pill.info{background:var(--info-soft);color:var(--info)}
.btn{display:inline-flex;align-items:center;gap:7px;padding:8px 16px;border-radius:8px;
 font-size:13.5px;font-weight:600;border:1px solid transparent;transition:transform .15s}
.btn.pri{background:linear-gradient(180deg,var(--accent),var(--accent-ink));color:#fff}
.btn.pri:hover{transform:translateY(-1px)}
.btn.sec{border-color:var(--line2);background:var(--surface)}
.btn.sec:hover{border-color:var(--accent);color:var(--accent-ink)}

.subject{margin:22px 0 10px;display:flex;align-items:baseline;gap:10px}
.subject h2{font-family:"Songti SC","STSong",serif;font-size:17px;margin:0}
.subject small{color:var(--faint);font-size:12px}
.modgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(225px,1fr));gap:12px}
.modcard{display:flex;flex-direction:column;gap:8px;text-align:left;padding:15px;background:var(--surface);
 border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);transition:transform .15s,border-color .15s}
.modcard:hover{transform:translateY(-2px);border-color:var(--accent-line)}
.modcard .t{font-size:15px;font-weight:700;display:flex;align-items:center;gap:7px}
.modcard .d{font-size:12.4px;color:var(--muted);line-height:1.6}
.barrow{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--faint)}
.track{flex:1;height:8px;border-radius:4px;background:var(--surface2);overflow:hidden}
.fill{height:100%;border-radius:4px;background:var(--accent)}
.fill.w{background:var(--warn)} .fill.c{background:var(--crit)}

/* 左树 + 右教学卡 */
.learn{display:grid;grid-template-columns:230px minmax(0,1fr);gap:16px}
@media(max-width:900px){.learn{grid-template-columns:1fr}}
.tree{font-size:13.4px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);
 padding:8px;max-height:74vh;overflow-y:auto;box-shadow:var(--shadow)}
.tree .grp{padding:8px 10px 4px;color:var(--faint);font-size:10.5px;letter-spacing:.12em;font-weight:600}
.tree button{width:100%;display:flex;align-items:center;gap:8px;text-align:left;padding:6px 10px;
 border-radius:7px;color:var(--muted)}
.tree button:hover{background:var(--surface2);color:var(--ink)}
.tree button.on{background:var(--accent-soft);color:var(--accent-ink);font-weight:600}
.tree .sw{width:14px;height:14px;border-radius:4px;border:1px solid var(--line);flex:none}
.tree .lv{margin-left:auto;font-size:10px}

.teach{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.teachhead{display:flex;align-items:flex-start;gap:12px;padding:16px 20px;border-bottom:1px solid var(--line)}
.teachhead .kpid{font:11.5px ui-monospace,Menlo,monospace;color:var(--faint)}
.teachhead h2{margin:2px 0 0;font-size:19px;font-family:"Songti SC","STSong",serif}
.teachbody{padding:4px 20px 18px}
.sect{margin-top:16px}
.sect h3{font-size:12px;margin:0 0 6px;color:var(--accent-ink);letter-spacing:.06em;text-transform:uppercase}
.sect p{margin:6px 0;max-width:62ch;color:var(--muted);font-size:13.4px;line-height:1.75}
.sect b{color:var(--ink)}
.kv{display:grid;grid-template-columns:repeat(auto-fit,minmax(104px,1fr));gap:9px;margin-top:8px}
.kv div{background:var(--surface2);border-radius:8px;padding:9px 11px}
.kv .k{font-size:10.5px;letter-spacing:.08em;color:var(--faint);text-transform:uppercase}
.kv .v{font-size:16px;font-weight:700;font-variant-numeric:tabular-nums;margin-top:1px}
.steps{counter-reset:st;list-style:none;margin:8px 0 0;padding:0}
.steps li{counter-increment:st;position:relative;padding:9px 13px 9px 38px;margin-bottom:7px;
 background:var(--surface2);border-radius:8px;max-width:66ch;font-size:13.2px}
.steps li::before{content:counter(st);position:absolute;left:12px;top:9px;width:18px;height:18px;
 border-radius:50%;background:var(--accent);color:#fff;font-size:11px;font-weight:700;
 display:grid;place-items:center}
.pitfall{border-left:3px solid var(--crit);background:var(--crit-soft);border-radius:0 8px 8px 0;
 padding:10px 14px;max-width:66ch;font-size:13.2px;margin-top:8px}
.teachfoot{display:flex;flex-wrap:wrap;gap:10px;padding:13px 20px;border-top:1px solid var(--line);align-items:center}

/* 翻卡 */
.flipgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px}
.flip{perspective:800px;cursor:pointer}
.flipinner{position:relative;transition:transform .45s;transform-style:preserve-3d;min-height:118px}
.flip.f .flipinner{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;border-radius:var(--r);padding:13px 15px;
 display:flex;flex-direction:column;gap:6px;background:var(--surface);border:1px solid var(--line);
 box-shadow:var(--shadow)}
.face.b{transform:rotateY(180deg);background:var(--accent-soft);border-color:var(--accent-line)}
.face .nm{font-size:16px;font-weight:700;font-family:"Songti SC","STSong",serif}
.face .hint{font-size:11.5px;color:var(--faint);margin-top:auto}
.face .row{display:flex;justify-content:space-between;font-size:12.4px;color:var(--muted)}
.face .row b{color:var(--ink);font-variant-numeric:tabular-nums}

/* 练习 */
.stem{font-size:15px;line-height:1.75;margin:0 0 12px}
.opt{display:block;width:100%;text-align:left;padding:11px 14px;border:1px solid var(--line2);
 border-radius:9px;margin-bottom:8px;font-size:13.6px;transition:.14s}
.opt:hover{border-color:var(--accent);transform:translateX(2px)}
.opt.right{background:var(--ok-soft);border-color:var(--ok);color:var(--ok);font-weight:600}
.opt.wrong{background:var(--crit-soft);border-color:var(--crit);color:var(--crit)}
.expl{background:var(--surface2);border-radius:9px;padding:12px 15px;font-size:13.2px;
 line-height:1.75;color:var(--muted);margin-top:10px}
.expl b{color:var(--ink)}

/* 智能体侧栏 */
aside.agent{width:352px;flex:none;background:var(--surface);border-left:1px solid var(--line);
 display:flex;flex-direction:column;position:sticky;top:52px;height:calc(100vh - 52px)}
aside.agent.off{display:none}
.aghead{flex:none;display:flex;align-items:center;gap:9px;padding:11px 14px;border-bottom:1px solid var(--line)}
.aghead .t{font-weight:700;font-size:13.5px}
.aghead select{font:inherit;font-size:12.5px;padding:3px 8px;border:1px solid var(--line2);
 border-radius:7px;background:var(--surface2);color:inherit;margin-left:auto}
.agbody{flex:1;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:10px}
.msg{max-width:92%;padding:9px 12px;border-radius:12px;font-size:13px;line-height:1.62;white-space:pre-wrap}
.msg.ai{background:var(--surface2);border-bottom-left-radius:4px;align-self:flex-start}
.msg.me{background:var(--accent);color:#fff;border-bottom-right-radius:4px;align-self:flex-end}
.msg .ctx{display:block;font:10.5px ui-monospace,Menlo,monospace;color:var(--faint);margin-bottom:5px}
.agfoot{flex:none;border-top:1px solid var(--line);padding:9px 12px 12px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:9px}
.chips button{font-size:12px;padding:4px 10px;border-radius:999px;border:1px solid var(--line2);color:var(--muted)}
.chips button:hover{border-color:var(--accent-line);color:var(--accent-ink)}
.inputrow{display:flex;gap:7px}
.inputrow textarea{flex:1;font:inherit;font-size:13px;padding:8px 11px;border:1px solid var(--line2);
 border-radius:9px;background:var(--surface);color:inherit;resize:none;height:54px}
@media(max-width:1120px){aside.agent{display:none}}
</style>

<div class="topbar">
  <div class="brand"><span class="seal">澜</span><b>顾问学堂</b></div>
  <span class="scopechip">demo<small>· 未接入工作站</small></span>
  <nav class="nav" id="nav">
    <button data-s="home" class="on">总览</button>
    <button data-s="learn">面料学习</button>
    <button data-s="card">速记卡</button>
    <button data-s="quiz">现场练习</button>
  </nav>
  <div class="topbtns">
    <button class="ghostbtn" id="theme">主题</button>
    <button class="ghostbtn" id="agtoggle">智能体</button>
  </div>
</div>

<div class="shell">
<main><div class="wrap">

  <section class="screen on" data-s="home">
    <div class="subject"><h2>顾问要学的五块</h2><small>掌握度按「问过智能体多少次 / 答对多少」估</small></div>
    <div class="modgrid" id="mods"></div>
    <div class="subject"><h2>今天该补的</h2><small>掌握度最低的三种面料</small></div>
    <div class="modgrid" id="weak"></div>
  </section>

  <section class="screen" data-s="learn">
    <div class="learn">
      <div class="tree" id="tree"></div>
      <div id="teach"></div>
    </div>
  </section>

  <section class="screen" data-s="card">
    <div class="subject"><h2>速记卡</h2><small>点一下翻面 —— 正面记名字,背面记那三个数</small></div>
    <div class="flipgrid" id="flips"></div>
  </section>

  <section class="screen" data-s="quiz">
    <div class="subject"><h2>现场练习</h2><small>客户原话 → 你会怎么接</small></div>
    <div class="card cardpad" id="quiz"></div>
  </section>

</div></main>

<aside class="agent" id="agent">
  <div class="aghead">
    <span class="seal" style="width:24px;height:24px;font-size:13px;border-radius:6px">✦</span>
    <span class="t">智能体</span>
    <select id="agkind" aria-label="选择智能体">
      <option value="kb">工艺顾问</option>
      <option value="task">研判助手</option>
    </select>
  </div>
  <div class="agbody" id="agbody"></div>
  <div class="agfoot">
    <div class="chips" id="agchips"></div>
    <div class="inputrow">
      <textarea id="agq" placeholder="⌘/Ctrl+Enter 发送"></textarea>
      <button class="btn pri" id="agsend">问</button>
    </div>
  </div>
</aside>
</div>

<script>
const $=s=>document.querySelector(s), esc=s=>(s??"").toString().replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
const md=s=>esc(s).replace(/\*\*(.+?)\*\*/g,"<b>$1</b>").replace(/`(.+?)`/g,"<code>$1</code>").replace(/\n/g,"<br>");
let FAB=[], CUR=null;

const HUE={香云纱:"#4A3B2A",云锦:"#8C4356",素罗:"#E3EAE0",宋锦:"#2E4E7E",妆花:"#9D2933",缂丝:"#C9A227",
 棉麻:"#D8CFC0",绡:"#EDEAE3",纱:"#F0EDE6",织金:"#C9A227",绫:"#DCE3E8",缎:"#B3243B",绢:"#EFE9DC",
 麻:"#CFC7B0",绒:"#5E3A57",罗:"#E7EDE8"};
const sw=n=>HUE[Object.keys(HUE).find(k=>n.includes(k))]||"#C8BFB4";
/* 掌握度:demo 里按「来源等级 + 有没有现货」造一个稳定的数,真实版应来自问答记录 */
const lvl=f=>{const b={public:78,scale:56,demo:38}[f.src_type]??50;
  return Math.max(12,Math.min(96,b+((f.name.length*7+f.code.charCodeAt(3))%22)-10));};
const lvc=v=>v>=70?"":v>=45?"w":"c";

const MODS=[["面料","45 种材质的幅宽、单价、损耗、备料天,以及能做哪些工艺","learn"],
 ["工艺","45 种工艺的工日、并行上限、对面料的要求","learn"],
 ["形制","40 种形制的关键尺寸 —— 量错一个整件返工","learn"],
 ["工期","并行链路怎么排,哪些工序除不动","learn"],
 ["售后判责","7 行返修判定表,判错了要赔钱","quiz"]];

const QUIZ=[
 {q:"客户说「我要仙气飘飘的」,你第一步该做什么?",
  o:["直接推唐制齐胸襦裙 + 大袖衫 + 披帛","先问场合、室内室外、要不要能久走动","先报个价看她接不接受","让她自己在小程序上挑"],
  a:1, e:"知识库里「客户原话对照」这一行写得很清楚:**「仙气飘飘的」大概率想要唐制齐胸襦裙套装,但要追问场合、室内室外、要不要能走动久**。\n直接推款是把追问那一步省了 —— 而那一步决定了面料克重和裙长,后面返工全从这儿来。"},
 {q:"客户想在香云纱上做妆花,你怎么答?",
  o:["可以做,加钱就行","做不了,而且要把依据说出来","看师傅排期","先打样试试"],
  a:1, e:"相容矩阵判**不可**,依据是规则 R2:妆花的工序是**织造**、不成片,而香云纱是成品面料 —— 织造类工艺没法在成品布上做。\n**判「不可」时必须把依据一起说出来** —— 它挡的是客户的单子,说不出理由客户只会觉得你不想接。"},
 {q:"客户问「能不能快一点」,第一个该查什么?",
  o:["师傅排期,看能不能加人","面料备料天,看能不能换现货","跟客户说加急要加钱","先答应下来再说"],
  a:1, e:"**备料常常比缝制还长** —— 云锦 22 天、香云纱 12 天。换成有现货的面料能把这一段从二十几天压到 1–3 天,比加人有效得多。\n但**面料换了质感和售价都会变,必须让客户确认,不能替他决定**。\n另外缂丝、妆花这类一人一机的工艺,**排满了加钱也没用**。"},
 {q:"报价时用料怎么算?",
  o:["按净用量算,损耗算在利润里","按含损耗的用量算","按上一单的数照抄","先报低一点,后面再补"],
  a:1, e:"损耗率不是浪费,是**对花对格决定的** —— 马面裙尤其高。\n按净用量报价的单子最后都要补钱,而补钱这件事客户永远记得。"},
];

/* 屏切换 */
function show(s){
  document.querySelectorAll(".screen").forEach(x=>x.classList.toggle("on",x.dataset.s===s));
  document.querySelectorAll("#nav button").forEach(b=>b.classList.toggle("on",b.dataset.s===s));
  if(s==="card") flips(); if(s==="quiz") quiz(); if(s==="learn"&&!CUR&&FAB.length) pick(FAB[0].code);
}
$("#nav").addEventListener("click",e=>{const b=e.target.closest("button"); if(b) show(b.dataset.s);});
$("#theme").addEventListener("click",()=>{const r=document.documentElement;
  r.setAttribute("data-theme", r.getAttribute("data-theme")==="dark"?"light":"dark");});
$("#agtoggle").addEventListener("click",()=>$("#agent").classList.toggle("off"));

/* 总览 */
function home(){
  $("#mods").innerHTML=MODS.map(([t,d,go],i)=>{
    const v=[62,48,71,55,34][i];
    return `<button class="modcard" data-go="${go}"><div class="t">${esc(t)}</div>
      <div class="d">${esc(d)}</div>
      <div class="barrow">掌握度<div class="track"><div class="fill ${lvc(v)}" style="width:${v}%"></div></div><b class="num">${v}%</b></div></button>`;
  }).join("");
  const weak=[...FAB].sort((a,b)=>lvl(a)-lvl(b)).slice(0,3);
  $("#weak").innerHTML=weak.map(f=>{const v=lvl(f);
    return `<button class="modcard" data-fab="${esc(f.code)}">
      <div style="height:36px;border-radius:7px;border:1px solid var(--line);background:${sw(f.name)}"></div>
      <div class="t">${esc(f.name)}<span class="pill ${f.src_type==="public"?"ok":f.src_type==="demo"?"warn":"info"}">${esc(f.src_type)}</span></div>
      <div class="d">备料 ${f.规格?.备料天??"—"} 天 · ¥${f.规格?.单价??"—"}/${esc(f.规格?.单位||"米")} · 可做 ${f.工艺.可} 种工艺</div>
      <div class="barrow">掌握度<div class="track"><div class="fill ${lvc(v)}" style="width:${v}%"></div></div><b class="num">${v}%</b></div></button>`;
  }).join("");
}
$("#mods").addEventListener("click",e=>{const b=e.target.closest("[data-go]"); if(b) show(b.dataset.go);});
$("#weak").addEventListener("click",e=>{const b=e.target.closest("[data-fab]"); if(!b)return; show("learn"); pick(b.dataset.fab);});

/* 面料学习:左树 + 教学卡 */
function tree(){
  const grp={public:"可对客户说",scale:"行业参考",demo:"内部演示"};
  $("#tree").innerHTML=["public","scale","demo"].map(g=>{
    const rows=FAB.filter(f=>f.src_type===g); if(!rows.length) return "";
    return `<div class="grp">${grp[g]} · ${rows.length}</div>`+rows.map(f=>{const v=lvl(f);
      return `<button data-c="${esc(f.code)}" class="${CUR===f.code?"on":""}">
        <span class="sw" style="background:${sw(f.name)}"></span>${esc(f.name)}
        <span class="lv num" style="color:var(--${v>=70?"ok":v>=45?"warn":"crit"})">${v}%</span></button>`;
    }).join("");
  }).join("");
}
function pick(code){
  CUR=code; tree();
  const f=FAB.find(x=>x.code===code); if(!f) return;
  const s=f.规格||{}, v=lvl(f);
  const lv={public:"**可直接对客户说。**",scale:"要注明**「行业参考」**。",
    demo:"内部演示数据,**不可作为对客户的承诺**,须工艺负责人确认。"}[f.src_type]||"";
  $("#teach").innerHTML=`<article class="teach">
    <div class="teachhead">
      <div style="flex:1"><div class="kpid">${esc(f.code)} · 面料卡</div><h2>${esc(f.name)}</h2></div>
      <span class="pill ${v>=70?"ok":v>=45?"warn":"crit"}">掌握度 ${v}%</span>
      <span class="pill ${f.src_type==="public"?"ok":f.src_type==="demo"?"warn":"info"}">${esc(f.src_type)}</span>
    </div>
    <div class="teachbody">
      <div style="height:70px;border-radius:9px;border:1px solid var(--line);background:${sw(f.name)};margin-top:14px"></div>
      <div class="sect"><h3>是什么</h3><p>${md(f.brief||"—")}</p>
        ${f.alias?`<p class="mono">别名:${esc(f.alias)}</p>`:""}</div>
      <div class="sect"><h3>报价要用的三个数</h3>
        <div class="kv">
          <div><div class="k">幅宽</div><div class="v">${s.幅宽??"—"}<span style="font-size:11px"> cm</span></div></div>
          <div><div class="k">单价</div><div class="v">¥${s.单价??"—"}</div></div>
          <div><div class="k">损耗率</div><div class="v">${s.损耗!=null?(s.损耗*100).toFixed(0)+"%":"—"}</div></div>
          <div><div class="k">备料天</div><div class="v">${s.备料天??"—"}</div></div>
          <div><div class="k">库存</div><div class="v">${s.库存??"—"}</div></div>
        </div>
        <p><b>备料天是工期的第一段</b>,常常比缝制还长 —— 客户问「能不能快点」,第一个该查的是它。</p></div>
      ${f.细节.length?`<div class="sect"><h3>怎么用</h3><ol class="steps">${f.细节.map(x=>`<li>${esc(x)}</li>`).join("")}</ol></div>`:""}
      ${f.fit?`<div class="sect"><h3>适合什么形制</h3><p>${esc(f.fit)}</p></div>`:""}
      <div class="sect"><h3>能做哪些工艺</h3>
        <p>可 <b>${f.工艺.可}</b> 种 · 需评估 <b>${f.工艺.需评估}</b> 种 · 不可 <b>${f.工艺.不可}</b> 种</p>
        <div class="pitfall">判「不可」时<b>必须把依据一起说出来</b> —— 它挡的是客户的单子,说不出理由客户只会觉得你不想接。
          相容矩阵里标「未定义」的格子<b>不许推断</b>,转工艺负责人。</div></div>
      <div class="sect"><h3>这一档能不能对客户说</h3><p>${md(lv)}</p></div>
    </div>
    <div class="teachfoot">
      <button class="btn pri" data-ask="${esc(f.name)}能做哪些工艺?为什么有些不可?">问智能体</button>
      <button class="btn sec" data-ask="客户要${esc(f.name)}但嫌工期长,有什么办法?">压工期怎么办</button>
      <span class="mono" style="color:var(--faint);margin-left:auto">出处 knowledge/02-面料.md · 06-相容矩阵.md</span>
    </div></article>`;
}
$("#tree").addEventListener("click",e=>{const b=e.target.closest("button[data-c]"); if(b) pick(b.dataset.c);});
$("#teach").addEventListener("click",e=>{
  const b=e.target.closest("[data-ask]"); if(!b) return;
  $("#agq").value=b.dataset.ask; ask();
});

/* 速记卡 */

    return `<div class="flip" data-c="${esc(f.code)}"><div class="flipinner">
      <div class="face"><div class="nm">${esc(f.name)}</div>
        <div style="height:30px;border-radius:6px;border:1px solid var(--line);background:${sw(f.name)}"></div>
        <div class="hint">点一下看幅宽 / 单价 / 备料天</div></div>
      <div class="face b">
        <div class="row"><span>幅宽</span><b>${s.幅宽??"—"} cm</b></div>
        <div class="row"><span>单价</span><b>¥${s.单价??"—"}</b></div>

/* 练习 */
let QI=0;
function quiz(){
  const q=QUIZ[QI%QUIZ.length];
  $("#quiz").innerHTML=`<div class="mono" style="color:var(--faint)">第 ${QI%QUIZ.length+1} / ${QUIZ.length} 题</div>
    <p class="stem">${esc(q.q)}</p>
    ${q.o.map((o,i)=>`<button class="opt" data-i="${i}">${String.fromCharCode(65+i)}. ${esc(o)}</button>`).join("")}
    <div id="qexpl"></div>`;
}
$("#quiz").addEventListener("click",e=>{
  const b=e.target.closest(".opt");
  if(b){
    const q=QUIZ[QI%QUIZ.length], i=+b.dataset.i;
    document.querySelectorAll("#quiz .opt").forEach((x,j)=>{
      if(j===q.a) x.classList.add("right"); else if(j===i) x.classList.add("wrong");
    });
    $("#qexpl").innerHTML=`<div class="expl">${md(q.e)}</div>
      <button class="btn pri" data-next="1" style="margin-top:10px">下一题</button>`;
    return;
  }
  if(e.target.closest("[data-next]")){ QI++; quiz(); }
});

/* 智能体 */
const CHIPS={kb:["香云纱能做妆花吗","云锦备料要多久","客户说要仙气飘飘的,推什么"],
             task:["队列里最急的是哪条","MW73027 这个算谁的责任","C10010 的孩子还能按旧尺寸下单吗"]};
function say(cls,text,ctx){
  const d=document.createElement("div"); d.className="msg "+cls;
  d.innerHTML=(ctx?`<span class="ctx">${esc(ctx)}</span>`:"")+md(text);
  $("#agbody").appendChild(d); $("#agbody").scrollTop=1e9; return d;
}
const chips=()=>$("#agchips").innerHTML=CHIPS[$("#agkind").value]
  .map(c=>`<button data-q="${esc(c)}">${esc(c)}</button>`).join("");
$("#agchips").addEventListener("click",e=>{const b=e.target.closest("button[data-q]");
  if(b){$("#agq").value=b.dataset.q; ask();}});
$("#agkind").addEventListener("change",()=>{chips();
  say("ai",$("#agkind").value==="kb"?"切到**工艺顾问**。只说知识库里查到的。"
    :"切到**研判助手**。**结论都是草稿,要你签字。**");});
async function ask(){
  const q=($("#agq").value||"").trim(); if(!q) return;
  $("#agq").value=""; say("me",q);
  const wait=say("ai","查库中……"); $("#agsend").disabled=true;
  try{
    const r=await (await fetch("/run",{method:"POST",headers:{"content-type":"application/json"},
      body:JSON.stringify({kind:$("#agkind").value,prompt:q})})).json();
    wait.remove();
    if(r.error) say("ai","出错了:"+r.error);
    else{
      const t=(r.trajectory||[]).map(x=>x.tool.split("__").pop()).join(" · ")||"没调工具";
      say("ai",r.text||"(空)",`${t} · ${r.seconds}s · $${(r.cost_usd||0).toFixed(4)}`);
      (r.guard_violations||[]).forEach(v=>say("ai","**体检打回**:"+v.msg));
    }
  }catch(e){ wait.remove(); say("ai","请求失败:"+e); }
  $("#agsend").disabled=false;
}
$("#agsend").addEventListener("click",ask);
$("#agq").addEventListener("keydown",e=>{if(e.key==="Enter"&&(e.metaKey||e.ctrlKey))ask();});

chips();
say("ai","我是工艺顾问。**只说知识库里查到的**,查不到会直说。\n学习卡右下角有「问智能体」,点了会带着这块面料的问题过来。");
(async()=>{ FAB=(await (await fetch("/api/fabrics")).json()).rows; home(); tree(); })();
</script>
