<!doctype html><html lang="zh"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1"><title>澜绣云裳管理后台</title>
<style>
:root{
 --white:#FFFFFF; --canvas:#F0F0F1; --tile:#F7F8FB; --line:#E6E6E7; --line2:#EFEFF0;
 --blue:#3381FF; --navy:#385099; --navy-bg:#EDF0F8; --blue2:#5495FF; --blue3:#8AB6FF; --blue4:#B0CEFF; --blue-bg:#EAF1FF;
 --ink:#1D2129; --ink2:#4E5969; --ink3:#86909C; --ink4:#A9AFB8;
 --up:#F53F3F; --down:#3381FF; --warn:#FF7D00; --warn-bg:#FFF3E8; --ok:#00B42A; --ok-bg:#E8FFEA;
 --bad:#F53F3F; --bad-bg:#FFECE8;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--canvas);color:var(--ink);
 font:14px/1.55 "PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-variant-numeric:tabular-nums}
svg{display:block}

/* 顶栏 */
.top{height:78px;background:var(--white);display:flex;align-items:center;padding:0 26px;gap:12px;
 position:sticky;top:0;z-index:20;border-bottom:1px solid var(--line2)}
.logo{display:flex;align-items:center;gap:11px;font-size:19px;font-weight:600;letter-spacing:.01em}
.logo .mk{width:30px;height:30px;border-radius:5px;background:linear-gradient(160deg,#2B4D8C,#1D3karma);
 background:#2B4D8C;display:grid;place-items:center}
.top .sp{margin-left:auto;display:flex;align-items:center;gap:20px}
.ic{color:var(--ink2);cursor:pointer;position:relative}
.ic:hover{color:var(--blue)}
.ic.dis{color:var(--ink4);cursor:not-allowed}
.ic.dis:hover{color:var(--ink4)}
.dead{color:var(--ink4)!important;cursor:not-allowed!important;text-decoration:none!important}
.dead:hover{color:var(--ink4)!important;text-decoration:none!important}
.badge{position:absolute;top:-4px;right:-6px;background:var(--warn);color:#fff;font-size:10px;
 min-width:15px;height:15px;border-radius:99px;display:grid;place-items:center;padding:0 4px;font-weight:600}
.user{display:flex;align-items:center;gap:8px;cursor:pointer;font-size:13.5px}
.av{width:27px;height:27px;border-radius:99px;background:var(--blue);color:#fff;
 display:grid;place-items:center;font-size:12px;font-weight:600}

/* 布局 */
.wrap{display:grid;grid-template-columns:240px 1fr;min-height:calc(100vh - 78px)}
nav{background:var(--white);padding:14px 0 40px;border-right:1px solid var(--line2)}
nav .item{display:flex;align-items:center;gap:11px;padding:9px 22px;color:var(--ink);cursor:pointer;font-size:14px}
nav .item:hover{color:var(--blue)}
nav .item.on{color:var(--blue);font-weight:500}
nav .item.off{color:var(--ink4);cursor:not-allowed}
nav .item.off:hover{color:var(--ink4)}
nav .item .ch{margin-left:auto;color:var(--ink4);display:flex}
nav .item .ch svg{transition:transform .15s}
nav .item.open .ch svg{transform:rotate(90deg)}
nav .sub{padding:8px 22px 8px 55px;color:var(--ink2);cursor:pointer;font-size:13.5px;display:block;
 border-radius:0 6px 6px 0;margin-right:9px}
nav .sub:hover{color:var(--blue)}
nav .sub.on{background:var(--blue-bg);color:var(--blue);font-weight:500}
main{padding:16px 22px 60px;min-width:0}
.crumb{color:var(--ink3);font-size:13px;margin-bottom:11px}
.crumb b{color:var(--ink2);font-weight:400}
.tabbar{display:flex;align-items:center;gap:7px;margin-bottom:16px;flex-wrap:wrap}
.tab{background:var(--white);border:1px solid var(--line);border-radius:5px;
 padding:7px 11px;font-size:13px;color:var(--ink2);display:flex;align-items:center;gap:7px;
 cursor:pointer;max-width:190px}
.tab:hover{border-color:var(--blue);color:var(--blue)}
.tab.on{border-color:var(--blue);color:var(--blue);box-shadow:inset 0 -2px 0 var(--blue)}
.tab .lb{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tab .x{color:var(--ink4);cursor:pointer;font-size:12px;padding:0 1px;border-radius:3px;flex:none}
.tab .x:hover{background:var(--line);color:var(--ink)}
.tabbar .gridic{margin-left:auto;color:var(--ink2);cursor:pointer}
.crumb b{cursor:default}
.crumb a{color:var(--ink2);cursor:pointer;text-decoration:none}
.crumb a:hover{color:var(--blue);text-decoration:underline}

/* 卡片 */
.card{background:var(--white);border-radius:9px;margin-bottom:14px}
.card>.hd{padding:15px 20px 0;display:flex;align-items:baseline;gap:9px}
.card>.hd h3{margin:0;font-size:15.5px;font-weight:600}
.card>.hd .n{color:var(--ink3);font-size:12.5px}
.card>.hd .more{margin-left:auto;color:var(--blue);font-size:13px;cursor:pointer}
.card>.bd{padding:15px 20px 20px}
.row{display:grid;gap:14px;margin-bottom:14px}
.r-13{grid-template-columns:1fr 2.05fr}
.r-3{grid-template-columns:repeat(3,1fr)}
.r-4{grid-template-columns:repeat(4,1fr)}
@media(max-width:1120px){.r-13,.r-3,.r-4{grid-template-columns:1fr}}
.row>.card{margin:0}

/* 指标块 */
.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:11px}
@media(max-width:1120px){.tiles{grid-template-columns:repeat(2,1fr)}}
.tile{background:var(--tile);border-radius:7px;padding:13px 15px}
.tile .l{font-size:12.5px;color:var(--ink2)}
.tile .v{margin:5px 0 3px;font-size:23px;font-weight:600;color:var(--blue);letter-spacing:-.01em}
.tile .v small{font-size:12px;color:var(--ink2);font-weight:400;margin-left:3px}
.tile .s{font-size:11.5px;color:var(--ink3)}
.tile.plain .v{color:var(--ink)}

/* 基本信息 */
.who{display:flex;align-items:center;gap:13px;margin-bottom:15px}
.who .ph{width:54px;height:54px;border-radius:99px;background:var(--blue-bg);color:var(--blue);
 display:grid;place-items:center;font-size:18px;font-weight:600}
.who .nm{font-size:16px;font-weight:600}
.who .st{font-size:12.5px;color:var(--ink2);margin-top:2px}
.who .st b{color:var(--blue);font-weight:600}
.quick{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.q{background:var(--tile);border-radius:7px;padding:11px 13px;font-size:13px;cursor:pointer;
 display:flex;align-items:center;gap:8px}
.q:hover{background:var(--blue-bg);color:var(--blue)}
.q .d{width:7px;height:7px;border-radius:99px;background:var(--blue2)}

/* 快捷入口 */
.quick{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.q{border-radius:7px;padding:11px 12px;font-size:13.5px;cursor:pointer;display:flex;align-items:center;gap:9px}
.q .ci{width:22px;height:22px;border-radius:99px;display:grid;place-items:center;flex:none}
.q.c1{background:#FFF7E8} .q.c1 .ci{background:#FFB400}
.q.c2{background:#EAF1FF} .q.c2 .ci{background:#3381FF}
.q.c3{background:#FFEEF0} .q.c3 .ci{background:#F76D80}
.q.c4{background:#EAFBF0} .q.c4 .ci{background:#00B42A}
.q:hover{filter:brightness(.97)}
.q.dis{background:var(--tile);color:var(--ink4);cursor:not-allowed}
.q.dis .ci{background:var(--ink4)}
/* 分段器 */
.seg{margin-left:auto;background:var(--tile);border-radius:6px;padding:3px;display:flex;gap:2px}
.seg b{padding:4px 15px;border-radius:4px;font-size:12.5px;font-weight:400;color:var(--ink2);cursor:pointer}
.seg b.on{background:var(--white);color:var(--ink);font-weight:500;box-shadow:0 1px 2px rgba(0,0,0,.06)}
/* 趋势 */
.tr{font-size:11.5px;color:var(--ink3);display:flex;align-items:center;gap:3px}
.tr b{font-weight:600} .tr.up b{color:var(--up)} .tr.dn b{color:var(--down)}
/* 图例 */
.lg{display:flex;gap:14px;font-size:12px;color:var(--ink2);align-items:center}
.lg i{width:7px;height:7px;border-radius:99px;display:inline-block;margin-right:5px}
/* 横条 */
.hb{display:grid;grid-template-columns:148px 1fr 54px 40px;align-items:center;gap:11px;margin-bottom:13px;font-size:12.5px}
.hb .tk{height:7px;background:var(--tile);border-radius:99px;overflow:hidden}
.hb .tk i{display:block;height:100%;background:var(--blue2);border-radius:99px}
.hb .n{text-align:right;font-weight:600} .hb .p{text-align:right;color:var(--ink3)}
/* 门店 */
.thumb{width:56px;height:56px;border-radius:6px;display:grid;place-items:center;color:#fff;
 font-size:19px;font-weight:600;flex:none;letter-spacing:.04em}
.shops{display:grid;grid-template-columns:repeat(3,1fr);gap:0}
@media(max-width:1120px){.shops{grid-template-columns:1fr}}
.shop{padding:0 20px;border-right:1px solid var(--line2)}
.shop:last-child{border-right:0}
.shop .t{display:flex;align-items:center;gap:11px;margin-bottom:13px}
.shop .t .nm{font-size:14.5px;font-weight:600}
.shop .kv{display:grid;grid-template-columns:1fr 1fr;gap:9px 12px;margin-bottom:12px}
.shop .kv .l{font-size:12px;color:var(--ink3)}
.shop .kv .v{font-size:17px;font-weight:600;margin-top:1px}
.shop .kv .v small{font-size:11.5px;color:var(--ink3);font-weight:400;margin-left:2px}
.foot{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;padding-top:11px;border-top:1px solid var(--line2)}
.foot .l{font-size:11.5px;color:var(--ink3)} .foot .v{font-size:15px;font-weight:600}

/* 待处理 */
.pend .big{font-size:30px;font-weight:600;color:var(--blue);letter-spacing:-.02em}
.pend .big small{font-size:12px;color:var(--ink2);font-weight:400;margin-left:3px}
.pend .subs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:9px}
.pend .subs .l{font-size:11.5px;color:var(--ink3)}
.pend .subs .v{font-size:14.5px;font-weight:600}
.pend .subs .v.w{color:var(--warn)} .pend .subs .v.z{color:var(--ink4)}

/* 表格 */
table{width:100%;border-collapse:collapse;font-size:13.5px}
th{text-align:left;padding:11px 20px;color:var(--ink2);font-weight:500;font-size:12.5px;background:var(--tile)}
td{padding:12px 20px;border-bottom:1px solid var(--line2);color:var(--ink)}
tbody tr:last-child td{border-bottom:0}
tbody tr.clk{cursor:pointer} tbody tr.clk:hover td{background:var(--blue-bg)}
.pill{display:inline-block;padding:2px 9px;border-radius:4px;font-size:12px;font-weight:500;white-space:nowrap}
.p-bad{background:var(--bad-bg);color:var(--bad)} .p-warn{background:var(--warn-bg);color:var(--warn)}
.p-ok{background:var(--ok-bg);color:var(--ok)} .p-blue{background:var(--blue-bg);color:var(--blue)}
.p-mut{background:var(--tile);color:var(--ink3)}
.dot{width:6px;height:6px;border-radius:99px;display:inline-block;margin-right:5px;vertical-align:1px}

/* 明细 */
.kvl{display:grid;grid-template-columns:96px 1fr;gap:11px 14px;font-size:13.5px}
.kvl dt{color:var(--ink3)} .kvl dd{margin:0}
.diff td.d{background:var(--bad-bg)} .diff td.s{background:var(--ok-bg)}
.back{color:var(--blue);cursor:pointer;font-size:13px}
button{font:inherit;cursor:pointer;border:1px solid var(--line);background:var(--white);color:var(--ink2);
 padding:8px 17px;border-radius:5px}
button:hover{border-color:var(--blue);color:var(--blue)}
button.pri{background:var(--blue);border-color:var(--blue);color:#fff}
button.pri:hover{opacity:.9;color:#fff}
button:disabled{opacity:.5;cursor:not-allowed}
.err{background:var(--bad-bg);color:var(--bad);padding:12px 15px;border-radius:6px;
 font-size:12.5px;white-space:pre-wrap;word-break:break-all;margin-top:12px}
.ev{margin:6px 0 0;padding-left:17px} .ev li{margin:3px 0;color:var(--ink2);font-size:13px}
.note{font-size:12px;color:var(--ink3);margin-top:11px}
h1{font-size:18px;margin:0 0 3px;font-weight:600}
/* 表单区 */
.form{display:grid;grid-template-columns:repeat(3,1fr);gap:15px 26px;padding:22px 24px 0}
.fi{display:flex;align-items:center;gap:11px}
.fi label{width:66px;text-align:right;color:var(--ink2);font-size:13.5px;flex:none}
.fi .ctl{flex:1;height:34px;border:1px solid #D9DCE1;border-radius:3px;background:#fff;
 display:flex;align-items:center;padding:0 11px;color:var(--ink4);font-size:13.5px;gap:6px}
.fi .ctl .r{margin-left:auto;color:var(--ink4);font-size:12px}
.facts{display:flex;justify-content:flex-end;gap:11px;padding:16px 24px 0}
.form .facts{padding:0;grid-column:-2/-1;justify-content:flex-start}
.btn{height:34px;padding:0 22px;border-radius:3px;border:1px solid var(--navy);background:#fff;
 color:var(--navy);font-size:13.5px;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.btn.sol{background:var(--navy);color:#fff}
.btn.gray{border-color:#D9DCE1;color:var(--ink)}
.btn:hover{opacity:.88}
.btn:disabled{opacity:.45;cursor:not-allowed}
.ops{display:flex;gap:11px;padding:18px 24px 4px}
/* 表格增强 */
.tb th{background:var(--canvas);color:var(--ink);font-weight:500;font-size:13px}
.tb td,.tb th{padding:13px 16px}
.tb .lk{color:var(--navy);cursor:pointer;margin-right:14px;font-size:13px}
.tb .lk:hover{text-decoration:underline}
.cb{width:14px;height:14px;border:1px solid #C9CDD4;border-radius:2px;display:inline-block;
 vertical-align:-2px;cursor:pointer;position:relative}
.cb:hover{border-color:var(--navy)}
.cb.ck{background:var(--navy);border-color:var(--navy)}
.cb.ck::after{content:"";position:absolute;left:4px;top:1px;width:4px;height:8px;
 border:solid #fff;border-width:0 1.6px 1.6px 0;transform:rotate(42deg)}
/* 分页 */
.pg{display:flex;align-items:center;justify-content:flex-end;gap:7px;padding:16px 24px;font-size:13px;color:var(--ink2)}
.pg b{min-width:28px;height:28px;border:1px solid #D9DCE1;border-radius:3px;display:grid;place-items:center;
 font-weight:400;cursor:pointer;background:#fff}
.pg b.on{border-color:var(--navy);color:var(--navy)}
.pg .sel{height:28px;border:1px solid #D9DCE1;border-radius:3px;padding:0 9px;display:flex;align-items:center;gap:14px}
.pg input{width:46px;height:28px;border:1px solid #D9DCE1;border-radius:3px;text-align:center;font:inherit}
/* 详情页头 */
.dh{display:flex;align-items:center;gap:11px;margin-bottom:14px}
.dh .no{font-size:17px;font-weight:600}
/* 步骤条 */
.steps{display:flex;align-items:flex-start;padding:26px 40px 22px}
.step{flex:1;display:flex;flex-direction:column;align-items:center;position:relative}
.step .c{width:26px;height:26px;border-radius:99px;display:grid;place-items:center;font-size:12.5px;
 background:#C3C3C3;color:#fff;z-index:1}
.step.done .c{background:var(--navy)} .step.cur .c{background:var(--navy)}
.step .t{font-size:14px;margin-top:9px;color:var(--ink)}
.step .d{font-size:11.5px;color:var(--ink3);margin-top:3px}
.step::before{content:"";position:absolute;top:13px;left:-50%;width:100%;height:2px;background:#DCDCDC}
.step:first-child::before{display:none}
.step.done::before,.step.cur::before{background:var(--navy)}
/* 时间轴 */
.tl{padding:4px 24px 8px}
.tl .it{display:flex;gap:13px;padding-bottom:22px;position:relative}
.tl .it:last-child{padding-bottom:4px}
.tl .it::before{content:"";position:absolute;left:8px;top:20px;bottom:0;width:1px;background:var(--line)}
.tl .it:last-child::before{display:none}
.tl .ic{width:17px;height:17px;border-radius:99px;border:1.5px solid var(--ink4);flex:none;
 display:grid;place-items:center;background:#fff;z-index:1}
.tl .it.bad .ic{border-color:var(--bad)}
.tl .tt{font-size:13.5px} .tl .dd{font-size:12px;color:var(--ink3);margin-top:3px}
/* 底部操作栏 */
.fbar{background:var(--white);border-radius:9px;padding:15px;display:flex;justify-content:center;gap:13px}
/* 客户详情 */
.cd{display:grid;grid-template-columns:1fr 322px;gap:14px;align-items:start}
@media(max-width:1180px){.cd{grid-template-columns:1fr}}
.cd-h{display:flex;align-items:center;gap:10px;margin-bottom:11px}
.cd-h .nm{font-size:19px;font-weight:600}
.cd-h .ed{color:var(--navy);font-size:13px;cursor:pointer;display:flex;align-items:center;gap:4px}
.cd-h .rt{margin-left:auto;color:var(--navy);font-size:13px;cursor:pointer}
.tags{display:flex;gap:9px;align-items:center;margin-bottom:13px;flex-wrap:wrap}
.tags .tg{border:1px solid #D9DCE1;border-radius:4px;padding:4px 16px;font-size:13px;background:#fff}
.tags a{color:var(--navy);font-size:13px;cursor:pointer}
.pf{display:flex;gap:20px;padding:20px 22px}
.pf .ph2{width:112px;height:132px;border-radius:6px;display:grid;place-items:center;
 background:linear-gradient(160deg,#2B4D8C,#4C6FB5);color:#fff;font-size:30px;font-weight:600;flex:none}
.pf .cts{flex:1;display:grid;gap:13px;align-content:start;font-size:13.5px}
.pf .ct{display:flex;gap:9px;align-items:flex-start;color:var(--ink)}
.pf .ct svg{flex:none;margin-top:2px;color:var(--ink3)}
.sec{padding:0 22px 4px}
.sec h5{margin:0 0 12px;font-size:14px;font-weight:600}
.dgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:15px 20px;font-size:13.5px}
@media(max-width:1180px){.dgrid{grid-template-columns:repeat(2,1fr)}}
.dgrid .l{color:var(--ink3);font-size:12.5px} .dgrid .v{margin-top:4px}
.note2{background:var(--tile);border-radius:6px;padding:12px 14px;font-size:13px;color:var(--ink2);margin-top:14px}
.stiles{display:grid;grid-template-columns:repeat(4,1fr);gap:13px;padding:18px 22px 22px}
@media(max-width:1180px){.stiles{grid-template-columns:repeat(2,1fr)}}
.st4{border-radius:7px;padding:14px 16px;min-height:88px}
.st4 .l{font-size:12.5px;color:var(--ink2);display:flex;align-items:center}
.st4 .l span{margin-left:auto;color:var(--ink4);font-size:11px}
.st4 .v{font-size:20px;font-weight:600;margin-top:7px}
.st4 .s{font-size:11.5px;color:var(--ink3);margin-top:5px}
.st4.a{background:#FDF8EC} .st4.b{background:#FDF0F5} .st4.c{background:#EDF4FE} .st4.d{background:#F3F4F6}
/* 日历 */
.cal{padding:14px 16px}
.cal .hd2{display:flex;align-items:center;gap:9px;font-size:13.5px;margin-bottom:12px}
.cal .hd2 .nav{cursor:pointer;color:var(--ink3);padding:0 4px}
.cal .hd2 .today{margin-left:auto;color:var(--navy);cursor:pointer;font-size:12.5px}
.cal table{width:100%;table-layout:fixed}
.cal th{background:none;padding:6px 0;text-align:center;color:var(--ink3);font-size:12px;font-weight:400}
.cal td{border:0;padding:7px 0;text-align:center;font-size:13px;position:relative;height:44px;vertical-align:top}
.cal .dnum{display:inline-grid;place-items:center;width:26px;height:26px;border-radius:99px}
.cal .out .dnum{color:var(--ink4)}
.cal .today2 .dnum{background:var(--navy);color:#fff}
.cal .hd2 .nav:hover,.cal .hd2 .today:hover{color:var(--blue)}
.cal .mk{position:absolute;left:50%;transform:translateX(-50%);bottom:6px;width:14px;height:2px;border-radius:2px}
/* tab 条 */
.tabs2{display:flex;gap:26px;padding:15px 22px 0;border-bottom:1px solid var(--line2);align-items:center}
.tabs2 b{font-size:14px;font-weight:400;color:var(--ink2);padding-bottom:11px;cursor:pointer;border-bottom:2px solid transparent}
.tabs2 b.on{color:var(--navy);font-weight:600;border-bottom-color:var(--navy)}
.tabs2 .add2{margin-left:auto;color:var(--navy);font-size:13px;cursor:pointer;padding-bottom:11px}
.empty{text-align:center;color:var(--ink4);padding:38px;font-size:13px}
/* 开关(量体模版状态列)*/
.tg{width:40px;height:21px;border-radius:99px;background:#C9CDD4;position:relative;
 display:inline-block;cursor:pointer;transition:.15s;vertical-align:-5px}
.tg.on{background:var(--navy)}
.tg::after{content:"";position:absolute;left:2px;top:2px;width:17px;height:17px;border-radius:99px;
 background:#fff;transition:.15s}
.tg.on::after{left:21px}
.tg i{position:absolute;font-style:normal;font-size:10.5px;color:#fff;line-height:21px}
.tg.on i{left:7px} .tg:not(.on) i{right:6px;color:#fff}
/* 订单卡片式表格 */

/* ── 图表:全部内联 SVG,不引外部库 ── */
function trendChart(t){
  const W_=330,H_=170,PL=34,PR=40,PT=12,PB=26, iw=W_-PL-PR, ih=H_-PT-PB;
  const maxN=Math.max(...t.map(d=>d.n))*1.25, maxA=Math.max(...t.map(d=>d.amt))*1.25;
  const bw=iw/t.length*0.42;
  const cx=i=>PL+iw/t.length*(i+0.5);
  const yN=v=>PT+ih-(v/maxN)*ih, yA=v=>PT+ih-(v/maxA)*ih;
  const pts=t.map((d,i)=>[cx(i),yA(d.amt)]);
  // 平滑曲线
  let path=`M${pts[0][0]},${pts[0][1]}`;
  for(let i=0;i<pts.length-1;i++){const[x1,y1]=pts[i],[x2,y2]=pts[i+1];const mx=(x1+x2)/2;
    path+=` C${mx},${y1} ${mx},${y2} ${x2},${y2}`}
  const area=path+` L${pts[pts.length-1][0]},${PT+ih} L${pts[0][0]},${PT+ih} Z`;
  const grid=[0,.25,.5,.75,1].map(f=>`<line x1="${PL}" y1="${PT+ih*f}" x2="${PL+iw}" y2="${PT+ih*f}"
    stroke="var(--line2)" stroke-width="1"/>`).join("");
  return `<svg viewBox="0 0 ${W_} ${H_}" width="100%" style="overflow:visible">
   <defs><linearGradient id="ga" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#3381FF" stop-opacity=".22"/><stop offset="1" stop-color="#3381FF" stop-opacity="0"/>
   </linearGradient></defs>${grid}
   ${t.map((d,i)=>`<rect x="${cx(i)-bw/2}" y="${yN(d.n)}" width="${bw}" height="${PT+ih-yN(d.n)}"
     rx="2" fill="var(--blue4)"/>`).join("")}
   <path d="${area}" fill="url(#ga)"/><path d="${path}" fill="none" stroke="var(--blue)" stroke-width="1.8"/>
   ${pts.map(([x,y])=>`<circle cx="${x}" cy="${y}" r="2.6" fill="#fff" stroke="var(--blue)" stroke-width="1.6"/>`).join("")}
   ${[0,.5,1].map(f=>`<text x="${PL-6}" y="${PT+ih*(1-f)+4}" text-anchor="end" font-size="9.5"
     fill="var(--ink4)">${Math.round(maxN*f)}</text>`).join("")}
   ${[0,.5,1].map(f=>`<text x="${PL+iw+6}" y="${PT+ih*(1-f)+4}" font-size="9.5"
     fill="var(--ink4)">${Math.round(maxA*f/1000)}k</text>`).join("")}
   ${t.map((d,i)=>`<text x="${cx(i)}" y="${H_-8}" text-anchor="middle" font-size="9.5"
     fill="var(--ink4)">${d.d.slice(5)}</text>`).join("")}</svg>`;
}
/* 要挽回的那几类(潜在流失 / 休眠 / 流失)永远单独成一块,不按人数合进「其他」(业务 2026-09-22 确认,附录 A-181)——
   它们人少,按人数取前几名正好被合掉,而那是店长首页最该看到的人。其余按人数取前 3,剩下合成「其他」,最多 5 块 */
const RISK=["潜在流失","休眠","流失"];
/* 活动费用:花到 80% 标黄(快超了,控量)、超过 100% 标红(已超支,要追责补预算);
   预算填 0 却已经在花钱的直接红(业务 2026-09-22 确认,附录 A-182)。原来一条 90% 分不出这两件事 */
function costTone(budget,cost,rate){
  if(!budget) return cost>0?"color:var(--bad);font-weight:600":"";
  return rate>100?"color:var(--bad);font-weight:600":rate>=80?"color:var(--warn)":"";
}
function donut(rows0){
  const tot0=rows0.reduce((a,b)=>a+b.n,0);
  const risk=rows0.filter(d=>RISK.includes(d.l)), norm=rows0.filter(d=>!RISK.includes(d.l));
  const top=norm.slice(0,3), rest=norm.slice(3);
  let rows=rest.length? top.concat([{l:"其他 "+rest.length+" 类",n:rest.reduce((a,b)=>a+b.n,0)}]) : top;
  if(risk.length) rows=rows.concat([{l:"需挽回("+risk.map(d=>d.l+" "+d.n).join(" / ")+")",n:risk.reduce((a,b)=>a+b.n,0)}]);
  const tot=tot0, C=["#3381FF","#5495FF","#8AB6FF","#B0CEFF","#DDE7F7"];
  const R=54,r=34,cx=68,cy=76; let ang=-Math.PI/2, seg="";
  rows.forEach((d,i)=>{const a=d.n/tot*Math.PI*2, e=ang+a, big=a>Math.PI?1:0;
    const p=(rad,ra)=>[cx+ra*Math.cos(rad),cy+ra*Math.sin(rad)];
    const[x1,y1]=p(ang,R),[x2,y2]=p(e,R),[x3,y3]=p(e,r),[x4,y4]=p(ang,r);
    seg+=`<path d="M${x1},${y1} A${R},${R} 0 ${big},1 ${x2},${y2} L${x3},${y3} A${r},${r} 0 ${big},0 ${x4},${y4} Z"
      fill="${C[i%6]}"/>`; ang=e});
  return `<div style="display:flex;align-items:center;gap:14px">
   <svg viewBox="0 0 136 152" width="136" style="flex:none">${seg}
    <text x="68" y="72" text-anchor="middle" font-size="20" font-weight="600" fill="var(--ink)">${tot}</text>
    <text x="68" y="88" text-anchor="middle" font-size="10" fill="var(--ink3)">客户总数</text></svg>
   <div style="flex:1;font-size:12.5px">${rows.map((d,i)=>`
    <div style="display:flex;align-items:center;gap:7px;margin-bottom:7px">
      <i style="width:7px;height:7px;border-radius:99px;background:${C[i%6]};flex:none"></i>
      <span style="color:var(--ink2)">${esc(d.l)}</span>
      <span class="mono" style="margin-left:auto;color:var(--ink3)">${Math.round(d.n/tot*100)}%</span></div>`).join("")}
   </div></div>`;
}
function hbars(rows){
  const max=Math.max(...rows.map(d=>d.amt)), tot=rows.reduce((a,b)=>a+b.amt,0);
  return rows.map(d=>`<div class="hb"><span class="mono" style="color:var(--ink2);font-size:11px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap" title="${esc(d.c)}">${esc(d.c)}</span>
    <span class="tk"><i style="width:${(d.amt/max*100).toFixed(1)}%"></i></span>
    <span class="n mono">${Math.round(d.amt/1000)}k</span>
    <span class="p mono">${Math.round(d.amt/tot*100)}%</span></div>`).join("");
}

function bindCb(){
  const all=M.querySelector("[data-cball]");

function res(ok,code,msg){
  document.querySelectorAll(".res").forEach(e=>e.remove());
  const el=document.createElement("div"); el.className="res "+(ok?"ok":"no");
  el.innerHTML=`<span>${ok?"✓":"✕"}</span><div><b>${esc(code||"")}</b> ${esc(msg||"")}</div>`;
  document.body.appendChild(el); setTimeout(()=>el.remove(), ok?3200:6500);
}
function modal(title,fields,onOk,wide){
  const m=document.createElement("div"); m.className="mask";
  m.innerHTML=`<div class="modal" ${wide?'style="width:560px"':""}><h4>${esc(title)}</h4>
   <div class="bd2" ${wide?'style="display:grid;grid-template-columns:1fr 1fr;gap:0 18px"':""}>
    ${fields.map(f=>f.type==="text"
      ? `<div style="grid-column:1/-1"><label>${esc(f.label)}${f.req?' <span style="color:var(--bad)">*</span>':""}</label>
          <textarea data-k="${f.k}" placeholder="${esc(f.ph||"")}"></textarea></div>`
      : f.type==="select"
      ? `<div><label>${esc(f.label)}${f.req?' <span style="color:var(--bad)">*</span>':""}</label>
          <select data-k="${f.k}">${f.opts.map(o=>`<option ${f.val===o?"selected":""}>${esc(o)}</option>`).join("")}</select></div>`
      : `<div><label>${esc(f.label)}${f.req?' <span style="color:var(--bad)">*</span>':""}</label>
          <input data-k="${f.k}" type="${f.it||"text"}" value="${esc(f.val||"")}" placeholder="${esc(f.ph||"")}"></div>`).join("")}
    </div><div class="ft"><button class="btn gray" data-x>取消</button>
    <button class="btn sol" data-y>确定</button></div></div>`;
  document.body.appendChild(m);
  m.querySelector("[data-x]").onclick=()=>m.remove();
  m.querySelector("[data-y]").onclick=()=>{
    const v={}; m.querySelectorAll("[data-k]").forEach(e=>v[e.dataset.k]=e.value);
    m.remove(); onOk(v)};
  m.onclick=e=>{if(e.target===m)m.remove()};
}
async function doTransit(machine,target,to,ctx,after){
  const r=await post("/api/transit",{machine,target,to,ctx:ctx||{}});
  if(r.error){res(false,"ERR",r.error);return}
  res(r.ok,r.code,r.reason);
  if(r.ok&&after)after();
}
async function doOp(url,body,after){
  const r=await post(url,body);
  if(r.error){res(false,"ERR",r.error);return r}
  const extra=(r.suspects&&r.suspects.length)
    ? " 疑似档案:"+r.suspects.map(s=>`${s.id} ${s.name}`).join("、") : "";
  res(r.ok,r.code||"OK",(r.reason||"")+extra);
  if(r.ok&&after)after();
  return r;
}

let TABS=[{k:"workbench",t:"工作台",v:"workbench",a:null,fixed:1}];
let ACTIVE="workbench";
function tabKey(v,a){return a?v+"/"+a:v}
/* 上限 9 个,保留工作台;超了关**最久没看的**那个,不是最早打开的(业务 2026-09-22 确认,附录 A-189)——
   来回对照的两个客户详情常常正是最早开的,按打开顺序关会先关掉正在用的 */
let SEEN=0;
function openTab(v,a,title){
  const k=tabKey(v,a);
  if(!TABS.some(x=>x.k===k)) TABS.push({k,t:title||v,v,a});
  else { const t=TABS.find(x=>x.k===k); if(title) t.t=title; }
  ACTIVE=k; TABS.find(x=>x.k===k).seen=++SEEN;
  if(TABS.length>9){
    let j=-1; TABS.forEach((x,i)=>{ if(i>0&&x.k!==ACTIVE&&(j<0||(x.seen||0)<(TABS[j].seen||0))) j=i });
    if(j>0) TABS.splice(j,1);
  }
}
function closeTab(k,ev){
  if(ev) ev.stopPropagation();
  const i=TABS.findIndex(x=>x.k===k); if(i<0||TABS[i].fixed) return;
  TABS.splice(i,1);
  if(ACTIVE===k){const n=TABS[Math.min(i,TABS.length-1)]; ACTIVE=n.k; view(n.v,n.a,1)}
  else renderTabs();
}
function renderTabs(){
  const el=document.querySelector(".tabbar"); if(!el) return;
  el.innerHTML=TABS.map(t=>`<span class="tab ${t.k===ACTIVE?"on":""}" data-tk="${esc(t.k)}">
    ${ic("workbench")}<span class="lb">${esc(t.t)}</span>
    ${t.fixed?"":`<span class="x" data-tx="${esc(t.k)}">✕</span>`}</span>`).join("")+
   `<span class="gridic" title="关闭其他页签" data-closeother><svg width="19" height="19" viewBox="0 0 20 20" fill="currentColor">

// 演示世界的「今天」—— 必须与 backend/seed.py 的 TODAY 同一天,不用浏览器时钟
const DEMO_TODAY="2026-08-31", DT=DEMO_TODAY.split("-").map(Number);
let CAL={y:DT[0],m:DT[1]};
function calendar(marks){
  const Y=CAL.y,Mo=CAL.m, first=new Date(Y,Mo-1,1), days=new Date(Y,Mo,0).getDate();
  const lead=first.getDay(), prevD=new Date(Y,Mo-1,0).getDate();
  const cells=[];
  for(let i=lead-1;i>=0;i--) cells.push({d:prevD-i,out:1});
  for(let d=1;d<=days;d++) cells.push({d,out:0});
  while(cells.length%7) cells.push({d:cells.length-lead-days+1,out:1});
  const wk=["周日","周一","周二","周三","周四","周五","周六"];
  let html=`<div class="cal"><div class="hd2"><span class="nav" data-cal="-1">‹</span>
    <b>${Y}</b><span style="color:var(--ink3)">|</span><b>${Mo}月</b><span class="nav" data-cal="1">›</span>
    <span class="today" data-cal="0">回到今天</span></div>
   <table><thead><tr>${wk.map(w=>`<th>${w}</th>`).join("")}</tr></thead><tbody>`;
  for(let i=0;i<cells.length;i+=7){
    html+="<tr>"+cells.slice(i,i+7).map(c=>{
      const key=`${Y}-${String(Mo).padStart(2,"0")}-${String(c.d).padStart(2,"0")}`, m=!c.out&&marks[key];
      return `<td class="${c.out?"out":""} ${!c.out&&key===DEMO_TODAY?"today2":""}">
        <span class="dnum">${c.d}</span>${m?`<span class="mk" style="background:${m}"></span>`:""}</td>`}).join("")+"</tr>";
  }
  return html+"</tbody></table></div>";
}

    <div class="note2" style="margin:0 0 14px">
     <b style="color:var(--ink)">导入规则</b>(后台 PRD 6.2)——
     文件不超过 10MB、单次不超过 2000 行;<b style="color:var(--ink)">结构错误整批拒绝</b>;
     行级错误允许部分成功并生成错误报告;重复记录跳过,<b style="color:var(--ink)">疑似重复进入人工确认</b>;
     任务异步执行并使用批次号保证幂等。</div>
    <label>CSV 内容(首行为表头,必需列:姓名、手机号、归属店铺、销售顾问)</label>

   <div class="ft"><button class="btn gray" data-x>取消</button>
    <button class="btn" data-dry>试算</button>
    <button class="btn sol" data-run>确认导入</button></div></div>`;
  document.body.appendChild(m);
  const box=m.querySelector("#impres");
  const run=async dry=>{
    const text=m.querySelector("[data-k]").value;
    const r=await post("/api/import",{text,dry,role:ROLE});

      ${[["跳过",D.skip,"var(--ink3)"],["错误",D.err,"var(--bad)"],["待确认",D.review,"var(--warn)"]]
        .filter(([_,a])=>a.length).map(([t,a,col])=>`<div style="margin-bottom:8px">
         <div style="font-size:12px;color:${col};margin-bottom:4px">${t} ${a.length} 行</div>

     </div>`;
    if(!dry){res(true,"IMPORT",r.reason); setTimeout(()=>{m.remove(); after&&after()},1200)}
  };
  m.querySelector("[data-x]").onclick=()=>m.remove();

const BADCODE=["ACCOUNT_CLOSED","AMOUNT_EXCEED","NOT_APPROVED","INSUFFICIENT_BALANCE","DUPLICATE"];
const STEPS=["未付","已付","退款审批中","退款处理中","已退"];
function stepBar(dep,trace){
  const status=dep.status, bad=status==="退款失败";
  let cur=STEPS.indexOf(status); if(bad) cur=3;
  const t0=(trace&&trace[0]||{}).ts||"", tl=(trace&&trace[trace.length-1]||{}).ts||"";
  const view=[["发起","已付",dep.created],["审批","退款审批中",dep.created],
              ["退款","退款处理中",t0],["完成","已退",status==="已退"?dep.updated:""]];
  return `<div class="steps">${view.map(([t,st,ts],i)=>{
    const idx=STEPS.indexOf(st), cls=idx<cur?"done":idx===cur?"cur":"";
    const mark=idx<cur?'<svg width="12" height="12" viewBox="0 0 14 14" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round"><path d="M3 7.2 5.8 10 11 4.4"/></svg>':(i+1);
    return `<div class="step ${cls}"><span class="c">${mark}</span>
      <span class="t">${t}</span><span class="d mono">${idx<=cur?esc(ts||""):""}</span></div>`}).join("")}</div>`;
}

}

async function genDraft(tid){const b=event.target;b.disabled=true;b.textContent="生成中…";
  const r=await post("/api/draft/"+tid);
  if(r.error){b.disabled=false;b.textContent="重试";
    b.insertAdjacentHTML("afterend",`<div class="err">生成失败:${esc(r.error)}</div>`);return}
  view("task",tid)}
async function mark(tid,s){await post("/api/draft-status/"+tid,{status:s});view("task",tid)}
