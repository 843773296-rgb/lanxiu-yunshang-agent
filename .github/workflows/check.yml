# 全套检查 —— 每次 push 和 PR 自动跑。
#
# ## 为什么要有它
#
# check.sh 的项数由 `grep -c '^run ' check.sh` 数出来(2026-09-17 是 98 项)——
# **全绿不代表安全,「有人记得敲那条命令」才是前提**。
#
# ⚠️ 这个数**不许手抄着维护**:它是 `grep -c '^run ' check.sh` 数出来的,
# 而这份说明恰好是在讲「靠人记得的事迟早有一次不记得」—— 它自己就漂了。
# **一份讲着「别靠人记」的文档,自己靠人记。**
# 而这个项目一路上最反复的教训就是:**靠人记得的事,迟早有一次不记得。**
# 七环体检里「部署」那一环一直挂着,挂的就是这一条。
#
# ## 它跑什么、不跑什么
#
# 跑:**不花钱、不联网调模型**的那些检查(数据勾稽、规则推导、边界审计、
#     判分器对照、回答体检的离线用例……)。
# **不跑:要真调模型的评测**(工具使用 / 成长推算 / 识图)——
# 那些要凭据、要花钱,而且结果有波动,放进门禁会变成随机拦路。
# 它们由人手动跑,结果落在 agent/*-results.jsonl 里进版本库,可比对。
#
# ## 两个已知取舍(写出来,别让人自己撞)
#
# 1. **Python 版本钉成 3.14,和开发机一致。**
#    好处是 CI 不会因为版本差异给假警报;代价是**它查不出跨版本兼容问题**。
#    这个项目是学习/作品集用途,不需要多版本矩阵 —— 真要上线再加。
# 2. **识图那条链在 CI 里跑不了。** backend/img.py 的 SVG 栅格化依赖
#    macOS 自带的 qlmanage,ubuntu runner 上没有。
#    所以 CI 只跑识图**判分器**的 13 条离线对照,不渲染图、不调模型。
name: check

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # 用 v5/v6:v4/v5 还跑在 Node 20 上,GitHub 已标弃用 ——
      # 现在只是警告,但**警告是还没到期的失败**,趁没人催先换掉。
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: agentsite/requirements.txt

      # skills_check.py 要 import claude_agent_sdk,所以这个 venv 是必需的。
      # check.sh 里那一行写死了 ./agentsite/.venv/bin/python,路径要对上。
      - name: 装 agentsite 依赖
        run: |
          python3 -m venv agentsite/.venv
          ./agentsite/.venv/bin/pip install --quiet -r agentsite/requirements.txt

      # 数据库不进版本库(固定种子,确定性生成)—— 克隆下来必须先建。
      #
      # ⚠️ **这里必须用 tools/rebuild.sh,不许手抄步骤。**
      # 2026-09-16 到 09-17,CI **连续 30 次全红,一次都没绿过**,根因就在这一行:
      # 这里原来写的是 `python3 backend/seed.py`,而建库的配方后来变成了 5 步 ——
      # 白坯试衣的 `fitting` 表由 backend/seed_fitting.py 建,
      # 走量数据的 `sim_batch` 表由 tools/simulate_sales.py 建。
      # 少了这两步,seed.py 建出 65 张表(全量是 68 张),于是九项检查
      # 报 `no such table: fitting / sim_batch`。
      #
      # **而本地一直是绿的** —— 本地那份库早就有这两张表,没人会删了重建。
      # 「本地绿」和「从零建得起来」是两件事,它们在开发机上长得一模一样。
      # tools/rebuild.sh 存在的理由就是这句:**步骤只有一处,不在别处手抄一份。**
      # 这个工作流原来就是那"别处"的一份,而它漂了。
      - name: 从零重建数据库(唯一那份配方)
        run: ./tools/rebuild.sh

      # 单独一步,让它失败时一眼看得出是密钥问题而不是别的
      - name: 扫密钥
        run: ./tools/scan_secrets.sh

      # ⚠️ 步骤名里**不写项数**。这份文件顶上那段注释专门说过
      # 「这个数不许手抄着维护」,而这一行自己手抄了一个 33 —— 写下那段话的时候
      # 实际是 95 项,现在是 98 项。**一份讲着「别靠人记」的文档,自己靠人记。**
      # 真实数由 check.sh 自己数出来打在日志里。
      - name: 全套检查
        run: ./check.sh

  # ── 管理后台:**独立一个 job,不塞进上面那个** ──────────────────────────
  #
  # 2026-09-27 并行会话把「澜绣云裳 AI 管理后台」子树合并进 `管理后台/`,
  # 并问要不要把它那批检查接进门禁。**接,但不进上面那个 job。**
  #
  # 理由不是时间(量过:这 93 条是 0.4 秒),是**报告要能回答「谁红了」**:
  # 两套东西挤在一个 job 里,红的时候第一眼分不清是澜绣的数据勾稽红了
  # 还是管理后台的图校验红了 —— 而那是 CI 报告唯一要回答的问题。
  # 同族的教训就在昨天:那次超时被标成 `cancelled` 而不是 `failed`,
  # **报告给不出「红在哪」,人就只能猜**。
  #
  # 顺带一个好处:上面那个 job 的 `timeout-minutes: 20` **一点没被动**。
  # 那条上限 09-26 刚被顶爆过一次(客户数 ×8 让 simulate_sales 占了 14 分 25 秒),
  # 往里加东西是拿一条刚刚修好的上限去赌。独立 job 并行跑,总墙钟时间不变。
  #
  # ## 这里跑「不要数据库」的那些
  #
  #   编排:DSL 语义 · 图校验 · 执行语义 · 知识链 · 索引计划 · Embedding · Agent 对抗
  #        **纯标准库**,系统 python3 直接跑,不装任何东西(实测 0.4 秒)
  #   契约覆盖:只多一个 sqlalchemy,**不要 psycopg、不要库**(实测 0.24 秒)
  #
  # ⚠️ **这段注释里不写总条数了。** 原来写着「186 条 / 编排四组 93 条」——
  # 加了知识链 16 条和索引计划 31 条之后,两个数字都成了假的,而
  # **没有任何一处会因为它们过期而报红**:每条测试自己打印条数,
  # 汇总数字是手抄的。写死的数字和实际会漂,漂了不报错 ——
  # 那就不如不写。(和 `landing.py` 的上限、`progress_report.py` 的下限不同:
  #  那两处写死是**故意的棘轮**,防止跟着实际数量一起涨;
  #  这里是**事实陈述**,事实陈述写死就是会过期。)
  #
  # ⚠️ **「没跑什么」在 job 末尾用 echo 打出来,不只写在这段注释里** ——
  # 注释在 CI 页面上**看不见**,而「这个 job 绿不等于剩下那些也绿」
  # 正是读 CI 的人需要看见的一句。
  # (2026-09-27 这段注释自己就漂过一次:上一版写着「契约那 93 条**没接**」,
  #  而并行会话当天就接上了 —— **一条过期的理由比没有理由更误导**。)
  admin:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'

      # PYTHONPATH 现算,不手抄目录清单 —— 抄一份就会在他们挪目录时漂,
      # 而漂的表现是 `ModuleNotFoundError`,读起来像「代码坏了」而不是「路径过期了」。
      - name: 编排层四组(零依赖,纯标准库)
        working-directory: 管理后台
        run: |
          PP="$(python3 -c "
          import os
          ps=[]
          for root, ds, fs in os.walk('.'):
              if '.venv' in root or '__pycache__' in root: continue
              if any(f.endswith('.py') for f in fs): ps.append(os.path.abspath(root))
          print(':'.join(sorted(set(ps))))")"
          # ⚠️ **变量名必须是 ASCII。** 这一版原来写的是 `红=0` / `|| 红=1` / `exit $红`
          # —— 逻辑是对的,但 **bash 不接受中文变量名**:
          #   `红=0` 被当成命令 → `command not found`(只吐到 stderr)
          #   `$红` 展开成乱码 → `exit: numeric argument required` → 退出码 **255**
          #
          # 这个错的形状值得记:**它在全绿的时候完全看不出来** ——
          # 每条测试都退 0,那两行 `command not found` 淹在日志里,job 是绿的。
          # 而真有一条红的时候它**碰巧也会红**(255),只是**红的理由完全指错方向**:
          # 报的是「参数不是数字」,不是「哪条测试红了」。
          # 而这条注释本来防的正是「最后一条绿盖掉前面的红」。
          #
          # 本地咬合没第一时间抓到它,因为**本地是 zsh、CI 是 bash** ——
          # zsh 允许中文变量名。**「本地能跑」和「CI 能跑」的差别可以只是一个 shell。**
          rc=0
          # ⚠️ 这张清单是**手抄的**,加了新测试要记得加进来 ——
          # 漏一个的表现是「CI 全绿而那组从来没跑过」,而那比红更糟。
          #
          # ⚠️ 2026-09-27 夜发现 `test_reranker` **一直漏在外面**。
          # 我第一版注释写的是「它要 Claude 凭据,CI 里没有」——**那是错的**:
          # 那份测试自己的文件头就写着「零依赖,不发一个请求」,实测纯标准库退 0。
          # 它不是被有意排除的,是被漏掉的。
          #
          # 这一条值得记:**手抄的清单会漏,而漏掉的项和「跑过并通过」在 CI 上长得一样。**
          # (`tools/progress_report.py` 里那份 handler 清单踩过同一个坑,已改成自动发现。)
          for t in test_dsl_semantics test_graph_validation test_execution test_agent_tools \
                   test_knowledge_chain test_index_plan test_embedder test_reranker \
                   test_upload_rules test_storage test_usage test_redact test_evals test_approvals; do
            echo "▸ $t"
            PYTHONPATH="$PP" python3 "tests/orchestration/$t.py" || rc=1
          done
          # **一条都不许被吞** —— for 循环里 `||` 之后必须自己把失败带出来,
          # 不然最后一条绿就把前面的红盖掉了(退出码只剩最后那条的)。
          exit $rc

      # ── 契约覆盖那 93 条:**只多一个 sqlalchemy,不要数据库** ──────────
      #
      # 上一版没接,理由是「`tools/spec_coverage.py` import models,而它要 sqlalchemy」。
      # 量过了:**只装 sqlalchemy 就够** —— `models.py` 只用它**构建 metadata**
      # (`sqlalchemy.dialects.postgresql.JSONB` 是 core 的一部分),
      # **不连库、不要 psycopg**。
      #
      # ⚠️ 这个数是量出来的,不是估的:`pip install sqlalchemy` 之后
      # `spec_coverage.py` 跑 **0.24 秒**。
      # (上一轮我估「加进去大概只多几十秒」,实测差了约 50 倍 ——
      #  这个仓库的习惯是先量再说,我那次是猜的。)
      #
      # 顺带量到一件:探的时候装到的是 sqlalchemy **2.1.1**,而
      # `管理后台/requirements.lock` 钉的是 2.0.54 —— **这 93 条不挑版本**。
      # 所以这里**不钉版本**:钉了就得跟着 lock 一起维护,而它们不需要同步。
      - name: 契约覆盖 + SQL 字符串体检(装 sqlalchemy,仍然不要数据库)
        working-directory: 管理后台
        run: |
          pip install --quiet sqlalchemy
          PP="$(python3 -c "
          import os
          ps=[]
          for root, ds, fs in os.walk('.'):
              if '.venv' in root or '__pycache__' in root: continue
              if any(f.endswith('.py') for f in fs): ps.append(os.path.abspath(root))
          print(':'.join(sorted(set(ps))))")"
          rc=0
          PYTHONPATH="$PP" python3 tools/spec_coverage.py || rc=1
          echo ""
          # ⚠️ `test_ingest` 在**这一步**而不是上面那一步:它测的是
          # `knowledge/ingest.py` 的纯逻辑,而那个模块 import sqlalchemy
          # (它同时管写库)。放上面会报 ModuleNotFoundError ——
          # 2026-09-27 真的红过两次,而**本地是绿的**:本地 venv 里有 sqlalchemy。
          # > 「本地能跑」和「CI 能跑」的差别可以只是一个装了的包。
          # 现在 `tools/check_zero_dep.py` 用系统 python3 把那一步真跑一遍,
          # 于是这件事在本地就能发现(进了 make test-orchestration)。
          echo "▸ test_ingest(要 sqlalchemy,所以在这一步)"
          PYTHONPATH="$PP" python3 tests/orchestration/test_ingest.py || rc=1
          echo ""
          # SQL 字符串体检也在这一步 —— 它**故意**依赖 sqlalchemy:
          # 判据是「问 SQLAlchemy 认出了哪些绑定参数」,不是自己写正则
          # (第一版自己写,17 处里 15 处是误报)。
          # ⚠️ `|| rc=1` 不能省 —— 后面还有一条命令,不带它最后那条绿就把这条的红盖掉。
          PYTHONPATH="$PP" python3 tools/sql_lint.py || rc=1
          echo ""
          # ⚠️ Shell 体检:**bash 不接受中文变量名**。这个坑踩过三次,
          # 其中一次(`红=0` / `exit $红`)就在这个 workflow 里,
          # 而它**在全绿的时候完全看不出来**:每条测试都退 0,
          # job 却退 255,报的是「参数不是数字」——**红的理由完全指错方向**。
          # 本地发现不了是因为**本地 zsh 允许中文变量名,CI 的 bash 不允许**。
          PYTHONPATH="$PP" python3 tools/shell_lint.py || rc=1
          exit $rc

      # ── 还没接的,写下来 ────────────────────────────────────────────
      #
      # ⚠️ **绿了之后没人会去数。** 一个跑了 93 条的绿勾和一个跑了 186 条的绿勾,
      # 在页面上长得一模一样 —— 所以「没接哪些」必须写在这儿。
      #
      # 现在这个 job 跑:编排四组 93 条 + 契约覆盖 93 条 = **186 条**。
      # **还没接的**(都要 PostgreSQL + alembic 迁移 + seed,所以留在本地):
      #   · 跨项目攻击 7 条      tests/integration/test_project_isolation.py
      #   · 任务租约攻击 16 条   tests/integration/test_worker_lease.py
      #   · 端到端 44 条         tests/e2e/test_api_flow.py          (要先起服务)
      #   · 编排端到端 44 条     tests/e2e/test_orchestration_flow.py(要先起服务)
      #   · 六页页面冒烟 + 画布/Agent 页结构对账(要 node + 起服务)
      # 也就是说:**这个 job 绿 ≠ 那 111 条也绿**。它证明的是
      # 「契约、DSL 语义、图校验、执行语义、工具边界」这五层从零跑得起来。
      - name: 说清这个 job **没**跑什么
        working-directory: 管理后台
        run: |
          # ⚠️ **这里不写总条数。** 上面各条测试自己打印了各自的条数,
          # 在这儿手抄一个汇总数,加一组测试就会变成假话 —— 而没有任何检查会红。
          echo "✅ 这个 job 跑完了,零数据库。跑的是:"
          echo "   契约覆盖 · SQL 体检 · DSL 语义 · 图校验 · 执行语义 · 知识链 · 索引计划"
          echo "   · Embedding · Agent 对抗"
          echo "   (每组的条数看上面各自的输出)"
          echo ""
          echo "⚠️ **没跑**:跨项目攻击 / 租约攻击 / 端到端 / 编排端到端 / 六页冒烟"
          echo "   —— 它们要 PostgreSQL + 迁移 + seed(+ 起服务),留在本地。"
          echo "   **这个 job 绿不等于那些也绿。**"
          echo ""
          echo "逐项进度看 管理后台/docs/实现进度.md(make progress 生成)——"
          echo "   那份是现算的,**不要在这儿复述它的数字**(复述一次就开始漂)。"

  # ── 管理后台的**端到端**:带 PostgreSQL + pgvector ──────────────────────
  #
  # ⚠️ 2026-10-01 加的。在这之前**那 773 条端到端在 CI 里一条都没跑过** ——
  # 上面那个 `admin` job 只跑「不要数据库」的那些(编排四组 + 契约)。
  # 也就是说本地 773 条全绿,而 CI **从来没验过它们**。
  # 而这正是本仓 CI 提示里那句话说的:
  # > 本地留着历次跑出来的产物,CI 每次从零 ——
  # > 两者**只有在「从零建得起来」这件事上会分岔**。
  #
  # **独立一个 job**,和 `admin` / `check` 一样 —— 理由同 `admin` 那段:
  # 报告要能回答「谁红了」。而且这一个要起数据库和两个进程,
  # 它红的原因和前两个完全不是一类。
  #
  # ⚠️ 它跑的是 `make test-e2e-ci`,**不是 `test-e2e`** ——
  # 排掉两份要真调 Claude 精排的(月租额度;CI 里没凭据)和一份要真浏览器的。
  # 排掉哪几份、为什么,写在 `tools/test_registry_check.py` 的 `CI跳过` 里,
  # 而那条判据会验「**没有谁从两个名单之间漏掉**」——
  # 排掉一份是个决定,**漏掉一份是个事故**,而它们在 Makefile 上长得一样。
  admin-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        # ⚠️ 用 `pgvector/pgvector` 而不是官方 `postgres` 镜像 ——
        # 知识索引那几张表上有 `vector` 列,官方镜像里**没有这个扩展**,
        # 而缺扩展的表现是 `alembic upgrade` 在建表那一步炸,
        # 报的是「type vector does not exist」,读起来像迁移写错了。
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: aimc_dev
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql+psycopg://postgres:ci@localhost:5432/aimc_dev
      APP_ENV: development
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 装依赖(照 requirements.lock,不是 requirements.txt)
        working-directory: 管理后台
        run: |
          python3 -m venv .venv
          ./.venv/bin/pip install -q --upgrade pip
          # ⚠️ 装**锁文件**。装 requirements.txt 的话 CI 和本地可能装到不同版本,
          # 而那时「CI 红了」和「代码坏了」分不开。
          ./.venv/bin/pip install -q -r requirements.lock

      - name: 建库 + 迁移 + 验契约和库一致
        working-directory: 管理后台
        run: |
          # pgvector 扩展:镜像里有,但要在这个库上 `create extension`。
          ./.venv/bin/python -c "
          import os
          from sqlalchemy import create_engine, text
          e = create_engine(os.environ['DATABASE_URL'])
          with e.begin() as c:
              c.execute(text('create extension if not exists vector'))
          print('pgvector 启用了')"
          cd services/api && ../../.venv/bin/alembic upgrade head
          # ⚠️ `alembic check` 验的是「契约和库一致」—— 它和 upgrade 不是一回事:
          # upgrade 只说迁移跑完了,check 说**跑完之后的库和模型对得上**。
          ../../.venv/bin/alembic check

      - name: 灌演示数据 + 夹具
        working-directory: 管理后台
        run: |
          ./.venv/bin/python services/api/app/seed_demo.py
          ./.venv/bin/python tools/seed_datasets.py
          ./.venv/bin/python tools/seed_training.py
          # ⚠️ **三份 seed 脚本默认是 dry-run** —— 不加 `--做` 它们一行都不写,
          # 而**退出码是 0**:`seed_pricing` / `seed_evals` / `seed_human_requests`。
          # > 一个默认不写、而且退出 0 的脚本,和一个写成功的脚本,
          # > **在 CI 日志的绿勾上长得一模一样**。
          #
          # 这条栽过两次。10-01 我修了 `seed_evals` 那一份,**而没问
          # 「还有哪几份是这个形状的」** —— 于是 10-02 又撞了两份:
          #   · `seed_pricing` 没灌 → `test_usage_flow` 挂 3 条,
          #     而报出来的是「没有 deepseek/deepseek-v4-pro 的价目表快照」
          #     (看起来像模型名错了,其实是整张表空的)
          #   · `seed_human_requests` 没灌 → `test_handover_flow` 红,
          #     **而我上一轮把它误诊成「从零建库没有 execution_run」**
          # > **单点修复和规则修复的差别,就在「还有哪几份」这一问上。**
          # 现在有 `tools/seed_flag_check.py` 盯着这件事(门禁里),
          # 它比对 workflow 的调用行和脚本的 `--做` 参数。
          ./.venv/bin/python tools/seed_pricing.py --做
          ./.venv/bin/python tools/seed_evals.py --做
          # ⚠️ 这一步的历史值得留着 —— 它连着塌了三处。
          #
          # 原来 `seed_human_requests.py` 要求库里先有一次 `execution_run`
          # (待办挂在运行上,外键),**而运行是测试跑出来的** ——
          # 灌数据这一步必然还没有。于是它一直退 1、被 `|| echo` 兜着,
          # 附一段「这是预期的」的说明。那段说明给了一个**错的放心**:
          #   · 它底下 `test_handover_flow` **整份测试一条断言都不跑**
          #   · `#/human` 页面冒烟只能走空列表那条路 ——
          #     「列表上有数据」那条渲染路径 CI 从来没盖住
          #   · `ifmatch_reachable_check` 拿不到样例待办,于是
          #     `POST /human-requests/{id}/decisions` 那条什么都没验到
          # > **一个有意容错的步骤,和一个真的坏了的步骤,在绿勾上长得一模一样。**
          #
          # 10-02 改掉的是**根上那一条**:那个脚本现在没有运行就自己造一条
          # 底座(固定 id + do nothing,所以跑第二遍不会多一条)。
          # 于是这里不再需要容错 —— **口子关掉,失败就是失败。**
          ./.venv/bin/python tools/seed_human_requests.py --做
          # ⚠️ **把澜绣那 79 条铁律导进来** —— 10-02 加。
          # 它建 `project_lanxiu`(后台第一个真实项目)并导入
          # `prompts.py` 的 79 条 Rule。页面冒烟里有一段专跑这个项目,
          # **不导的话那一段在 CI 上必红** —— 而它报出来会像「页面渲错了」。
          # 这个脚本**默认就写**(要只看用 `--看`),所以没有
          # 「默认 dry-run 而且退出 0」那个坑。
          ./.venv/bin/python tools/import_lanxiu_prompts.py
          # ⚠️ **工具目录也要导** —— 10-04 加,补的是一个一直存在的缺口。
          #
          # 上面那一步导的是**铁律**,而工具目录从来没导过,于是
          # `lanxiu_tool_sync_check` 这条判据**在 CI 上一次都没跑过**。
          # 它最要紧的一档是「**副作用档位变了**」——
          # 后台标着「只读」而澜绣那边已经会写了,**后台的闸会放过它**。
          # > 「说明改了一个字」和「从只读变成会写」在哈希上长得一样,
          # > 所以那条判据把后者单独报。
          #
          # 这两件事是**一对**:不导就必红(和上面那条铁律一样),
          # 而红出来会像「判据坏了」。
          ./.venv/bin/python tools/import_lanxiu_tools.py --项目 project_lanxiu
          # ⚠️ **把澜绣的语料导进知识库** —— 10-02 加(搬家说明第三条待办)。
          # 两批:`业务决策/`(口径原文)和 `knowledge/`(手写领域知识)。
          # **项目要点名** —— 这个脚本原来是「导进第一个」,而那取决于
          # 建项目的顺序;09-27 那 5 篇业务拍板就是这么落进演示项目的。
          # 不导的话 `lanxiu_kb_sync_check` 在 CI 上会红,
          # **而它报出来会像「判据坏了」** —— 所以这一步和那条判据是一对。
          ./.venv/bin/python tools/ingest_lanxiu.py --批次 业务拍板 --项目 project_lanxiu
          ./.venv/bin/python tools/ingest_lanxiu.py --批次 领域知识 --项目 project_lanxiu
          # ⚠️ **演示项目也要灌一批** —— 2026-10-08 加,CI 为它红过一次。
          # 页面冒烟用的是**默认身份 U002 看得到的那个项目**(project_demo_a),
          # 而 `project_lanxiu` 只有 U001/U007 是成员。于是详情页冒烟里
          # 知识链那三页(#/kb/{id} · #/chunks/{id} · #/chunk/{id})
          # **在 CI 上取不到 id**:knowledge_bases / chunks 在 demo 项目里一条都没有。
          #
          # 本地之所以是绿的,是因为**我本地跑过**这条命令的 demo 版本 ——
          # > 「本地留着历次跑出来的产物,CI 每次从零」最典型的一例:
          # > 一个「12 个详情页都冒烟了」的报告,和一个「其中 3 个因为没数据
          # > 而跳过」的,**在那份名单上长得一模一样**。
          # ⚠️ 修法不是把 `detail_page_hashes.py --钉住` 调大 ——
          # 那等于承认那三页在 CI 上永远不被冒烟。该让 CI 有那份数据。
          ./.venv/bin/python tools/ingest_lanxiu.py --批次 业务拍板 --项目 project_demo_a

      - name: 起 API + Worker,**等到就绪**(不是等固定秒数)
        working-directory: 管理后台
        run: |
          : > /tmp/aimc-worker.log
          # ⚠️ **起法要和 `tools/dev.sh` 一致** —— 它是 `cd services/api/app`
          # 之后 `uvicorn main:app`,不是 `-m uvicorn app.main:app --app-dir`。
          # 我第一版照后者写(猜的),而猜错的表现是 `ModuleNotFoundError`,
          # 读起来像代码坏了。**本地实测过这一行再提交**,不让 CI 替我试错。
          nohup ./.venv/bin/python workers/worker.py > /tmp/aimc-worker.log 2>&1 &
          ( cd services/api/app && \
            nohup ../../../.venv/bin/uvicorn main:app \
              --host 127.0.0.1 --port 8801 > /tmp/aimc-api.log 2>&1 & )
          # ⚠️ **等到就绪,不是 sleep 固定秒数。**
          # 固定窗口在 CI 上必然有一天不够 —— 而那时红的理由是
          # 「连不上服务」,离真因(还没起来)只有一步,却会让人去查代码。
          ok=0
          for i in $(seq 1 60); do
            if curl -sf -m 2 http://127.0.0.1:8801/api/healthz >/dev/null 2>&1 \
               && grep -q "worker 起来了" /tmp/aimc-worker.log 2>/dev/null; then
              ok=1; break; fi
            sleep 1
          done
          if [ "$ok" != 1 ]; then
            echo "❌ 60 秒还没就绪"; echo "--- api ---"; tail -40 /tmp/aimc-api.log
            echo "--- worker ---"; tail -40 /tmp/aimc-worker.log; exit 1; fi
          echo "✅ 服务和 Worker 都就绪了"

      - name: 端到端(CI 版)+ 页面冒烟 + 行级对账
        working-directory: 管理后台
        run: make test-e2e-ci

      - name: 要服务在跑才能验的那几条判据
        working-directory: 管理后台
        run: |
          rc=0
          ./.venv/bin/python tools/ifmatch_reachable_check.py || rc=1
          ./.venv/bin/python tools/seed_rerun_check.py || rc=1
          # ⚠️ 下面三条**只要库**,不要服务 —— 放这儿是为了和上面两条
          # **共用这个 `rc` 收口**(它们各自 `|| rc=1`,最后一次性 exit)。
          # 这三条验的是「**控制面显示的 == 执行层在用的**」,
          # 而导入是单向的:文件改了后台不会自己跟上,
          # **而那时后台那一页看起来完全正常**。
          # 10-04 之前它们只装在 `make test` 里 —— 那是个没人跑的目标。
          # > **一条判据装在一个我从来没跑过的目标里,等于没装。**
          ./.venv/bin/python tools/lanxiu_prompt_sync_check.py || rc=1
          ./.venv/bin/python tools/lanxiu_kb_sync_check.py || rc=1
          ./.venv/bin/python tools/lanxiu_tool_sync_check.py || rc=1
          exit $rc

      - name: 挂了就把两个日志尾部贴出来
        if: failure()
        working-directory: 管理后台
        run: |
          echo "--- api ---"; tail -60 /tmp/aimc-api.log || true
          echo "--- worker ---"; tail -60 /tmp/aimc-worker.log || true

      - name: 说清这个 job **没跑**什么
        if: always()
        run: |
          # ⚠️ 「没跑什么」要**用 echo 打出来**,不只写在注释里 ——
          # 注释在 CI 页面上**看不见**,而「这个 job 绿不等于端到端全验过」
          # 正是读 CI 的人需要看见的一句。
          echo "⚠️ 这个 job **没跑**:"
          echo "   · test_knowledge_flow / test_knowledge_write_flow 里"
          echo "     那两条**会真调 Claude 精排**的(月租额度,CI 里没凭据)"
          echo "   · test_upload_page_firefox(要可见的 Firefox 窗口)"
          echo "   · 要真 Embedding 模型的那些(.models/ 96MB,不进 git)"
          echo "   **所以这个 job 绿 ≠ 端到端全验过了。**"
